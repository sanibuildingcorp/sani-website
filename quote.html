<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your Estimate | Sani Building Corp</title><style>:root{--n:#10273f;--g:#c9a53a;--p:#f7f4ee;--l:#e5ded1;--gr:#1f8a5b;--r:#b84747}*{box-sizing:border-box}body{margin:0;background:var(--p);color:#152235;font-family:Arial,sans-serif;line-height:1.5}.top{background:#253442;color:#fff;padding:22px}.brand,.wrap{max-width:820px;margin:auto}.brand{font-weight:900;letter-spacing:4px}.brand span{color:#e0bd51}.wrap{padding:20px 14px 80px}.hero,.head{background:var(--n);color:#fff}.hero{padding:24px;border-radius:16px}.hero h1{margin:6px 0;font-size:27px}.ey{font-size:10px;letter-spacing:2px;color:#e0bd51;font-weight:bold;text-transform:uppercase}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.meta div{border-top:1px solid #ffffff33;padding-top:8px;font-size:12px}.meta small{display:block;color:#aebdca;text-transform:uppercase}.card,.svc{background:#fff;border:1px solid var(--l);border-radius:14px;margin-top:14px}.card{padding:16px}.prices{overflow:hidden}.pr{display:flex;justify-content:space-between;padding:11px 15px;border-top:1px solid #eee}.pr.total{background:var(--n);color:#fff;font-size:21px;font-weight:bold}.head{padding:14px 16px;display:flex;justify-content:space-between;gap:15px}.head h2{margin:2px 0 0;font-size:18px}.head b{white-space:nowrap}.body{padding:15px}.label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:bold;margin:12px 0 6px}.in{color:var(--gr)}.sup{color:#9a7620}.out{color:var(--r)}ul{list-style:none;padding:0;margin:0}li{padding:5px 0 5px 21px;border-bottom:1px dashed #eee;font-size:13px;position:relative}li:before{position:absolute;left:0}.inlist li:before{content:'✓';color:var(--gr)}.suplist li:before{content:'◆';color:var(--g)}.outlist li:before{content:'—';color:var(--r)}details{margin-top:12px;border-top:1px solid #eee;padding-top:10px}summary{font-size:12px;font-weight:bold;cursor:pointer}.lines{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}.lines td{padding:6px;border-bottom:1px solid #eee}.lines td:last-child{text-align:right}.opts{background:#fbf7ea;border:1px solid #ead9a4;border-radius:10px;padding:10px;margin-top:12px}.opt{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #eadfbd}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button{padding:14px;border:0;border-radius:10px;font-weight:bold}.approve{background:var(--g)}.ask{background:#fff;border:1px solid #ccc}.panel{display:none}.panel.open{display:block}.panel input,.panel textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.status{margin-top:10px}.footer{text-align:center;font-size:11px;color:#777;padding:25px}@media(max-width:600px){.meta{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><span>SANI</span> BUILDING CORP</div></header><main class="wrap" id="app">Loading estimate…</main><footer class="footer">Fully Insured · (332) 277-0990 · contact@sanibuildingcorp.com</footer><script>(()=>{const q=new URLSearchParams(location.search),ref=q.get('ref'),app=document.getElementById('app');let rec;const A=v=>Array.isArray(v)?v:[],E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),M=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),N=s=>String(s??'').toLowerCase(),LT=l=>(+l.qty||0)*(+l.rate||0);function sec(l){if(l.section&&N(l.section)!=='general')return l.section;let x=N(l.item);return /window/.test(x)?'Windows':/paint|prime|patch/.test(x)?'Painting':/floor|hardwood|subfloor/.test(x)?'Flooring':/bath|shower|tile|vanity|toilet|plumb|glass/.test(x)?'Bathroom':'General'}function calc(e){let l=A(e.labor).reduce((s,x)=>s+LT(x),0),m=A(e.materials).reduce((s,x)=>s+LT(x),0),k=1+(+e.markupPct||0)/100;return{total:rec.customerFinalTotal!=null?+rec.customerFinalTotal:(l+m)*k,k}}function services(e){if(A(e.serviceBreakdown).length)return e.serviceBreakdown;let map={},order=[];const get=n=>{n=n||'General';if(!map[n]){map[n]={title:n,included:[],customerSupplies:[],notIncluded:[],subtotal:0,options:[]};order.push(n)}return map[n]};A(e.scopeSections).forEach(s=>get(s.title).included.push(...A(s.items)));[...A(e.labor),...A(e.materials)].forEach(x=>{let s=sec(x);get(s).subtotal+=LT(x)*calc(e).k});A(e.customerSupplied).forEach(x=>get(x.section||'General').customerSupplies.push(typeof x==='string'?x:x.item));A(e.exclusions).forEach(x=>get(/window/i.test(x)?'Windows':/paint/i.test(x)?'Painting':/floor|hardwood/i.test(x)?'Flooring':/bath|tile|shower|vanity|toilet/i.test(x)?'Bathroom':'General').notIncluded.push(x));A(e.options).forEach(x=>get(x.section||'General').options.push(x));return order.map(x=>map[x])}function list(label,cl,a){if(!A(a).length)return'';return`<div class="label ${cl}">${label}</div><ul class="${cl}list">${A(a).map(x=>`<li>${E(x)}</li>`).join('')}</ul>`}function lines(e,s){let z=[];if(e.showLaborLines===true)z.push(...A(e.labor).filter(x=>N(sec(x)).includes(N(s.title))).map(x=>({...x,t:'Labor'})));if(e.showMaterialLines===true)z.push(...A(e.materials).filter(x=>N(sec(x)).includes(N(s.title))).map(x=>({...x,t:'Material'})));return z.length?`<details><summary>View detailed labor & materials (${z.length})</summary><table class="lines">${z.map(x=>`<tr><td>${x.t}</td><td>${E(x.item)}</td><td>${M(LT(x)*calc(e).k)}</td></tr>`).join('')}</table></details>`:''}function render(r){rec=r;let e=r.estimate||{},c=r.customer||{},rq=r.request||{},sv=services(e),ct=calc(e),rows=sv.filter(x=>x.subtotal>0).map(x=>`<div class="pr"><b>${E(x.title)}</b><b>${M(x.subtotal)}</b></div>`).join('');app.innerHTML=`<section class="hero"><div class="ey">Estimate ${E(ref)}</div><h1>${E(e.projectTitle||rq.service||'Renovation Estimate')}</h1><p>${E(c.address||'NYC Metro')}</p><div class="meta"><div><small>Prepared for</small>${E(c.name)}</div><div><small>Status</small>${E(e.estimateStatus||'Ready')}</div><div><small>Timeline</small>${E(e.timelineText||'TBD')}</div><div><small>Total</small>${M(ct.total)}</div></div></section><section class="card"><div class="ey">Project summary</div><p>${E(e.summary||'Estimate based on the project information provided.')}</p></section><section class="card prices"><div class="ey" style="padding:0 0 8px">Price by service</div>${e.showSectionSubtotals!==false?rows:''}<div class="pr total"><span>Your estimate</span><span>${M(ct.total)}</span></div></section>${sv.map((s,i)=>`<section class="svc"><div class="head"><div><div class="ey">Service ${i+1}</div><h2>${E(s.title)}</h2></div><b>${M(s.subtotal)}</b></div><div class="body">${list('Included in this service','in',s.included)}${list('Customer supplies','sup',s.customerSupplies||s.customerSupplied)}${list('Not included','out',s.notIncluded||s.exclusions)}${A(s.options).length?`<div class="opts"><div class="label">Alternate options</div>${A(s.options).map(o=>`<div class="opt"><span>${E(o.label)}</span><b>${M(o.price)}</b></div>`).join('')}</div>`:''}${lines(e,s)}</div></section>`).join('')}<section class="actions"><button class="approve" onclick="P('a')">Approve estimate</button><button class="ask" onclick="P('q')">Request changes / ask a question</button></section><section class="card panel" id="a"><input id="sig" value="${E(c.name||'')}"><button class="approve" onclick="S('accept')">Confirm approval</button></section><section class="card panel" id="q"><textarea id="msg" placeholder="Tell us what you would like changed or clarified"></textarea><button class="approve" onclick="S('question')">Send message</button></section><div id="st" class="status"></div>`;new Image().src='/.netlify/functions/track-quote-open?ref='+encodeURIComponent(ref)+'&_='+Date.now()}window.P=id=>{document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));document.getElementById(id).classList.add('open')};window.S=async a=>{let p={ref,action:a,finalTotal:calc(rec.estimate||{}).total};if(a==='accept')p.signature=document.getElementById('sig').value;if(a==='question')p.questionText=document.getElementById('msg').value;let r=await fetch('/.netlify/functions/quote-response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),j=await r.json();document.getElementById('st').textContent=r.ok?'Thank you. We received your response.':(j.error||'Please call us at (332) 277-0990.')};if(!ref){app.textContent='Estimate link is incomplete.';return}fetch('/.netlify/functions/get-estimate?ref='+encodeURIComponent(ref),{cache:'no-store'}).then(r=>r.json()).then(j=>render(j.record||j.estimateRecord||j.data||j)).catch(e=>app.textContent='Could not load estimate: '+e.message)})();</script></body></html>
