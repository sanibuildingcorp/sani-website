  main.notIncluded=U([...A(main.notIncluded),...A(ps.excluded||ps.notIncluded)]);
 });
 return active}
function list(label,cl,a){a=U(a);if(!a.length)return'';return`<div class="label ${cl}">${label}</div><ul class="${cl}list">${a.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`}
function inSvc(x,s){const sec=C(x.section);return (sec&&sec===s.title)||trade(x.item,x.section)===s.title}
function details(e,s){
 /* A breakdown is a LIST of what the customer is getting. Whether it carries prices
    is a separate decision (showLaborLinePrices / showMaterialLinePrices, default OFF)
    so the contractor can show WHICH materials he will use without publishing what he
    pays for each one. A price is printed only when that flag is on AND the matching
    cost toggle is on - otherwise the table would print the very costs the contractor
    chose to hide, which is what it used to do. */
 const ct=calc(e);
 let z=[];
 if(e.showLaborLines===true)A(e.labor).filter(x=>inSvc(x,s)&&!isOption(x.item)).forEach(x=>z.push({...x,t:'Labor',price:(e.showLaborLinePrices===true&&ct.showLabor)}));
 if(e.showMaterialLines===true)A(e.materials).filter(x=>inSvc(x,s)&&!isOption(x.item)).forEach(x=>z.push({...x,t:'Material',price:(e.showMaterialLinePrices===true&&ct.showMat)}));
 if(!z.length)return'';
 const anyPrice=z.some(x=>x.price);
 const label=anyPrice?'View detailed labor & materials':'View what is included in detail';
 return `<details><summary>${label} (${z.length})</summary><table class="lines">${z.map(x=>`<tr><td>${x.t}</td><td${x.price?'':' colspan="2"'}>${E(itemText(x.item))}</td>${x.price?`<td>${M(LT(x)*ct.k)}</td>`:''}</tr>`).join('')}</table></details>`}
function isV7(e){
 /* Which LAYOUT to render, not which WORDING to use.
    This used to require customerScopePublished===true, which meant a perfectly good
    v7 estimate rendered as the plain legacy scope dump until the contractor happened
    to press Publish. Publishing controls the wording of the service cards; it must
    never decide whether the service layout exists at all.
    Also falls back to "does this estimate actually carry service data", so a future
    rename of customerPresentationVersion cannot silently drop the layout again. */
 const v=C(e.customerPresentationVersion);
 if(/^v8\.\d+-deterministic-four-service/.test(v))return true;
 if(v==='v7-service-proposal')return true;
 if(C(e.customerViewPublishedVersion)==='v7')return true;
 if(e.customerScopePublished===true&&e.publishedCustomerScope&&A(e.publishedCustomerScope.services).length)return true;
 return A(e.serviceBreakdown).length>0}
function isApproved(r){return /accept|approv|invoic|complete/i.test(C(r.status))||!!r.acceptedAt||!!r.approvedAt||N(r.customerResponse&&r.customerResponse.action)==='accept'}
function legacyScope(e){if(C(e.scopeOfWork))return C(e.scopeOfWork);let s=A(e.scopeSections).map(x=>`${C(x.title)}\n${A(x.items).map(i=>'• '+C(i)).join('\n')}`).join('\n\n');if(s)return s;return C(e.summary)}
/* ── THE PORTAL ───────────────────────────────────────────────────────────────
   One link, for good. The same ?ref= that carried the estimate carries the whole
   job afterwards: what it is, what it costs, every word either side has said, and
   whatever action is still open. It does not become a dead end when the status
   changes - a customer who wants to ask something six months after approving has
   exactly one place to go, and it is the place their price is written down. */
function fmtWhen(iso){
 const d=new Date(iso);if(!isFinite(d.getTime()))return'';
 return d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
/* Sticky project bar. Present on every render, not only the first. */
function pinHtml(r,ct){
 const e=r.estimate||{},rq=r.request||{};
 return `<div class="pin"><div class="pl"><div class="pref">Estimate ${E(ref)}</div><div class="ptit">${E(e.projectTitle||rq.service||'Your project')}</div></div><div class="pr2">${M(ct.total)}</div></div>`}
/* One photo of the job, if there is one. Photos live in two places depending on
   how the record was created; take the first that actually carries image data. */
function heroPhoto(r){
 const rq=r.request||{},e=r.estimate||{};
 const p=[...A(rq.photos),...A(e.quotePhotos)].find(x=>x&&x.data);
 if(!p)return'';
 return `<img class="heroimg" alt="Your project" src="${E(p.data)}">`}
/* NOTHING IS EVER DELETED. Oldest first, both sides, every date kept. If there is
   ever a disagreement about what was agreed, this list is the answer - which is
   why it renders straight from the stored thread and never filters it. */
function threadInner(r){
 const t=A(r.thread);
 if(!t.length)return'<p class="muted" style="margin:2px 0 0">No messages yet. Anything you send below stays here permanently, and we are notified straight away.</p>';
 return `<div class="thr">${t.map(m=>{
  const mine=m.from!=='contractor';
  return `<div class="msg ${mine?'me':'them'}"><div class="msgmeta">${mine?'You':'Sani Building Corp'}${fmtWhen(m.at)?' · '+E(fmtWhen(m.at)):''}</div>${E(m.text)}</div>`}).join('')}</div>`}
function threadHtml(r){
 return `<section class="card" id="thread-card"><div class="ey">Messages</div><div id="thread-wrap">${threadInner(r)}</div></section>`}
/* The approve buttons disappear once approved. THE MESSAGE BOX NEVER DOES.
   Before this, an approved estimate rendered a single "already approved" line and
   nothing else, so the link a customer had been given became a dead end the moment
   they used it - during the job, when they have the most to ask. */
function messageBox(open){
 return `<section class="card panel${open?' open':''}" id="q"><div class="ey" style="margin-bottom:6px">Send us a message</div><textarea id="msg" rows="3" maxlength="4000" placeholder="Ask a question, or tell us what you would like changed"></textarea><button class="approve" id="sendbtn" onclick="S('question')">Send message</button><div id="st" class="sendnote"></div></section>`}
function actionHtml(c,approved){
 if(approved)return`<div class="approved">✓ This estimate has been approved. The approved scope and price remain on record, and this link stays live for the whole job — message us here any time.</div>${messageBox(true)}`;
 return`<section class="actions"><button class="approve" onclick="P('a')">Approve estimate</button><button class="ask" onclick="P('q')">Request changes / ask a question</button></section><section class="card panel" id="a"><input id="sig" value="${E(c.name||'')}"><button class="approve" onclick="S('accept')">Confirm approval</button></section>${messageBox(false)}`}
function renderLegacy(r){rec=r;let e=r.estimate||{},c=r.customer||{},rq=r.request||{},ct=calc(e),approved=isApproved(r);app.innerHTML=`${pinHtml(r,ct)}<section class="hero"><div class="ey">Estimate ${E(ref)}</div><h1>${E(e.projectTitle||rq.service||'Renovation Estimate')}</h1><p>${E(c.address||'NYC Metro')}</p><div class="meta"><div><small>Prepared for</small>${E(c.name)}</div><div><small>Status</small>${E(approved?'Approved':(e.estimateStatus||r.status||'Sent'))}</div><div><small>Timeline</small>${E(e.timelineText||'TBD')}</div><div><small>Total</small>${M(ct.total)}</div></div>${heroPhoto(r)}</section><section class="card"><div class="ey">Project summary</div><p>${E(e.summary||'Estimate based on the project information provided.')}</p></section><section class="card"><div class="ey">Scope of work</div><div class="scope-text">${E(legacyScope(e)||'Please refer to the estimate details provided by Sani Building Corp.')}</div></section><section class="card prices">${costRows(e,ct)}<div class="pr total"><span>Your estimate</span><span>${M(ct.total)}</span></div></section>${threadHtml(r)}${actionHtml(c,approved)}`;track()}
function renderV7(r){rec=r;let e=r.estimate||{},c=r.customer||{},rq=r.request||{},sv=build(e),ct=calc(e),approved=isApproved(r),rows=sv.map(x=>`<div class="pr"><b>${E(x.title)}</b><b>${M(x.subtotal)}</b></div>`).join('');app.innerHTML=`${pinHtml(r,ct)}<section class="hero"><div class="ey">Estimate ${E(ref)}</div><h1>${E(e.projectTitle||rq.service||'Renovation Estimate')}</h1><p>${E(c.address||'NYC Metro')}</p><div class="meta"><div><small>Prepared for</small>${E(c.name)}</div><div><small>Status</small>${E(approved?'Approved':(e.estimateStatus||'Ready'))}</div><div><small>Timeline</small>${E(e.timelineText||'TBD')}</div><div><small>Total</small>${M(ct.total)}</div></div>${heroPhoto(r)}</section><section class="card"><div class="ey">Project summary</div><p>${E(e.summary||'Estimate based on the project information provided.')}</p></section><section class="card prices"><div class="ey" style="padding:0 0 8px">Price by service</div>${e.showSectionSubtotals!==false?rows:''}${costRows(e,ct)}<div class="pr total"><span>Your estimate</span><span>${M(ct.total)}</span></div></section>${sv.map((s,i)=>`<section class="svc"><div class="head"><div><div class="ey">Service ${i+1}</div><h2>${E(s.title)}</h2></div><b>${M(s.subtotal)}</b></div><div class="body">${list('Included in this service','in',s.included)}${list('Customer supplies','sup',s.customerSupplies)}${list('Not included','out',s.notIncluded)}${A(s.options).length?`<div class="opts"><div class="label">Alternatives</div>${A(s.options).map(o=>`<div class="opt"><span><b>${E(o.label)}</b>${o.description?`<div class="muted">${E(o.description)}</div>`:''}</span><b>${M(o.price)}</b></div>`).join('')}</div>`:''}${details(e,s)}</div></section>`).join('')}${threadHtml(r)}${actionHtml(c,approved)}`;track()}
function render(r){let e=(r&&r.estimate)||{};if(isV7(e))renderV7(r);else renderLegacy(r)}
function track(){new Image().src='/.netlify/functions/track-quote-open?ref='+encodeURIComponent(ref)+'&_='+Date.now()}
window.P=id=>{document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));let el=document.getElementById(id);if(el)el.classList.add('open')};
window.S=async a=>{
 const st=document.getElementById('st'),box=document.getElementById('msg'),btn=document.getElementById('sendbtn');
 const p={ref,action:a,finalTotal:calc(rec.estimate||{}).total};
 if(a==='accept')p.signature=document.getElementById('sig').value;
 if(a==='question'){
  p.questionText=(box&&box.value||'').trim();
  if(!p.questionText){if(st){st.className='sendnote bad';st.textContent='Write a message first.'}return}
 }
 if(st){st.className='sendnote';st.textContent='Sending…'}
 if(btn)btn.disabled=true;
 let rr,j;
 try{
  rr=await fetch('/.netlify/functions/quote-response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  j=await rr.json();
 }catch(err){
  if(btn)btn.disabled=false;
  if(st){st.className='sendnote bad';st.textContent='Could not reach us just now. Please call (332) 277-0990.'}
  return}
 if(btn)btn.disabled=false;
 if(!rr.ok){if(st){st.className='sendnote bad';st.textContent=(j&&j.error)||'Please call us at (332) 277-0990.'}return}
 /* THE MESSAGE MUST APPEAR. The old version left the panel open and empty with a
    "Thank you" under it, so the customer's own words vanished off the screen the
    moment they pressed send. The server returns the whole thread; render it. */
 if(j&&Array.isArray(j.thread))rec.thread=j.thread;
 else if(j&&j.message)rec.thread=[...A(rec.thread),j.message];
 const wrap=document.getElementById('thread-wrap');
 if(wrap)wrap.innerHTML=threadInner(rec);
 const card=document.getElementById('thread-card');
 if(box)box.value='';
 if(st){
  /* Saved and notified are different facts. A message that was written down but
     never delivered must not read as success. */
  if(j&&j.notified===false){st.className='sendnote bad';st.textContent=(j.error||'Saved — but our notification did not go out. Please call (332) 277-0990.')}
  else{st.className='sendnote';st.textContent='Sent. We usually reply the same day — your reply will appear right here.'}
 }
 if(a==='accept'){setTimeout(()=>location.reload(),900);return}
 if(card&&card.scrollIntoView)card.scrollIntoView({behavior:'smooth',block:'end'});
};
if(!ref){app.textContent='Estimate link is incomplete.';return}fetch('/.netlify/functions/get-estimate?ref='+encodeURIComponent(ref),{cache:'no-store'}).then(r=>r.json()).then(j=>render(j.record||j.estimateRecord||j.data||j)).catch(e=>app.textContent='Could not load estimate: '+e.message)
})();
</script>
