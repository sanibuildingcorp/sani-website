<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Your Estimate | Sani Building Corp</title>
<style>
:root{--n:#10273f;--g:#c9a53a;--p:#f7f4ee;--l:#e5ded1;--gr:#1f8a5b;--r:#b84747;--muted:#6f7987}*{box-sizing:border-box}body{margin:0;background:var(--p);color:#152235;font-family:Arial,sans-serif;line-height:1.5}.top{background:#253442;color:#fff;padding:22px}.brand,.wrap{max-width:820px;margin:auto}.brand{font-weight:900;letter-spacing:4px}.brand span{color:#e0bd51}.wrap{padding:20px 14px 80px}.hero,.head{background:var(--n);color:#fff}.hero{padding:24px;border-radius:16px}.hero h1{margin:6px 0;font-size:27px}.ey{font-size:10px;letter-spacing:2px;color:#e0bd51;font-weight:bold;text-transform:uppercase}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.meta div{border-top:1px solid #ffffff33;padding-top:8px;font-size:12px}.meta small{display:block;color:#aebdca;text-transform:uppercase}.card,.svc{background:#fff;border:1px solid var(--l);border-radius:14px;margin-top:14px}.card{padding:16px}.prices{overflow:hidden}.pr{display:flex;justify-content:space-between;padding:11px 15px;border-top:1px solid #eee}.pr.total{background:var(--n);color:#fff;font-size:21px;font-weight:bold}.head{padding:14px 16px;display:flex;justify-content:space-between;gap:15px}.head h2{margin:2px 0 0;font-size:18px}.head b{white-space:nowrap}.body{padding:15px}.label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:bold;margin:12px 0 6px}.in{color:var(--gr)}.sup{color:#9a7620}.out{color:var(--r)}ul{list-style:none;padding:0;margin:0}li{padding:5px 0 5px 21px;border-bottom:1px dashed #eee;font-size:13px;position:relative}li:before{position:absolute;left:0}.inlist li:before{content:'✓';color:var(--gr)}.suplist li:before{content:'◆';color:var(--g)}.outlist li:before{content:'—';color:var(--r)}details{margin-top:12px;border-top:1px solid #eee;padding-top:10px}summary{font-size:12px;font-weight:bold;cursor:pointer}.lines{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}.lines td{padding:6px;border-bottom:1px solid #eee}.lines td:last-child{text-align:right}.opts{background:#fbf7ea;border:1px solid #ead9a4;border-radius:10px;padding:10px;margin-top:12px}.opt{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #eadfbd}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button{padding:14px;border:0;border-radius:10px;font-weight:bold}.approve{background:var(--g)}.ask{background:#fff;border:1px solid #ccc}.panel{display:none}.panel.open{display:block}.panel input,.panel textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.status{margin-top:10px}.footer{text-align:center;font-size:11px;color:#777;padding:25px}.muted{color:var(--muted);font-size:12px}@media(max-width:600px){.meta{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}}</style>
</head>
<body>
<header class="top"><div class="brand"><span>SANI</span> BUILDING CORP</div></header>
<main class="wrap" id="app">Loading estimate…</main>
<footer class="footer">Fully Insured · (332) 277-0990 · contact@sanibuildingcorp.com</footer>
<script>
(()=>{
const q=new URLSearchParams(location.search),ref=q.get('ref'),app=document.getElementById('app');let rec;
const A=v=>Array.isArray(v)?v:[],E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),M=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),N=s=>String(s??'').toLowerCase(),C=s=>String(s??'').trim(),LT=l=>(+l.qty||0)*(+l.rate||0),U=a=>{const z=[],seen=new Set();A(a).forEach(x=>{x=C(x);let k=N(x).replace(/[^a-z0-9]+/g,' ');if(x&&!seen.has(k)){seen.add(k);z.push(x)}});return z};
function sec(l){if(l&&C(l.section)&&N(l.section)!=='general')return C(l.section);let x=N(l&&l.item);return /window/.test(x)?'Windows':/paint|prime|patch|ceiling|trim/.test(x)?'Painting':/floor|hardwood|subfloor|underlayment|baseboard/.test(x)?'Flooring':/bath|shower|tile|vanity|toilet|plumb|glass|waterproof|grout|mirror|faucet/.test(x)?'Bathroom':'General'}
function same(a,b){a=N(a);b=N(b);return a===b||a.includes(b)||b.includes(a)||(a.includes('bath')&&b.includes('bath'))||(a.includes('paint')&&b.includes('paint'))||(a.includes('floor')&&b.includes('floor'))||(a.includes('window')&&b.includes('window'))}
function infer(text,known){let n=N(text);if(/window/.test(n))return known.find(k=>/window/i.test(k))||'Windows';if(/paint|prime|wall|ceiling|trim/.test(n))return known.find(k=>/paint/i.test(k))||'Painting';if(/floor|hardwood|subfloor|underlayment|baseboard/.test(n))return known.find(k=>/floor/i.test(k))||'Flooring';if(/bath|shower|tile|vanity|toilet|plumb|waterproof|glass|mirror|faucet/.test(n))return known.find(k=>/bath/i.test(k))||'Bathroom';return'General'}
function calc(e){let l=A(e.labor).reduce((s,x)=>s+LT(x),0),m=A(e.materials).reduce((s,x)=>s+LT(x),0),k=1+(+e.markupPct||0)/100;return{total:rec&&rec.customerFinalTotal!=null?+rec.customerFinalTotal:(l+m)*k,k}}
function friendly(item){let t=C(item).replace(/^labor\s*[-:]\s*/i,'').replace(/\s*@\s*\$?[\d,.]+.*$/,'');if(!t)return'';if(/project management|supervision|coordination/i.test(t))return'Project coordination, scheduling, and quality control';if(/cleanup|final clean/i.test(t))return'Final cleanup and removal of construction debris';return t.charAt(0).toUpperCase()+t.slice(1)}
function services(e){
  const map=new Map(),order=[];const get=n=>{n=C(n)||'General';if(!map.has(n)){map.set(n,{title:n,included:[],customerSupplies:[],notIncluded:[],subtotal:0,options:[]});order.push(n)}return map.get(n)};
  // Start with saved structured breakdown, but NEVER trust empty scope arrays as complete.
  A(e.serviceBreakdown).forEach(s=>{let o=get(s.title||s.service);o.included.push(...A(s.included));o.customerSupplies.push(...A(s.customerSupplies||s.customerSupplied));o.notIncluded.push(...A(s.notIncluded||s.exclusions));o.subtotal=+s.subtotal||0;o.options.push(...A(s.options))});
  // Always merge scopeSections so old/sparse records still show scope.
  A(e.scopeSections).forEach(s=>get(s.title).included.push(...A(s.items).map(friendly)));
  // Always merge labor lines as customer-friendly included scope fallback.
  A(e.labor).forEach(l=>{let s=sec(l),o=get(s);o.included.push(friendly(l.item));if(!o.subtotal)o.subtotal+=LT(l)*calc(e).k});
  // Materials that define the work system also enrich included scope.
  A(e.materials).forEach(l=>{let s=sec(l),o=get(s);if(!o.subtotal)o.subtotal+=LT(l)*calc(e).k;if(/waterproof|membrane|backer|thinset|grout|primer|sealant|insulation|flashing|level|protection/i.test(l.item||''))o.included.push('Provide and use '+C(l.item).replace(/[.;,:]+$/,''))});
  let known=order.filter(x=>N(x)!=='general');
  A(e.customerSupplied).forEach(x=>{let item=typeof x==='string'?x:x.item, s=(typeof x==='object'&&x.section)?x.section:infer(item,known);get(s).customerSupplies.push(item)});
  A(e.exclusions).forEach(x=>get(infer(x,known)).notIncluded.push(x));
  A(e.options).forEach(x=>get(x.section||infer((x.label||'')+' '+(x.description||''),known)).options.push(x));
  // If service subtotals were not supplied, calculate them correctly from all lines.
  const totals={};[...A(e.labor),...A(e.materials)].forEach(l=>{let s=sec(l);totals[s]=(totals[s]||0)+LT(l)*calc(e).k});order.forEach(k=>{if(!map.get(k).subtotal)map.get(k).subtotal=totals[k]||0});
  // Hide "General" as a fake fifth service. Allocate its price proportionally and share project-wide scope.
  const general=map.get('General');let result=order.filter(k=>k!=='General').map(k=>map.get(k));
  if(general&&result.length){let base=result.reduce((s,x)=>s+(+x.subtotal||0),0),g=+general.subtotal||0;result.forEach(x=>{x.subtotal+=(g>0?(base>0?g*((+x.subtotal||0)/base):g/result.length):0);x.included.push(...A(general.included));});}
  if(!result.length&&general)result=[general];
  result.forEach(s=>{s.included=U(s.included).filter(x=>!/^general$/i.test(x));s.customerSupplies=U(s.customerSupplies);s.notIncluded=U(s.notIncluded);s.options=A(s.options)});
  return result.filter(s=>s.included.length||s.customerSupplies.length||s.notIncluded.length||s.subtotal>0||s.options.length);
}
function list(label,cl,a,fallback){a=U(a);if(!a.length&&fallback)a=[fallback];if(!a.length)return'';return`<div class="label ${cl}">${label}</div><ul class="${cl}list">${a.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`}
function lines(e,s){let z=[];if(e.showLaborLines===true)z.push(...A(e.labor).filter(x=>same(sec(x),s.title)).map(x=>({...x,t:'Labor'})));if(e.showMaterialLines===true)z.push(...A(e.materials).filter(x=>same(sec(x),s.title)).map(x=>({...x,t:'Material'})));return z.length?`<details><summary>View detailed labor & materials (${z.length})</summary><table class="lines">${z.map(x=>`<tr><td>${x.t}</td><td>${E(x.item)}</td><td>${M(LT(x)*calc(e).k)}</td></tr>`).join('')}</table></details>`:''}
function render(r){rec=r;let e=r.estimate||{},c=r.customer||{},rq=r.request||{},sv=services(e),ct=calc(e),rows=sv.filter(x=>x.subtotal>0).map(x=>`<div class="pr"><b>${E(x.title)}</b><b>${M(x.subtotal)}</b></div>`).join('');app.innerHTML=`<section class="hero"><div class="ey">Estimate ${E(ref)}</div><h1>${E(e.projectTitle||rq.service||'Renovation Estimate')}</h1><p>${E(c.address||'NYC Metro')}</p><div class="meta"><div><small>Prepared for</small>${E(c.name)}</div><div><small>Status</small>${E(e.estimateStatus||'Ready')}</div><div><small>Timeline</small>${E(e.timelineText||'TBD')}</div><div><small>Total</small>${M(ct.total)}</div></div></section><section class="card"><div class="ey">Project summary</div><p>${E(e.summary||'Estimate based on the project information provided.')}</p></section><section class="card prices"><div class="ey" style="padding:0 0 8px">Price by service</div>${e.showSectionSubtotals!==false?rows:''}<div class="pr total"><span>Your estimate</span><span>${M(ct.total)}</span></div></section>${sv.map((s,i)=>`<section class="svc"><div class="head"><div><div class="ey">Service ${i+1}</div><h2>${E(s.title)}</h2></div><b>${M(s.subtotal)}</b></div><div class="body">${list('Included in this service','in',s.included,'All work specifically described in this service scope, including normal installation and finish work.')}${list('Customer supplies','sup',s.customerSupplies)}${list('Not included','out',s.notIncluded,'Work not specifically listed in the included scope, concealed-condition repairs, and scope changes are not included unless added in writing.')}${A(s.options).length?`<div class="opts"><div class="label">Alternate options</div>${A(s.options).map(o=>`<div class="opt"><span>${E(o.label)}${o.description?`<div class="muted">${E(o.description)}</div>`:''}</span><b>${M(o.price)}</b></div>`).join('')}</div>`:''}${lines(e,s)}</div></section>`).join('')}<section class="actions"><button class="approve" onclick="P('a')">Approve estimate</button><button class="ask" onclick="P('q')">Request changes / ask a question</button></section><section class="card panel" id="a"><input id="sig" value="${E(c.name||'')}"><button class="approve" onclick="S('accept')">Confirm approval</button></section><section class="card panel" id="q"><textarea id="msg" placeholder="Tell us what you would like changed or clarified"></textarea><button class="approve" onclick="S('question')">Send message</button></section><div id="st" class="status"></div>`;new Image().src='/.netlify/functions/track-quote-open?ref='+encodeURIComponent(ref)+'&_='+Date.now()}
window.P=id=>{document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));document.getElementById(id).classList.add('open')};window.S=async a=>{let p={ref,action:a,finalTotal:calc(rec.estimate||{}).total};if(a==='accept')p.signature=document.getElementById('sig').value;if(a==='question')p.questionText=document.getElementById('msg').value;let r=await fetch('/.netlify/functions/quote-response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),j=await r.json();document.getElementById('st').textContent=r.ok?'Thank you. We received your response.':(j.error||'Please call us at (332) 277-0990.')};
if(!ref){app.textContent='Estimate link is incomplete.';return}fetch('/.netlify/functions/get-estimate?ref='+encodeURIComponent(ref),{cache:'no-store'}).then(r=>r.json()).then(j=>render(j.record||j.estimateRecord||j.data||j)).catch(e=>app.textContent='Could not load estimate: '+e.message)
})();
</script>
</body>
