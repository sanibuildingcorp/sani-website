  main.notIncluded=U([...A(main.notIncluded),...A(ps.excluded||ps.notIncluded)]);
 });
 return active}
function list(label,cl,a){a=U(a);if(!a.length)return'';return`<div class="label ${cl}">${label}</div><ul class="${cl}list">${a.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`}
function inSvc(x,s){const sec=C(x.section);return (sec&&sec===s.title)||trade(x.item,x.section)===s.title}
function details(e,s){
 /* A breakdown is a LIST of what the customer is getting. Whether it carries prices
    is a separate decision (showLaborLinePrices / showMaterialLinePrices, default OFF)
    so the contractor can show WHICH materials he will use without publishing what he
    pays for each one. A price is printed only when that flag is on AND the matching
    cost toggle is on - otherwise the table would print the very costs the contractor
    chose to hide, which is what it used to do. */
 const ct=calc(e);
 let z=[];
 if(e.showLaborLines===true)A(e.labor).filter(x=>inSvc(x,s)&&!isOption(x.item)).forEach(x=>z.push({...x,t:'Labor',price:(e.showLaborLinePrices===true&&ct.showLabor)}));
 if(e.showMaterialLines===true)A(e.materials).filter(x=>inSvc(x,s)&&!isOption(x.item)).forEach(x=>z.push({...x,t:'Material',price:(e.showMaterialLinePrices===true&&ct.showMat)}));
 if(!z.length)return'';
 const anyPrice=z.some(x=>x.price);
 const label=anyPrice?'View detailed labor & materials':'View what is included in detail';
 return `<details><summary>${label} (${z.length})</summary><table class="lines">${z.map(x=>`<tr><td>${x.t}</td><td${x.price?'':' colspan="2"'}>${E(itemText(x.item))}</td>${x.price?`<td>${M(LT(x)*ct.k)}</td>`:''}</tr>`).join('')}</table></details>`}
function isV7(e){
 /* Which LAYOUT to render, not which WORDING to use.
    This used to require customerScopePublished===true, which meant a perfectly good
    v7 estimate rendered as the plain legacy scope dump until the contractor happened
    to press Publish. Publishing controls the wording of the service cards; it must
    never decide whether the service layout exists at all.
    Also falls back to "does this estimate actually carry service data", so a future
    rename of customerPresentationVersion cannot silently drop the layout again. */
 const v=C(e.customerPresentationVersion);
 if(/^v8\.\d+-deterministic-four-service/.test(v))return true;
 if(v==='v7-service-proposal')return true;
 if(C(e.customerViewPublishedVersion)==='v7')return true;
 if(e.customerScopePublished===true&&e.publishedCustomerScope&&A(e.publishedCustomerScope.services).length)return true;
 return A(e.serviceBreakdown).length>0}
function isApproved(r){return /accept|approv|invoic|complete/i.test(C(r.status))||!!r.acceptedAt||!!r.approvedAt||N(r.customerResponse&&r.customerResponse.action)==='accept'}
function legacyScope(e){if(C(e.scopeOfWork))return C(e.scopeOfWork);let s=A(e.scopeSections).map(x=>`${C(x.title)}\n${A(x.items).map(i=>'• '+C(i)).join('\n')}`).join('\n\n');if(s)return s;return C(e.summary)}
function actionHtml(c,approved){if(approved)return`<div class="approved">✓ This estimate has already been approved. The approved scope and price remain on record.</div>`;const amt=rec?M(calc(rec.estimate||{}).total):'';
 return`<section class="actions"><button class="approve" onclick="P('a')">&#10003; Approve this estimate${amt?` &mdash; ${amt}`:''}</button><button class="ask" onclick="P('q')">Request changes or ask a question</button></section>
<div class="trust">Approving does not charge you &mdash; we will contact you to schedule.<br>Questions? Call or text <a href="tel:+13322770990" style="color:#9a7620;font-weight:bold">(332) 277-0990</a></div>
<section class="card panel" id="a"><div class="label in">Approve estimate</div><p class="muted" style="margin:0 0 6px">Type your full name to approve${amt?` ${amt}`:''}.</p><input id="sig" value="${E(c.name||'')}" placeholder="Your full name"><button class="approve" onclick="S('accept')">&#10003; Confirm approval</button></section>
<section class="card panel" id="q"><div class="label">Request changes</div><textarea id="msg" rows="4" placeholder="Tell us what you would like changed or clarified"></textarea><button class="ask" onclick="S('question')">Send message</button></section><div id="st" class="status"></div>`}
function renderLegacy(r){rec=r;let e=r.estimate||{},c=r.customer||{},rq=r.request||{},ct=calc(e),approved=isApproved(r);app.innerHTML=`<section class="hero"><div class="ey">Estimate ${E(ref)}</div><h1>${E(e.projectTitle||rq.service||'Renovation Estimate')}</h1><p>${E(c.address||'NYC Metro')}</p><div class="meta"><div><small>Prepared for</small>${E(c.name)}</div><div><small>Status</small>${E(approved?'Approved':(e.estimateStatus||r.status||'Sent'))}</div><div><small>Timeline</small>${E(e.timelineText||'TBD')}</div><div><small>Total</small>${M(ct.total)}</div></div></section><section class="card"><div class="ey">Project summary</div><p>${E(e.summary||'Estimate based on the project information provided.')}</p></section><section class="card"><div class="ey">Scope of work</div><div class="scope-text">${E(legacyScope(e)||'Please refer to the estimate details provided by Sani Building Corp.')}</div></section><section class="card prices">${costRows(e,ct)}<div class="pr total"><span>Your estimate</span><span>${M(ct.total)}</span></div>${costNote(e,ct)}</section>${photos(r)}${actionHtml(c,approved)}`;track()}
function renderV7(r){rec=r;let e=r.estimate||{},c=r.customer||{},rq=r.request||{},sv=build(e),ct=calc(e),approved=isApproved(r),rows=sv.map(x=>`<div class="pr"><b>${E(x.title)}</b><b>${M(x.subtotal)}</b></div>`).join('');app.innerHTML=`<section class="hero"><div class="ey">Estimate ${E(ref)}</div><h1>${E(e.projectTitle||rq.service||'Renovation Estimate')}</h1><p>${E(c.address||'NYC Metro')}</p><div class="meta"><div><small>Prepared for</small>${E(c.name)}</div><div><small>Status</small>${E(approved?'Approved':(e.estimateStatus||'Ready'))}</div><div><small>Timeline</small>${E(e.timelineText||'TBD')}</div><div><small>Total</small>${M(ct.total)}</div></div></section><section class="card"><div class="ey">Project summary</div><p>${E(e.summary||'Estimate based on the project information provided.')}</p></section><section class="card prices"><div class="ey" style="padding:0 0 8px">Price by service</div>${e.showSectionSubtotals!==false?rows:''}${costRows(e,ct)}<div class="pr total"><span>Your estimate</span><span>${M(ct.total)}</span></div>${costNote(e,ct)}</section>${sv.map((s,i)=>`<section class="svc"><div class="head"><div><div class="ey">Service ${i+1}</div><h2>${E(s.title)}</h2></div><b>${M(s.subtotal)}</b></div><div class="body">${list('Included in this service','in',s.included)}${list('Customer supplies','sup',s.customerSupplies)}${list('Not included','out',s.notIncluded)}${A(s.options).length?`<div class="opts"><div class="label">Alternatives</div>${A(s.options).map(o=>`<div class="opt"><span><b>${E(o.label)}</b>${o.description?`<div class="muted">${E(o.description)}</div>`:''}</span><b>${M(o.price)}</b></div>`).join('')}</div>`:''}${details(e,s)}</div></section>`).join('')}${photos(r)}${actionHtml(c,approved)}`;track()}
/* PROJECT PHOTOS.
   Two sources: the customer's own uploads (record.request.photos) and anything the
   contractor added in the dashboard's Quote Photos box (estimate.quotePhotos),
   which is also where an AI render lands. Both are {name, data} with data either a
   full data: URL or bare base64, so both shapes are handled.
   These were rendering on the old quote page and were lost in a rebuild - the
   committed file has no photo code at all. A customer looking at a $51,248.75
   staircase quote should see the staircase. */
function photoSrc(p){
 const d=String((p&&(p.data||p.url||p.src))||'').trim();
 if(!d)return'';
 if(/^(data:|https?:)/i.test(d))return d;
 /* A bare JPEG in base64 begins "/9j/" - a leading slash does NOT mean it is a
    site path, and testing for one silently turned every customer photo into a
    broken <img src="/9j/...">. Only a real-looking image path is treated as a URL. */
 if(/^\/[\w\-./]*\.(jpe?g|png|webp|gif|avif)$/i.test(d))return d;
 return 'data:image/jpeg;base64,'+d}
function photos(r){
 const e=r.estimate||{},rq=r.request||{};
 const all=[...A(rq.photos),...A(e.quotePhotos)].map(photoSrc).filter(Boolean);
 if(!all.length)return'';
 return `<section class="card"><div class="ey">Project photos</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px">
 ${all.map((src,i)=>`<a href="${E(src)}" target="_blank" rel="noopener" style="display:block"><img src="${E(src)}" alt="Project photo ${i+1}" loading="lazy" style="width:100%;height:130px;object-fit:cover;border-radius:10px;border:1px solid var(--l);display:block"></a>`).join('')}
 </div></section>`}
function render(r){let e=(r&&r.estimate)||{};if(isV7(e))renderV7(r);else renderLegacy(r)}
function track(){new Image().src='/.netlify/functions/track-quote-open?ref='+encodeURIComponent(ref)+'&_='+Date.now()}
window.P=id=>{document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));let el=document.getElementById(id);if(el)el.classList.add('open')};
window.S=async a=>{let p={ref,action:a,finalTotal:calc(rec.estimate||{}).total};if(a==='accept')p.signature=document.getElementById('sig').value;if(a==='question')p.questionText=document.getElementById('msg').value;let rr=await fetch('/.netlify/functions/quote-response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),j=await rr.json();let st=document.getElementById('st');
 if(st){
  if(!rr.ok){st.textContent=(j&&j.error)||'Please call us at (332) 277-0990.';return}
  /* The response is saved either way, but if the contractor's notification did not
     go out, saying only "Thank you" leaves the customer waiting on a reply nobody
     knows to send. */
  st.innerHTML=(j&&j.notified===false)
   ? 'Thank you \u2014 your response was saved. To make sure we see it right away, please also call or text <a href="tel:+13322770990"><b>(332) 277-0990</b></a>.'
   : 'Thank you. We received your response.';
 }
 if(a==='question'){const m=document.getElementById('msg');if(m)m.value=''}};
if(!ref){app.textContent='Estimate link is incomplete.';return}fetch('/.netlify/functions/get-estimate?ref='+encodeURIComponent(ref),{cache:'no-store'}).then(r=>r.json()).then(j=>render(j.record||j.estimateRecord||j.data||j)).catch(e=>app.textContent='Could not load estimate: '+e.message)
})();
