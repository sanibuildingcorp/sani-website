<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Your Estimate | Sani Building Corp</title>
<style>
:root{--n:#10273f;--g:#c9a53a;--p:#f7f4ee;--l:#e5ded1;--gr:#1f8a5b;--r:#b84747;--muted:#6f7987}
*{box-sizing:border-box}body{margin:0;background:var(--p);color:#152235;font-family:Arial,sans-serif;line-height:1.5}.top{background:#253442;color:#fff;padding:22px}.brand,.wrap{max-width:820px;margin:auto}.brand{font-weight:900;letter-spacing:4px}.brand span{color:#e0bd51}.wrap{padding:20px 14px 80px}.hero,.head{background:var(--n);color:#fff}.hero{padding:24px;border-radius:16px}.hero h1{margin:6px 0;font-size:27px}.ey{font-size:10px;letter-spacing:2px;color:#e0bd51;font-weight:bold;text-transform:uppercase}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.meta div{border-top:1px solid #ffffff33;padding-top:8px;font-size:12px}.meta small{display:block;color:#aebdca;text-transform:uppercase}.card,.svc{background:#fff;border:1px solid var(--l);border-radius:14px;margin-top:14px}.card{padding:16px}.prices{overflow:hidden}.pr{display:flex;justify-content:space-between;padding:11px 15px;border-top:1px solid #eee}.pr.total{background:var(--n);color:#fff;font-size:21px;font-weight:bold}.head{padding:14px 16px;display:flex;justify-content:space-between;gap:15px}.head h2{margin:2px 0 0;font-size:18px}.head b{white-space:nowrap}.body{padding:15px}.label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:bold;margin:12px 0 6px}.in{color:var(--gr)}.sup{color:#9a7620}.out{color:var(--r)}ul{list-style:none;padding:0;margin:0}li{padding:5px 0 5px 21px;border-bottom:1px dashed #eee;font-size:13px;position:relative}li:before{position:absolute;left:0}.inlist li:before{content:'✓';color:var(--gr)}.suplist li:before{content:'◆';color:var(--g)}.outlist li:before{content:'—';color:var(--r)}details{margin-top:12px;border-top:1px solid #eee;padding-top:10px}summary{font-size:12px;font-weight:bold;cursor:pointer}.lines{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}.lines td{padding:6px;border-bottom:1px solid #eee}.lines td:last-child{text-align:right}.opts{background:#fbf7ea;border:1px solid #ead9a4;border-radius:10px;padding:10px;margin-top:12px}.opt{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #eadfbd}.opt:first-of-type{border-top:0}.muted{font-size:11px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button{padding:14px;border:0;border-radius:10px;font-weight:bold}.approve{background:var(--g)}.ask{background:#fff;border:1px solid #ccc}.panel{display:none}.panel.open{display:block}.panel input,.panel textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.status{margin-top:10px}.approved{background:#eaf6ef;border:1px solid #b8dec9;color:#17633f;padding:13px;border-radius:10px;margin-top:15px;font-size:13px}.scope-text{white-space:pre-wrap;font-size:13px;color:#303b49}.footer{text-align:center;font-size:11px;color:#777;padding:25px}@media(max-width:600px){.meta{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span>SANI</span> BUILDING CORP</div></header>
<main class="wrap" id="app">Loading estimate…</main>
<footer class="footer">Fully Insured · (332) 277-0990 · contact@sanibuildingcorp.com</footer>
<script>
(()=>{
const q=new URLSearchParams(location.search),ref=q.get('ref'),app=document.getElementById('app');let rec;
const A=v=>Array.isArray(v)?v:[],E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),M=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),C=s=>String(s??'').trim(),N=s=>C(s).toLowerCase(),LT=l=>(+l.qty||0)*(+l.rate||0),U=a=>{let r=[],z=new Set;A(a).forEach(x=>{x=C(x);let k=N(x).replace(/[^a-z0-9]+/g,' ');if(x&&!z.has(k)){z.add(k);r.push(x)}});return r};
function trade(item,declared){const x=N(item),d=N(declared);if(/window|sash|balance|spring/.test(x))return'Windows';if(/bathroom painting|bath paint/.test(x))return'Bathroom';if(/shower|vanity|toilet|faucet|plumb|waterproof|membrane|grout|thinset|tile|glass enclosure|shower glass|bathroom|tub|drain|backer board/.test(x))return'Bathroom';if(/engineered hardwood|hardwood|subfloor|flooring|underlayment|transition|floor prep|floor removal/.test(x))return'Flooring';if(/interior paint|painting|painter|primer|spackle|patch|walls|ceilings|doors|trim/.test(x))return'Painting';if(d&&d!=='general')return C(declared);return'General'}
function isOption(item){return /\boption\s*[ab12]\b|alternate/i.test(N(item))}function optionKey(item){let x=N(item);if(/option\s*a|option\s*1/.test(x))return'A';if(/option\s*b|option\s*2/.test(x))return'B';return''}
function calc(e){let l=A(e.labor).reduce((s,x)=>s+LT(x),0),m=A(e.materials).reduce((s,x)=>s+LT(x),0),k=1+(+e.markupPct||0)/100,total=rec&&rec.customerFinalTotal!=null?+rec.customerFinalTotal:(l+m)*k;return{l,m,k,total}}
function friendly(item){let t=C(item).replace(/^labor\s*[-:]\s*/i,'').replace(/\s*@\s*\$?[\d,.]+.*$/,'').replace(/\s{2,}/g,' ');if(!t)return'';if(/bathroom demolition/i.test(t))return'Protect the work area; remove existing bathroom finishes and fixtures as specified; load and dispose of debris';if(/tile install/i.test(t))return'Prepare substrates and install bathroom wall and floor tile; complete grout, sealant, and finish work';if(/plumb.*shower|shower.*plumb|vanity.*toilet|toilet.*vanity/i.test(t))return'Install and connect shower valve/trim, vanity/sink/faucet, and toilet in their existing plumbing locations';if(/glass enclosure|shower glass/i.test(t))return'Fabricate and install the frameless shower glass enclosure as specified';if(/engineered hardwood/i.test(t))return'Prepare the installation area and install engineered hardwood flooring, including cuts, fitting, transitions, and finish details';if(/interior paint|painter/i.test(t))return'Prepare and paint included interior walls, ceilings, doors, and trim, including minor patching, sanding, spot priming, touch-ups, and cleanup';if(/project management|supervision|coordination/i.test(t))return'Project coordination, scheduling, deliveries, and quality control';if(/cleanup|final clean/i.test(t))return'Final cleanup and removal of construction debris';return t.charAt(0).toUpperCase()+t.slice(1)}
function laborLike(l){return !/allowance|material|membrane|thinset|grout|paint supplies|sealant|insulation|flashing/i.test(N(l.item))}
function build(e){const names=['Bathroom','Flooring','Painting','Windows'],map=new Map(names.map(n=>[n,{title:n,included:[],customerSupplies:[],notIncluded:[],subtotal:0,options:[]}])) ;const get=n=>map.get(n)||map.get('Bathroom');const c=calc(e);let general=0,optionTotals={A:0,B:0};
A(e.serviceBreakdown).forEach(s=>{let nm=s.title||s.service||s.section||s.name;let t=trade(nm,nm);if(!map.has(t))return;let o=get(t);o.included.push(...A(s.included||s.items||s.scope));o.customerSupplies.push(...A(s.customerSupplies||s.customerSupplied||s.supplied));o.notIncluded.push(...A(s.notIncluded||s.exclusions||s.excluded));o.options.push(...A(s.options))});
A(e.scopeSections).forEach(s=>A(s.items).forEach(i=>{let t=trade(i,s.title);if(map.has(t))get(t).included.push(friendly(i))}));
[...A(e.labor),...A(e.materials)].forEach(l=>{let t=trade(l.item,l.section),val=LT(l)*c.k;if(isOption(l.item)&&t==='Windows'){let k=optionKey(l.item);if(k)optionTotals[k]=(optionTotals[k]||0)+val;return}if(t==='General'){general+=val;return}get(t).subtotal+=val;let x=N(l.item);if(laborLike(l)||/waterproof|membrane|backer|thinset|grout|sealant|insulation|flashing|primer|protection/.test(x))get(t).included.push(friendly(l.item))});
A(e.customerSupplied).forEach(x=>{let item=typeof x==='string'?x:x.item,t=trade(item,typeof x==='object'?x.section:'');if(map.has(t))get(t).customerSupplies.push(item)});
A(e.exclusions).forEach(x=>{let t=trade(x,'');if(map.has(t))get(t).notIncluded.push(x)});
A(e.options).forEach(o=>{let t=trade((o.label||'')+' '+(o.description||''),o.section);if(t==='Windows')get('Windows').options.push({label:o.label,description:o.description,price:+o.price||0})});
if(optionTotals.A&&!get('Windows').options.some(o=>/option\s*a|option\s*1/i.test(o.label)))get('Windows').options.push({label:'Option A — Replace all specified windows',description:'Complete replacement option based on the estimate line items.',price:optionTotals.A});if(optionTotals.B&&!get('Windows').options.some(o=>/option\s*b|option\s*2/i.test(o.label)))get('Windows').options.push({label:'Option B — Partial replacement / repair option',description:'Alternate window option based on the estimate line items.',price:optionTotals.B});
let active=names.map(n=>get(n)).filter(s=>s.included.length||s.customerSupplies.length||s.subtotal>0||s.options.length);let base=active.reduce((s,x)=>s+x.subtotal,0);if(general&&active.length)active.forEach(x=>x.subtotal+=base>0?general*(x.subtotal/base):general/active.length);let sum=active.reduce((s,x)=>s+x.subtotal,0);if(sum>0&&c.total>0){let scale=c.total/sum;active.forEach(x=>x.subtotal*=scale)}active.forEach(s=>{s.included=U(s.included).filter(x=>!isOption(x));s.customerSupplies=U(s.customerSupplies);s.notIncluded=U(s.notIncluded)});return pubScope(e,active)}
/* Published Customer Scope (set in the dashboard's Customer Scope Control).
   When the contractor has explicitly published a scope, its wording replaces the
   auto-derived Included / Customer Supplies / Not Included lists. Subtotals are
   deliberately NOT touched: prices always come from the labor and materials lines
   above. If nothing is published, every existing estimate renders exactly as before. */
function pubScope(e,active){
 if(e.customerScopePublished!==true)return active;
 const p=e.publishedCustomerScope;
 if(!p||!Array.isArray(p.services)||!p.services.length)return active;
 const idx=new Map();p.services.forEach(s=>{const k=N(s.name||s.title);if(k)idx.set(k,s)});
 active.forEach(s=>{
  const ps=idx.get(N(s.title));if(!ps)return;
  s.included=U(A(ps.included));
  s.customerSupplies=U(A(ps.supplied||ps.customerSupplies));
  s.notIncluded=U(A(ps.excluded||ps.notIncluded));
  idx.delete(N(s.title));
 });
 // Anything the contractor published that has no matching priced service still gets
 // shown, so published wording is never silently dropped. Subtotal stays 0 so the
 // customer-facing total is unchanged.
 idx.forEach(ps=>{
  const inc=U(A(ps.included)),sup=U(A(ps.supplied||ps.customerSupplies)),ni=U(A(ps.excluded||ps.notIncluded));
  if(!inc.length&&!sup.length&&!ni.length)return;
  active.push({title:C(ps.name||ps.title)||'Additional Work',included:inc,customerSupplies:sup,notIncluded:ni,subtotal:0,options:[]});
 });
 return active}
function list(label,cl,a){a=U(a);if(!a.length)return'';return`<div class="label ${cl}">${label}</div><ul class="${cl}list">${a.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`}
function details(e,s){let z=[];if(e.showLaborLines===true)A(e.labor).filter(x=>trade(x.item,x.section)===s.title&&!isOption(x.item)).forEach(x=>z.push({...x,t:'Labor'}));if(e.showMaterialLines===true)A(e.materials).filter(x=>trade(x.item,x.section)===s.title&&!isOption(x.item)).forEach(x=>z.push({...x,t:'Material'}));return z.length?`<details><summary>View detailed labor & materials (${z.length})</summary><table class="lines">${z.map(x=>`<tr><td>${x.t}</td><td>${E(x.item)}</td><td>${M(LT(x)*calc(e).k)}</td></tr>`).join('')}</table></details>`:''}
function isV7(e){return C(e.customerPresentationVersion)==='v7-service-proposal'&&(e.customerScopePublished===true||C(e.customerViewPublishedVersion)==='v7')}
function isApproved(r){return /accept|approv|invoic|complete/i.test(C(r.status))||!!r.acceptedAt||!!r.approvedAt||N(r.customerResponse&&r.customerResponse.action)==='accept'}
function legacyScope(e){if(C(e.scopeOfWork))return C(e.scopeOfWork);let s=A(e.scopeSections).map(x=>`${C(x.title)}\n${A(x.items).map(i=>'• '+C(i)).join('\n')}`).join('\n\n');if(s)return s;return C(e.summary)}
function actionHtml(c,approved){if(approved)return`<div class="approved">✓ This estimate has already been approved. The approved scope and price remain on record.</div>`;return`<section class="actions"><button class="approve" onclick="P('a')">Approve estimate</button><button class="ask" onclick="P('q')">Request changes / ask a question</button></section><section class="card panel" id="a"><input id="sig" value="${E(c.name||'')}"><button class="approve" onclick="S('accept')">Confirm approval</button></section><section class="card panel" id="q"><textarea id="msg" placeholder="Tell us what you would like changed or clarified"></textarea><button class="approve" onclick="S('question')">Send message</button></section><div id="st" class="status"></div>`}
function renderLegacy(r){rec=r;let e=r.estimate||{},c=r.customer||{},rq=r.request||{},ct=calc(e),approved=isApproved(r);app.innerHTML=`<section class="hero"><div class="ey">Estimate ${E(ref)}</div><h1>${E(e.projectTitle||rq.service||'Renovation Estimate')}</h1><p>${E(c.address||'NYC Metro')}</p><div class="meta"><div><small>Prepared for</small>${E(c.name)}</div><div><small>Status</small>${E(approved?'Approved':(e.estimateStatus||r.status||'Sent'))}</div><div><small>Timeline</small>${E(e.timelineText||'TBD')}</div><div><small>Total</small>${M(ct.total)}</div></div></section><section class="card"><div class="ey">Project summary</div><p>${E(e.summary||'Estimate based on the project information provided.')}</p></section><section class="card"><div class="ey">Scope of work</div><div class="scope-text">${E(legacyScope(e)||'Please refer to the estimate details provided by Sani Building Corp.')}</div></section><section class="card prices"><div class="pr total"><span>Your estimate</span><span>${M(ct.total)}</span></div></section>${actionHtml(c,approved)}`;track()}
function renderV7(r){rec=r;let e=r.estimate||{},c=r.customer||{},rq=r.request||{},sv=build(e),ct=calc(e),approved=isApproved(r),rows=sv.map(x=>`<div class="pr"><b>${E(x.title)}</b><b>${M(x.subtotal)}</b></div>`).join('');app.innerHTML=`<section class="hero"><div class="ey">Estimate ${E(ref)}</div><h1>${E(e.projectTitle||rq.service||'Renovation Estimate')}</h1><p>${E(c.address||'NYC Metro')}</p><div class="meta"><div><small>Prepared for</small>${E(c.name)}</div><div><small>Status</small>${E(approved?'Approved':(e.estimateStatus||'Ready'))}</div><div><small>Timeline</small>${E(e.timelineText||'TBD')}</div><div><small>Total</small>${M(ct.total)}</div></div></section><section class="card"><div class="ey">Project summary</div><p>${E(e.summary||'Estimate based on the project information provided.')}</p></section><section class="card prices"><div class="ey" style="padding:0 0 8px">Price by service</div>${e.showSectionSubtotals!==false?rows:''}<div class="pr total"><span>Your estimate</span><span>${M(ct.total)}</span></div></section>${sv.map((s,i)=>`<section class="svc"><div class="head"><div><div class="ey">Service ${i+1}</div><h2>${E(s.title)}</h2></div><b>${M(s.subtotal)}</b></div><div class="body">${list('Included in this service','in',s.included)}${list('Customer supplies','sup',s.customerSupplies)}${list('Not included','out',s.notIncluded)}${A(s.options).length?`<div class="opts"><div class="label">Alternatives</div>${A(s.options).map(o=>`<div class="opt"><span><b>${E(o.label)}</b>${o.description?`<div class="muted">${E(o.description)}</div>`:''}</span><b>${M(o.price)}</b></div>`).join('')}</div>`:''}${details(e,s)}</div></section>`).join('')}${actionHtml(c,approved)}`;track()}
function render(r){let e=(r&&r.estimate)||{};if(isV7(e))renderV7(r);else renderLegacy(r)}
function track(){new Image().src='/.netlify/functions/track-quote-open?ref='+encodeURIComponent(ref)+'&_='+Date.now()}
window.P=id=>{document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));let el=document.getElementById(id);if(el)el.classList.add('open')};
window.S=async a=>{let p={ref,action:a,finalTotal:calc(rec.estimate||{}).total};if(a==='accept')p.signature=document.getElementById('sig').value;if(a==='question')p.questionText=document.getElementById('msg').value;let rr=await fetch('/.netlify/functions/quote-response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),j=await rr.json();let st=document.getElementById('st');if(st)st.textContent=rr.ok?'Thank you. We received your response.':(j.error||'Please call us at (332) 277-0990.')};
if(!ref){app.textContent='Estimate link is incomplete.';return}fetch('/.netlify/functions/get-estimate?ref='+encodeURIComponent(ref),{cache:'no-store'}).then(r=>r.json()).then(j=>render(j.record||j.estimateRecord||j.data||j)).catch(e=>app.textContent='Could not load estimate: '+e.message)
})();
</script>
</body>
