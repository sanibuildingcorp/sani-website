<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Your Estimate | Sani Building Corp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --n:#0a1628;          /* navy */
  --n-deep:#050d1a;
  --g:#c8860a;          /* gold */
  --g-bright:#f0a500;
  --g-light:#ffb627;
  --p:#eef1f4;          /* page shell */
  --l:#dfe4ea;          /* hairline */
  --gr:#1f7a52;         /* included */
  --r:#a8443f;          /* not included */
  --muted:#5b6b7f;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--p);color:var(--n);font-family:var(--f);line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* sticky ref bar */
.pin{position:sticky;top:0;z-index:20;background:var(--n-deep);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.pin .pl{min-width:0}
.pin .pr2{white-space:nowrap;font-weight:700;color:var(--g-light);font-size:15px}
.pin .pref{font-size:11.5px;letter-spacing:.01em;color:#8fa8c0}
.pin .ptit{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* masthead */
.top{background:var(--n);color:#fff;padding:22px}
.brand,.wrap{max-width:820px;margin:auto}
.brand{font-weight:800;letter-spacing:-.02em;font-size:21px}
.brand span{color:var(--g-light)}
.wrap{padding:18px 14px 96px}

/* hero */
.hero,.head{background:var(--n);color:#fff}
.hero{padding:24px;border-radius:10px}
.hero h1{margin:8px 0 0;font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.22}
.ey{font-size:13px;letter-spacing:.01em;color:var(--g-light);font-weight:600}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.meta div{border-top:1px solid rgba(255,255,255,.16);padding-top:9px;font-size:14px;font-weight:600}
.meta small{display:block;color:#a9bacb;font-weight:400;font-size:12.5px;margin-bottom:3px}
.heroimg{width:100%;border-radius:8px;margin-top:16px;display:block;max-height:230px;object-fit:cover}

/* cards */
.card,.svc{background:#fff;border:1px solid var(--l);border-radius:10px;margin-top:14px}
.card{padding:18px}
.head{padding:15px 17px;display:flex;justify-content:space-between;gap:15px;border-radius:10px 10px 0 0}
.head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.head b{white-space:nowrap;font-size:17px;font-weight:700;color:var(--g-light)}
.body{padding:16px 17px}

/* scope lists */
.label{font-size:13px;letter-spacing:.01em;font-weight:600;margin:16px 0 7px;color:var(--muted)}
.body>.label:first-child{margin-top:0}
.in{color:var(--gr)}
.sup{color:#8a5c05}
.out{color:var(--r)}
ul{list-style:none;padding:0;margin:0}
li{padding:7px 0 7px 23px;border-bottom:1px solid #f0f2f5;font-size:14.5px;line-height:1.55;position:relative}
li:last-child{border-bottom:0}
li:before{position:absolute;left:0;top:7px}
.inlist li:before{content:'✓';color:var(--gr);font-weight:700}
.suplist li:before{content:'◆';color:var(--g);font-size:11px;top:9px}
.outlist li:before{content:'—';color:var(--r)}

/* totals */
.prices{overflow:hidden}
.pr{display:flex;justify-content:space-between;gap:12px;padding:13px 17px;border-top:1px solid #f0f2f5;font-size:15px}
.pr.total{background:var(--n);color:#fff;font-size:21px;font-weight:700;letter-spacing:-.01em;border-top:0}

/* options + detail */
details{margin-top:14px;border-top:1px solid #eef1f4;padding-top:12px}
summary{font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.lines{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.lines td{padding:8px 6px;border-bottom:1px solid #f0f2f5}
.lines td:last-child{text-align:right;white-space:nowrap}
.opts{background:#fdf9f0;border:1px solid #ecdcb4;border-radius:8px;padding:13px;margin-top:14px}
.opt{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eee0c0;font-size:14.5px}
.opt:first-of-type{border-top:0}
.muted{font-size:13px;color:var(--muted)}
.scope-text{white-space:pre-wrap;font-size:14.5px;color:#2c3846}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
button{padding:15px;border:0;border-radius:6px;font-weight:700;font-family:var(--f);font-size:15px;cursor:pointer}
.approve{background:var(--g-bright);color:var(--n-deep)}
.ask{background:#fff;border:1px solid var(--l);color:var(--n)}
.panel{display:none}
.panel.open{display:block}
.panel input,.panel textarea{width:100%;padding:13px;margin:8px 0;border:1px solid var(--l);border-radius:6px;font-family:var(--f);font-size:15px}
.status{margin-top:10px}
.approved{background:#edf7f1;border:1px solid #bcdfcc;color:#155e3c;padding:14px;border-radius:8px;margin-top:16px;font-size:14px}

/* message thread */
.thr{display:flex;flex-direction:column;gap:10px;padding:4px 0 2px}
.msg{max-width:86%;padding:11px 14px;border-radius:12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.them{align-self:flex-start;background:#f2f5f8;border:1px solid var(--l);border-bottom-left-radius:3px}
.msg.me{align-self:flex-end;background:var(--n);color:#fff;border-bottom-right-radius:3px}
.msgmeta{font-size:12px;letter-spacing:.01em;margin-bottom:4px;opacity:.8;font-weight:600}
.msg.me .msgmeta{color:var(--g-light)}
.msg.them .msgmeta{color:#6f7987}
.sendnote{font-size:13px;color:var(--muted);margin-top:8px}
.sendnote.bad{color:var(--r);font-weight:600}

.footer{text-align:center;font-size:12.5px;color:#7b8794;padding:26px}
:focus-visible{outline:2px solid var(--g-bright);outline-offset:2px}
@media(max-width:600px){
  .msg{max-width:92%}
  .meta{grid-template-columns:1fr 1fr}
  .actions{grid-template-columns:1fr}
  .hero h1{font-size:22px}
}
</style>
</head>
<body>
<header class="top"><div class="brand"><span>SANI</span> BUILDING CORP</div></header>
<main class="wrap" id="app">Loading estimate…</main>
<footer class="footer">Fully Insured · (332) 277-0990 · contact@sanibuildingcorp.com</footer>
<script>
(()=>{

   Show materials only -> the materials total.
   Show both / show neither -> the full grand total.
   Markup is baked into every one of those figures and is NEVER displayed as its own
   number or row: the customer must not be able to read the contractor's margin.
   quote.html previously ignored these flags entirely and always billed (l+m)*k, so a
   labor-only quote said $47,117.50 when the dashboard promised $24,835.00. */
/* MIRROR OF netlify/functions/lib/customer-total.js - keep them identical.
   This page is deliberately self-contained: it is the one page that must render
   for a customer with no working JavaScript fetch, so it carries no <script src>.
   That means it cannot require the shared module, so the logic is duplicated
   here on purpose - and netlify/functions/lib/customer-total.test.js extracts
   THIS function and asserts it agrees with the library across every toggle

/* A rate the estimator wrote into the item name - "Oak treads @ $118.00/ea" - is
   a CONTRACTOR number. Printed beside the marked-up extension it divides straight
   back out to the margin: 5,752.50 / 39 = 147.50 against the 118.00 in the text,
   which is 25%, exactly. friendly() has always stripped it. details() printed

   change the price: the total is always the full grand total. Markup is never its
   own row - it is baked into each amount, and labor+materials sum exactly to the
   total. If the contractor has set a manual total, the rows are scaled to it so
   they still add up. */

   service. When those subtotals are present they are the ONLY truth: the customer
   sees the same card names, in the same order, with the same prices the contractor
   saw before pressing Publish. No keyword guessing, no General redistribution, no
   scaling, no folding of extra cards into the biggest one - all of which are what
   made the dashboard show five services and the quote show two.
   Older estimates published before this change carry no subtotals; they keep the
   previous behaviour untouched. */

   the customer's "Not included" list - "Do not price this as refinishing,
   resurfacing, tread replacement, or an oak overlay project." The customer is not
   the audience for these and they read as disclaimers on work he is paying for.

   This filter catches ONLY the imperative voice, and nothing else.

   An earlier version also dropped exclusions that contradicted the service's own
   Included list, scored on shared word stems. It was removed: on review it deleted
   8 realistic exclusions out of 12, including "Mold removal" on any job whose
   included list mentioned "molding removal", because the stemmer collapses
   molding -> mold. A wrongly deleted exclusion silently removes the contractor's
   protection, which is worse than a leaked instruction. Anything needing judgement
   about whether an exclusion contradicts priced work belongs at source, in

   display layer cannot see it and any copy made here is the weaker one. */
const INSTRUCTION_RE=/^\s*(do not|don't|dont|please do not|do NOT)\b|\bdo not (price|assume|treat|quote|estimate)\b|estimating instruction|note to estimator/i;

/* THE CARDS MUST ALWAYS ADD UP TO THE HEADLINE.

   sums to the GRAND total. The headline is whatever the toggles say the customer
   pays. On a labor-only quote those are different numbers, and the difference is
   exactly the bucket the contractor chose not to quote:

     cards $47,117.50   headline $24,835.00   ->   $22,282.50, by subtraction

   occurs the page is showing service prices that outweigh its own total, and a
   customer always spots an error on a price.

function build(e){/* Services are whatever this estimate ACTUALLY contains, not a fixed list of four.

   none of the legacy guessing/redistribution/scaling below may run. */

   card for all four on EVERY quote, then let the keyword classifier below fill
   them. A stair repair with no painting in it acquired a Painting card because
   one materials line reads "canvas drop cloths, rosin paper, poly sheeting,

   unrecognised name silently became Bathroom - a stair job could print bathroom

   This used to test customerPresentationVersion against

   pipeline silently dropped this page back to legacy keyword-guessing and
   rescaling, and the customer's quote would change without one line of this

   The dashboard opens this page in an iframe with ?preview=1 and posts the
