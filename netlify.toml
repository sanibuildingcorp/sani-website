[build]
  functions = "netlify/functions"

# Serve the production dashboard through a tiny same-origin shell that loads
# the existing dashboard.html unchanged and injects only the customer-scope
# editor script. This avoids rewriting the large dashboard file.
[[redirects]]
  from = "/dashboard"
  to = "/dashboard-shell.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Always serve fresh HTML — prevents stale cached pages on Cloudflare and devices
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/dashboard-shell.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/js/customer-scope-control.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
