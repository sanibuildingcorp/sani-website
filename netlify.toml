# ═══════════════════════════════════════════════════════════════════
# SANI BUILDING CORP — Netlify Configuration
# ═══════════════════════════════════════════════════════════════════

[build]
  publish = "."
  functions = "netlify/functions"

# ─── FUNCTION TIMEOUT (26s max — needed for DALL-E 3 render generation) ───
[functions]
  timeout = 26

# ─── SECURITY HEADERS (apply to all pages) ───
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ─── BLOCK DEPLOY PREVIEWS FROM GOOGLE INDEXING ───
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
