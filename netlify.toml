[build]
  functions = "netlify/functions"

# Inject Customer Scope Control directly into the real dashboard response.
# This keeps dashboard.html itself untouched while avoiding iframe/shell issues.
[[edge_functions]]
  path = "/dashboard"
  function = "inject-dashboard-scope"

[[edge_functions]]
  path = "/dashboard.html"
  function = "inject-dashboard-scope"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Always serve fresh HTML — prevents stale cached pages on Cloudflare and devices
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/customer-scope-control.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
