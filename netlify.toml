[build]
  functions = "netlify/functions"

# Site-visit reminder email, twice a day. Cron is UTC:
#   11:00 UTC = 7 am New York (summer) / 6 am (winter) -> "Today's visits"
#   22:00 UTC = 6 pm New York (summer) / 5 pm (winter) -> "Tomorrow's visits"
# The function reads the New York clock to decide which list to send.
[functions."visit-reminders"]
  schedule = "0 11,22 * * *"

# The assistant learns from his history once a night: what was accepted at
# what price, how long jobs took, who never answered. 09:30 UTC = 5:30 am NY.
[functions."assistant-learn"]
  schedule = "30 9 * * *"

# Pull customer emails from the info@ inbox into the estimate they are about,
# every 15 minutes, so replies reach the conversation, the portal and the
# assistant without pressing "Sync inbox".
# (A separate tiny function, because a function that is on a schedule may
# not be reachable by URL in production, and the dashboard's "Sync inbox"
# button still calls inbox-sync directly.)
[functions."inbox-sync-scheduled"]
  schedule = "*/15 * * * *"

# The morning "Customer action list": the inbox of the last day and every
# estimate waiting on him, read by the assistant and emailed to him. 11:30
# UTC = 7:30 am New York (summer) / 6:30 am (winter). Sent only when there
# is something on it.
[functions."inbox-digest-scheduled"]
  schedule = "30 11 * * *"

# Serve /dashboard through a top-level shell that writes the real dashboard HTML
# into the same document, then loads Customer Scope Control. This keeps Safari
# full-page screenshots working (no iframe) and avoids editing the huge dashboard.html.
[[redirects]]
  from = "/dashboard"
  to = "/dashboard-shell.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Always serve fresh HTML — prevents stale cached pages on Cloudflare and devices
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/dashboard-shell.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/js/customer-scope-control.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# Auth helper — a stale cached copy would break login on every admin page
[[headers]]
  for = "/js/dashboard-auth.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
