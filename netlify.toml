[build]
  functions = "netlify/functions"

[[edge_functions]]
  function = "dashboard-inject"
  path = "/dashboard"

[[edge_functions]]
  function = "dashboard-inject"
  path = "/dashboard.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Always serve fresh HTML — prevents stale cached pages on Cloudflare and devices
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
