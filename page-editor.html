<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Photo Editor | Sani Building Corp</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="theme-color" content="#0a1628">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c8860a;--gold-2:#f0a500;--gold-3:#ffb627;--navy:#0a1628;--navy-2:#050d1a;--bg:#050d1a;--card:#0d1b30;--line:#1c2f4d;--ink:#eef2f8;--ink-muted:#8fa1bb;--green:#2ecc71;--red:#e74c3c;--display:'Playfair Display',serif;--body:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;height:100vh;display:flex;flex-direction:column;overflow:hidden}
em{color:var(--gold-2);font-style:italic}
button{font-family:var(--body);cursor:pointer}
/* login */
.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 30% 20%,var(--navy) 0%,var(--bg) 60%);z-index:50}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:44px 36px;max-width:400px;width:100%;text-align:center}
.login-logo{font-family:var(--display);font-size:28px;letter-spacing:5px;color:var(--gold-2);margin-bottom:6px}
.login-sub{font-size:12px;letter-spacing:3px;color:var(--ink-muted);margin-bottom:32px;text-transform:uppercase}
.login-input{width:100%;padding:14px 16px;background:var(--navy);border:1.5px solid var(--line);color:var(--ink);font-size:15px;border-radius:10px;margin-bottom:14px;font-family:var(--body)}
.login-input:focus{outline:none;border-color:var(--gold)}
.login-btn{width:100%;padding:14px;background:var(--gold);color:var(--navy-2);border:none;border-radius:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:13px}
.login-err{color:var(--red);font-size:13px;margin-top:10px;display:none}
/* topbar */
.topbar{background:var(--navy);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0}
.brand{font-family:var(--display);font-size:17px;letter-spacing:2px;white-space:nowrap}
.brand span{color:var(--gold-2)}
.badge-tool{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
select,#page-input{padding:9px 12px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:8px;font-family:var(--body);font-size:13px;min-width:170px}
.btn-load{padding:9px 18px;background:var(--gold);color:var(--navy-2);border:none;border-radius:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px}
.topbar a{color:var(--ink-muted);font-size:13px;text-decoration:none;margin-left:auto}
.topbar a:hover{color:var(--gold-2)}
/* layout */
.main{flex:1;display:flex;min-height:0}
.frame-wrap{flex:1;position:relative;background:#222;min-width:0}
#page-frame{width:100%;height:100%;border:none;background:#fff}
#frame-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:14px;text-align:center;padding:30px;pointer-events:none}
/* side panel */
.panel{width:340px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);padding:18px;overflow-y:auto}
.panel h2{font-family:var(--display);font-size:19px;margin-bottom:4px}
.panel .sub{color:var(--ink-muted);font-size:12.5px;margin-bottom:14px;line-height:1.5}
.cur-photo{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:10px;display:none}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);font-weight:700;margin-bottom:5px}
.fld input[type=text]{width:100%;padding:10px 12px;background:var(--navy);border:1.5px solid var(--line);color:var(--ink);border-radius:8px;font-size:13px;font-family:var(--body)}
.fld input:focus{outline:none;border-color:var(--gold)}
.ref-line{font-size:11px;color:var(--ink-muted);word-break:break-all;background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pick-btn{width:100%;padding:12px;border:2px dashed var(--gold);background:transparent;color:var(--gold-2);border-radius:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px;margin-bottom:12px}
.pub-btn{width:100%;padding:14px;background:var(--gold);color:var(--navy-2);border:none;border-radius:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:13px}
.pub-btn:disabled{opacity:.45;cursor:not-allowed}
.msg{margin-top:12px;font-size:13px;line-height:1.5;border-radius:8px;padding:10px 12px;display:none}
.msg.ok{background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.4);color:var(--green)}
.msg.err{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.4);color:#ff9a8c}
.msg.warn{background:rgba(240,165,0,.1);border:1px solid var(--gold);color:var(--gold-3)}
.new-preview{width:100%;border-radius:10px;border:1px solid var(--gold);margin-bottom:12px;display:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-x{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:8px;padding:3px 12px;font-size:16px;line-height:1.4}
.panel.collapsed{display:none}
#panel-fab{display:none;position:fixed;right:14px;bottom:14px;z-index:60;padding:13px 18px;background:var(--gold);color:var(--navy-2);border:none;border-radius:999px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
body.panel-closed #panel-fab{display:block}
@media(max-width:820px){.main{flex-direction:column}.panel{width:100%;border-left:none;border-top:1px solid var(--line);max-height:46vh}}
</style>
</head>
<body>

<div class="login-screen" id="login">
  <div class="login-card">
    <div class="login-logo">SANI</div>
    <div class="login-sub">Page Photo Editor · Admin Only</div>
    <input type="password" class="login-input" id="pass" placeholder="Password" onkeydown="if(event.key==='Enter')checkPass()">
    <button class="login-btn" onclick="checkPass()">Enter</button>
    <div class="login-err" id="login-err">Wrong password.</div>
  </div>
</div>

<div class="topbar">
  <div class="brand"><span>SANI</span> BUILDING CORP</div>
  <div class="badge-tool">Page Photo Editor</div>
  <select id="page-select" onchange="document.getElementById('page-input').value=this.value"></select>
  <input type="text" id="page-input" placeholder="page slug, e.g. painting" onkeydown="if(event.key==='Enter')loadPage()">
  <button class="btn-load" onclick="loadPage()">Load Page →</button>
  <a href="/dashboard.html">Dashboard</a>
</div>

<div class="main">
  <div class="frame-wrap">
    <iframe id="page-frame" title="page"></iframe>
    <div id="frame-hint">Pick a page above and click <b>&nbsp;Load Page&nbsp;</b> — then click any photo on the page to replace it.</div>
  </div>
  <div class="panel" id="panel">
    <div class="panel-head"><h2>Replace <em>Photo</em></h2><button class="panel-x" onclick="togglePanel(false)" title="Hide panel to see the whole page">✕</button></div>
    <div class="sub" id="panel-sub">Click a photo on the page. Gold outline = replaceable. Page links are disabled while editing.</div>
    <img class="cur-photo" id="cur-photo" alt="current photo">
    <div class="fld" id="ref-fld" style="display:none"><label>Current reference in HTML</label><div class="ref-line" id="cur-ref"></div></div>
    <button class="pick-btn" id="pick-btn" style="display:none" onclick="document.getElementById('file-input').click()">📷 Choose new photo</button>
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="fileChosen(event)">
    <img class="new-preview" id="new-preview" alt="new photo preview">
    <div class="fld" id="path-fld" style="display:none"><label>Save as (repo path)</label><input type="text" id="new-path"></div>
    <div class="fld" id="alt-fld" style="display:none"><label>Alt text (describes photo for SEO)</label><input type="text" id="alt-text"></div>
    <button class="pub-btn" id="pub-btn" style="display:none" disabled onclick="publish()">🚀 Publish to Page</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<button id="panel-fab" onclick="togglePanel(true)">🖼 Photo Panel</button>

<script src="/js/dashboard-auth.js"></script>
<script>
/* ============ AUTH (same session as dashboard) ============
   Password is verified by netlify/functions/dashboard-login.js against the
   DASHBOARD_PASSWORD env var — see /js/dashboard-auth.js. Never hardcode it. */
function checkPass(){
  const err = document.getElementById("login-err");
  sbcVerifyPassword(document.getElementById("pass").value).then(function(res){
    if(res.ok){
      document.getElementById("login").style.display = "none";
    } else {
      err.textContent = res.error;
      err.style.display = "block";
    }
  });
}
if(sessionStorage.getItem("sbc-auth") === "1") document.getElementById("login").style.display = "none";

/* ============ PAGE LIST from sitemap ============ */
(async function fillPages(){
  const sel = document.getElementById("page-select");
  sel.innerHTML = '<option value="">— pick a page —</option><option value="index">index (home)</option>';
  try{
    const xml = await (await fetch("/sitemap.xml?t="+Date.now())).text();
    const locs = Array.from(xml.matchAll(/<loc>([^<]+)<\/loc>/g)).map(m=>m[1]);
    const seen = {};
    locs.forEach(function(u){
      let slug;
      try{ slug = new URL(u).pathname.replace(/^\/+|\/+$/g,"").replace(/\.html$/,""); }catch(e){ return; }
      if(!slug || slug==="index" || seen[slug]) return;
      seen[slug]=1;
      const o = document.createElement("option");
      o.value = slug; o.textContent = slug;
      sel.appendChild(o);
    });
  }catch(e){ /* manual input still works */ }
})();

/* ============ LOAD PAGE + MAKE PHOTOS CLICKABLE ============ */
let curSlug = "", selectedImg = null, newImageData = null;

function loadPage(){
  const slug = (document.getElementById("page-input").value || "").trim().replace(/^\/+|\.html$/g,"") || "index";
  curSlug = slug;
  resetPanel();
  const f = document.getElementById("page-frame");
  document.getElementById("frame-hint").style.display = "none";
  f.src = "/" + slug + ".html?sbcpe=" + Date.now();
  f.onload = function(){ try{ armFrame(f); }catch(e){ showMsg("err","Couldn't access the page frame: "+e.message); } };
}

function armFrame(f){
  const doc = f.contentDocument;
  if(!doc){ showMsg("err","Frame blocked — open this tool on sanibuildingcorp.com itself."); return; }

  // Block navigation while editing (links, buttons) — photos only.
  // Coordinate hit-test: galleries often place caption/overlay layers ON TOP of
  // the photo, so e.target isn't the <img>. We select whichever editable photo
  // sits under the click point, regardless of what layer caught the event.
  doc.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation();
    let img = e.target.closest ? e.target.closest("img") : null;
    if(!(img && img.__sbcEditable)){
      img = null;
      let best = Infinity;
      const x = e.clientX, y = e.clientY;
      doc.querySelectorAll("img").forEach(function(cand){
        if(!cand.__sbcEditable) return;
        const r = cand.getBoundingClientRect();
        if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){
          const area = (r.right - r.left) * (r.bottom - r.top);
          if(area < best){ best = area; img = cand; }
        }
      });
    }
    if(img && img.__sbcEditable) selectImg(img);
  }, true);

  const imgs = Array.from(doc.querySelectorAll("img"));
  let count = 0;
  imgs.forEach(function(img){
    const mark = function(){
      const inChrome = img.closest("header, nav, footer");
      const tooSmall = (img.naturalWidth && img.naturalWidth < 80) || (img.width && img.width < 80);
      const src = img.getAttribute("src") || "";
      if(inChrome || tooSmall || /logo/i.test(src)) return;
      img.__sbcEditable = true;
      img.style.outline = "3px dashed rgba(240,165,0,.85)";
      img.style.outlineOffset = "-3px";
      img.style.cursor = "pointer";
      count++;
      document.getElementById("panel-sub").textContent = count + " replaceable photo(s) found — click one on the page.";
    };
    if(img.complete) mark(); else img.addEventListener("load", mark);
  });
  if(imgs.length === 0) document.getElementById("panel-sub").textContent = "No <img> photos found on this page.";
}

/* ============ SELECT + REPLACE ============ */
function togglePanel(open){
  document.getElementById("panel").classList.toggle("collapsed", !open);
  document.body.classList.toggle("panel-closed", !open);
}

function selectImg(img){
  togglePanel(true);
  // clear previous highlight + revert its unpublished preview, if any
  if(selectedImg){ try{
    selectedImg.style.outline = "3px dashed rgba(240,165,0,.85)";
    if(selectedImg.__sbcPreviewed && selectedImg.__sbcOrigSrc){
      selectedImg.src = selectedImg.__sbcOrigSrc;
      selectedImg.__sbcPreviewed = false;
    }
  }catch(e){} }
  selectedImg = img;
  img.style.outline = "4px solid #2ecc71";
  newImageData = null;

  // If a fallback swapped the src at load time, the original local path was
  // preserved in data-sbc-ref — use it so publish targets the real slot.
  const ref = (img.dataset && img.dataset.sbcRef) || img.getAttribute("src") || "";
  document.getElementById("cur-photo").src = img.src;
  document.getElementById("cur-photo").style.display = "block";
  document.getElementById("cur-ref").textContent = ref;
  document.getElementById("ref-fld").style.display = "block";
  document.getElementById("pick-btn").style.display = "block";
  document.getElementById("alt-text").value = img.getAttribute("alt") || "";
  document.getElementById("alt-fld").style.display = "block";
  document.getElementById("path-fld").style.display = "block";
  document.getElementById("pub-btn").style.display = "block";
  document.getElementById("pub-btn").disabled = true;
  document.getElementById("new-preview").style.display = "none";
  document.getElementById("msg").style.display = "none";

  // Same repo path if already local (keeps shared folders working); else a new local path
  let path = ref.split("?")[0].split("#")[0].replace(/^\/+/,"");
  if(!/^images\//i.test(path) || /^https?:/i.test(ref)){
    const folder = "images/" + (curSlug === "index" ? "home" : curSlug.replace(/[^a-z0-9\-]/gi,"-"));
    const isHero = !!(img.closest && (img.closest(".page-hero") || img.closest(".hero"))) || /hero/i.test(img.className);
    path = folder + (isHero ? "/hero.jpg" : "/photo-" + Date.now().toString(36) + ".jpg");
  }
  document.getElementById("new-path").value = path;
}

function fileChosen(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const im = new Image();
    im.onload = function(){
      // client-side optimize: max 1400px wide, JPEG q0.78 (matches Squoosh workflow)
      const maxW = 1400;
      const sc = Math.min(1, maxW / im.width);
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      newImageData = c.toDataURL("image/jpeg", 0.78);
      const kb = Math.round(newImageData.length * 0.75 / 1024);
      const prev = document.getElementById("new-preview");
      prev.src = newImageData; prev.style.display = "block";
      // LIVE PREVIEW: show the new photo on the page card itself (not live yet)
      if(selectedImg){
        if(!selectedImg.__sbcOrigSrc) selectedImg.__sbcOrigSrc = selectedImg.src;
        selectedImg.src = newImageData;
        selectedImg.__sbcPreviewed = true;
      }
      document.getElementById("pub-btn").disabled = false;
      showMsg("warn","👁 Previewing on the page card (~"+kb+" KB) — NOT live yet. Like it? Check path + alt text, then Publish. Pick a different file or another photo to undo.");
    };
    im.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function publish(){
  if(!newImageData || !selectedImg) return;
  const btn = document.getElementById("pub-btn");
  btn.disabled = true; btn.textContent = "Publishing…";
  try{
    const res = await sbcFetch("/.netlify/functions/publish-image-to-page",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        page: curSlug,
        imageBase64: newImageData,
        newPath: document.getElementById("new-path").value.trim(),
        currentRef: document.getElementById("cur-ref").textContent,
        kind: "img",
        alt: document.getElementById("alt-text").value.trim()
      })
    });
    const d = await res.json();
    if(!res.ok || d.error) throw new Error(d.error || ("Publish failed ("+res.status+")"));
    if(selectedImg){ selectedImg.__sbcPreviewed = false; selectedImg.__sbcOrigSrc = null; }
    showMsg(d.warning ? "warn" : "ok",
      (d.warning ? "⚠ " + d.warning : "✓ Published! Image committed and page updated.") +
      " Netlify deploys in ~40s — then Cloudflare → Purge Everything, and press Load Page to see it live.");
  }catch(err){
    showMsg("err","✕ " + err.message);
  }
  btn.disabled = false; btn.textContent = "🚀 Publish to Page";
}

function resetPanel(){
  selectedImg = null; newImageData = null;
  ["cur-photo","ref-fld","pick-btn","new-preview","path-fld","alt-fld","pub-btn","msg"].forEach(function(id){
    document.getElementById(id).style.display = "none";
  });
  document.getElementById("panel-sub").textContent = "Click a photo on the page. Gold outline = replaceable. Page links are disabled while editing.";
}

function showMsg(kind, text){
  const m = document.getElementById("msg");
  m.className = "msg " + kind; m.textContent = text; m.style.display = "block";
}
</script>
</body>
</html>
