<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SBC Dashboard</title>
<style>
html,body{margin:0;min-height:100%;background:#fff}
#sbc-shell-loading{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#44536a;padding:32px;text-align:center}
</style>
</head>
<body>
<div id="sbc-shell-loading">Loading dashboard…</div>
<script>
(function(){
  function fail(msg){
    document.body.innerHTML='<div style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:32px;color:#8b1e1e"><strong>Dashboard could not load.</strong><br><br>'+String(msg||'Please refresh the page.')+'</div>';
  }
  fetch('/dashboard.html?core=4',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(html){
      /* Use the robust V2 module: it retries, observes modal DOM changes, and
         does not depend on renderEdit being defined at one exact moment. */
      var scopeScript='<scr'+'ipt id="sbc-scope-v2-loader" src="/js/customer-scope-loader-v2.js?v=20260806-2155"></scr'+'ipt>';
      if(html.indexOf('</body>')!==-1) html=html.replace('</body>',scopeScript+'</body>');
      else html+=scopeScript;
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){ console.error('SBC dashboard shell load failed',e); fail(e.message); });
})();
</script>
</body>
</html>
