<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SBC Dashboard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}#core{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="core" src="/dashboard.html?core=1" title="SBC Dashboard"></iframe>
<script>
(function(){
  var frame=document.getElementById('core');
  function inject(){
    try{
      var w=frame.contentWindow,d=frame.contentDocument;
      if(!w||!d)return;
      if(d.getElementById('sbc-direct-scope-loader'))return;
      var s=d.createElement('script');
      s.id='sbc-direct-scope-loader';
      s.src='/js/customer-scope-control.js?v=direct-20260806-1';
      s.onload=function(){console.log('SBC customer scope control loaded directly');};
      s.onerror=function(){console.error('SBC customer scope control failed to load');};
      (d.head||d.documentElement).appendChild(s);
    }catch(e){console.error('SBC dashboard shell inject failed',e);}
  }
  frame.addEventListener('load',function(){inject();setTimeout(inject,500);setTimeout(inject,1500);});
  setInterval(inject,3000);
})();
</script>
</body>
</html>
