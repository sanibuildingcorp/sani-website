name: Integrate deterministic estimator v2
on:
  push:
    branches: [deterministic-estimator-v2]
    paths: ['.github/workflows/integrate-deterministic-v2.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deterministic-estimator-v2
      - name: Patch estimator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/generate-estimate-background.js')
          s=p.read_text()
          req='const { applyDeterministicPricing } = require("./lib/deterministic-pricing");'
          if req not in s:
              anchor='const { getStore } = require("@netlify/blobs");'
              assert anchor in s, 'require anchor missing'
              s=s.replace(anchor, anchor+'\n'+req, 1)
          hook='''    // DETERMINISTIC PRICING GATE: AI interprets scope; Sani rules control production hours,\n    // mutually-exclusive alternatives, service ownership, and estimate health.\n    estimate = applyDeterministicPricing(estimate, projectAnalysis, input);\n    validation = validateEstimate(estimate, projectAnalysis, input);\n\n'''
          anchor2='    estimate = finalizeCustomerPresentation(estimate, projectAnalysis, input);'
          if hook not in s:
              assert anchor2 in s, 'finalize anchor missing'
              s=s.replace(anchor2, hook+anchor2, 1)
          p.write_text(s)
          PY
          node --check netlify/functions/generate-estimate-background.js
          node --check netlify/functions/lib/deterministic-pricing.js
      - name: Commit integration
        run: |
          git config user.name "sani-estimator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/generate-estimate-background.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate deterministic pricing gate"
          git push origin HEAD:deterministic-estimator-v2
