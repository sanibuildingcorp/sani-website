name: Compact Scope Control UI

on:
  push:
    paths:
      - ".scope-ui/TRIGGER"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard Scope Control presentation only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('dashboard.html')
          s = p.read_text()

          css = r'''/* ============ CUSTOMER SCOPE CONTROL ============ */
.sc-panel{border:1px solid var(--line);border-radius:12px;padding:14px!important}
.sc-panel>h3{margin-bottom:8px!important;gap:6px;flex-wrap:wrap}
.sc-warn{background:#fff4e5;border-left:3px solid #c8860a;border-radius:6px;padding:9px 10px;font-size:12px;line-height:1.45;color:#6b4d10;margin-bottom:8px}
.sc-status{margin-bottom:10px}
.sc-pill{display:inline-block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:20px;font-weight:700}
.sc-pill-live{background:#e6f4ea;color:#1e6b34}.sc-pill-draft{background:#f1f1f1;color:#666}
.sc-service{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;overflow:hidden}
.sc-service-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:10px 11px;background:#fbfaf7;cursor:pointer;user-select:none}
.sc-service-head:hover{background:#f7f4ea}
.sc-service-name-display{min-width:0;font-weight:750;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.sc-service-counts{font-size:10px;color:var(--ink-muted);white-space:nowrap}
.sc-subtotal{font-weight:750;font-size:13px;color:var(--gold-2,#b8720a);white-space:nowrap}
.sc-chevron{font-size:13px;color:var(--ink-muted);transition:transform .15s}.sc-service.open>.sc-service-head .sc-chevron{transform:rotate(180deg)}
.sc-service-body{display:none;border-top:1px solid var(--line-soft);padding:9px 10px 10px}.sc-service.open>.sc-service-body{display:block}
.sc-name-edit{display:flex;gap:6px;align-items:center;margin-bottom:8px}.sc-service-name{flex:1;min-width:0;font-weight:650;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.sc-group{border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:7px;margin-bottom:6px;overflow:hidden;padding:0}
.sc-inc{border-left-color:#2f9e5c}.sc-sup{border-left-color:#c8860a}.sc-exc{border-left-color:#b0b0b0}
.sc-group-head{width:100%;display:flex;align-items:center;gap:7px;border:0;background:#fff;padding:7px 8px;cursor:pointer;text-align:left}
.sc-group-label{flex:1;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-muted);font-weight:750;margin:0}.sc-group-count{font-size:10px;color:var(--ink-muted)}
.sc-group-body{display:none;padding:2px 7px 7px}.sc-group.open>.sc-group-body{display:block}.sc-group.open>.sc-group-head .sc-chevron{transform:rotate(180deg)}
.sc-row{display:grid;grid-template-columns:minmax(0,1fr) 78px 30px;gap:4px;align-items:center;margin-bottom:4px}
.sc-item{width:100%;min-width:0;font-size:12px;border:1px solid var(--line-soft);border-radius:6px;padding:6px 7px;background:#fff}
.sc-move{font-size:10px;border:1px solid var(--line-soft);border-radius:6px;padding:5px 3px;background:#fff;width:78px;max-width:none}
.sc-del{width:30px;height:30px;border:1px solid #f1c7c2;background:#fff;color:#c0392b;font-size:12px;cursor:pointer;padding:0;border-radius:6px}
.sc-add{font-size:11px;border:1px dashed var(--line);background:none;border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--ink-muted)}
.sc-del-svc{font-size:10.5px;border:none;background:none;color:#c0392b;cursor:pointer;padding:4px 0}
.sc-secondary-actions{display:flex;gap:6px;margin:8px 0 6px}.sc-secondary-actions button{flex:1;padding:8px 7px!important;font-size:10.5px!important}
.sc-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.sc-actions button{min-width:0!important;padding:10px 8px!important;font-size:11px!important}.sc-actions .sc-publish{grid-column:1/-1}
.sc-preview{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfaf7}
.sc-preview-title{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px;font-weight:700}.sc-prev-svc{margin-bottom:8px}.sc-prev-name{display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-bottom:3px}.sc-prev-total{color:var(--gold-2,#b8720a)}.sc-prev-g{font-size:11.5px;line-height:1.45;margin-bottom:4px}.sc-prev-g ul{margin:2px 0 0 16px;padding:0}
@media(max-width:640px){
 .sc-panel{padding:11px!important}.sc-panel>h3{font-size:12px!important;letter-spacing:1.3px!important}.sc-panel>h3 span{display:block;width:100%;font-size:10.5px!important}
 .sc-service-head{grid-template-columns:minmax(0,1fr) auto 14px;padding:9px}.sc-service-counts{grid-column:1/2;font-size:9.5px}.sc-subtotal{grid-column:2/3;grid-row:1/3}.sc-chevron{grid-column:3/4;grid-row:1/3}
 .sc-service-body{padding:7px}.sc-row{grid-template-columns:minmax(0,1fr) 68px 28px}.sc-move{width:68px;font-size:9px}.sc-del{width:28px;height:28px}.sc-item{font-size:11.5px;padding:5px 6px}
 .sc-secondary-actions{display:grid;grid-template-columns:1fr 1fr}.sc-actions{grid-template-columns:1fr 1fr}.sc-actions .sc-publish{grid-column:1/-1}
}

/* ============ CUSTOMER VIEW MODE - CHECKBOXES + PREVIEW ============ */'''

          s2, n1 = re.subn(r'/\* ============ CUSTOMER SCOPE CONTROL ============ \*/.*?/\* ============ CUSTOMER VIEW MODE - CHECKBOXES \+ PREVIEW ============ \*/', css, s, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit(f'CSS block replacement count={n1}')

          js = r'''var scopeOpenServices = {};
var scopeOpenGroups = {};

function scopeToggleService(si) {
  scopeOpenServices[si] = !scopeOpenServices[si];
  renderScopeControl();
}
function scopeToggleGroup(si, key) {
  var k = si + ':' + key;
  scopeOpenGroups[k] = !scopeOpenGroups[k];
  renderScopeControl();
}

function renderScopeControl() {
  var wrap = document.getElementById("scope-control-wrap");
  if (!wrap || !currentRecord) return;
  var est = currentRecord.estimate || {};
  var d = scopeDraft();
  var shared = scopeAlreadyShared();
  var published = est.customerScopePublished === true;

  var groups = [
    { key: "included", label: "✓ INCLUDED", cls: "sc-inc" },
    { key: "supplied", label: "◆ CUSTOMER SUPPLIES", cls: "sc-sup" },
    { key: "excluded", label: "— NOT INCLUDED", cls: "sc-exc" }
  ];

  var html = '<div class="form-section sc-panel">' +
    '<h3>🧾 CUSTOMER SCOPE CONTROL <span style="font-size:12px;font-weight:400;color:var(--ink-muted);letter-spacing:0">wording only — pricing stays separate</span></h3>';

  if (shared) {
    html += '<div class="sc-warn">This estimate has already been shared. Draft edits stay private until you publish a new customer scope.</div>';
  }
  html += '<div class="sc-status">' +
    (published ? '<span class="sc-pill sc-pill-live">Published scope is live</span>'
               : '<span class="sc-pill sc-pill-draft">Private draft</span>') +
    '</div>';

  d.services.forEach(function (svc, si) {
    var isOpen = scopeOpenServices[si] === true;
    var incN = (svc.included || []).length, supN = (svc.supplied || []).length, excN = (svc.excluded || []).length;
    html += '<div class="sc-service' + (isOpen ? ' open' : '') + '">' +
      '<div class="sc-service-head" onclick="scopeToggleService(' + si + ')">' +
        '<div class="sc-service-name-display">' + esc(svc.name) + '</div>' +
        '<div class="sc-service-counts">' + incN + ' included · ' + supN + ' supplied · ' + excN + ' excluded</div>' +
        '<span class="sc-subtotal" title="Calculated from Labor and Materials">' + fmt(scopeServiceSubtotal(svc.name)) + '</span>' +
        '<span class="sc-chevron">⌄</span>' +
      '</div>' +
      '<div class="sc-service-body">' +
        '<div class="sc-name-edit"><input class="sc-service-name" value="' + esc(svc.name) + '" onclick="event.stopPropagation()" onchange="scopeRenameService(' + si + ', this.value)"></div>';

    groups.forEach(function (g) {
      var items = svc[g.key] || [];
      var gk = si + ':' + g.key;
      var gOpen = scopeOpenGroups[gk] === true;
      html += '<div class="sc-group ' + g.cls + (gOpen ? ' open' : '') + '">' +
        '<button type="button" class="sc-group-head" onclick="scopeToggleGroup(' + si + ',\'' + g.key + '\')">' +
          '<span class="sc-group-label">' + g.label + '</span><span class="sc-group-count">' + items.length + '</span><span class="sc-chevron">⌄</span>' +
        '</button>' +
        '<div class="sc-group-body">';
      if (!items.length) html += '<div style="font-size:11px;color:var(--ink-muted);padding:3px 0 6px">No items</div>';
      items.forEach(function (txt, ii) {
        html += '<div class="sc-row">' +
          '<input class="sc-item" value="' + esc(txt) + '" onchange="scopeEditItem(' + si + ',\'' + g.key + '\',' + ii + ',this.value)">' +
          '<select class="sc-move" onchange="scopeMoveItem(' + si + ',\'' + g.key + '\',' + ii + ',this.value);this.selectedIndex=0">' +
            '<option value="">move…</option>' +
            (g.key !== "included" ? '<option value="included">Included</option>' : '') +
            (g.key !== "supplied" ? '<option value="supplied">Supplied</option>' : '') +
            (g.key !== "excluded" ? '<option value="excluded">Excluded</option>' : '') +
            '<option value="__svc">Service…</option>' +
          '</select>' +
          '<button class="sc-del" onclick="scopeDeleteItem(' + si + ',\'' + g.key + '\',' + ii + ')" title="Delete">✕</button>' +
        '</div>';
      });
      html += '<button class="sc-add" onclick="scopeAddItem(' + si + ',\'' + g.key + '\')">+ Add item</button>' +
        '</div></div>';
    });
    html += '<button class="sc-del-svc" onclick="scopeDeleteService(' + si + ')">Remove this service</button>' +
      '</div></div>';
  });

  html += '<div class="sc-secondary-actions">' +
      '<button class="btn-secondary" onclick="scopeAddService()">+ Service</button>' +
      '<button class="btn-secondary" onclick="scopeRebuildFromAI()">↻ Rebuild from AI</button>' +
    '</div>' +
    '<div class="sc-actions">' +
      '<button class="btn-secondary" onclick="scopeSaveDraft()">💾 Save Draft</button>' +
      '<button class="btn-secondary" onclick="scopePreview()">👁 Preview</button>' +
      '<button class="btn-primary sc-publish" onclick="scopePublish()">🚀 Publish Customer Scope</button>' +
    '</div>' +
    '<div id="sc-preview" class="sc-preview" style="display:none"></div>' +
  '</div>';

  wrap.innerHTML = html;
}

/* ---- mutations (structure changes re-render; text edits do not) ---- */'''

          s3, n2 = re.subn(r'function renderScopeControl\(\) \{.*?/\* ---- mutations \(structure changes re-render; text edits do not\) ---- \*/', js, s2, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit(f'JS block replacement count={n2}')

          p.write_text(s3)

      - name: Verify Scope Control logic was not removed
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function scopeSaveDraft' dashboard.html
          grep -q 'function scopePublish' dashboard.html
          grep -q 'CONTRACTOR_OWNED_ESTIMATE_FIELDS' dashboard.html
          grep -q 'function scopeToggleService' dashboard.html
          grep -q 'sc-secondary-actions' dashboard.html

      - name: Commit compact UI and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .scope-ui
          rm -f .github/workflows/compact-scope-ui.yml
          git config user.name "SBC UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Compact Customer Scope Control mobile UI"
          git push
