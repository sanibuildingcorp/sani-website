name: Windows V1.5 Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/window-v15-recovery.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch and validate
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/window-v15.log 2>&1
          from pathlib import Path
          import re
          p=Path('netlify/functions/lib/deterministic-pricing.js')
          s=p.read_text()
          helper=r'''function parseWindowCount(input,analysis){const raw=[input?.request?.description,input?.request?.contractorNotes,input?.request?.extraNotes,JSON.stringify(analysis?.confirmed_scope||[])].filter(Boolean).join(' | ');let total=0,m;const re=/(\d+(?:\.\d+)?)\s*[\"”]?\s*[x×]\s*(\d+(?:\.\d+)?)\s*[\"”]?[^|\n]{0,45}?(?:quantity|qty)\s*[:#-]?\s*(\d+)/gi;while((m=re.exec(raw)))total+=Number(m[3])||0;return total||8}
function ensureWindowOptionEngine(estimate,analysis,input,adj){if(!windowRequested(input,analysis))return;estimate.options=Array.isArray(estimate.options)?estimate.options:[];const mm=1+num(estimate.markupPct||RULES.markupDefault)/100;let hasBase=[...(estimate.labor||[]),...(estimate.materials||[])].some(isWindowLine);const optionA=estimate.options.find(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='A');if(!hasBase&&optionA&&num(optionA.price)>0){const preMarkup=money(num(optionA.price)/mm);estimate.materials.push({section:'Windows',item:`${text(optionA.label)||'Window Option A'} — selected base allowance`,qty:1,unit:'allowance',rate:preMarkup});estimate.options=estimate.options.filter(o=>o!==optionA);hasBase=true;adj.push({type:'BASE_OPTION_PROMOTED',service:'Windows',option:'A',customerPrice:money(optionA.price)})}if(!hasBase){const count=parseWindowCount(input,analysis),hours=Math.max(12,Math.ceil(count*3.5));estimate.labor.push({section:'Windows',item:`Window Option A — remove, prepare openings and install ${count} specified aluminum replacement windows`,qty:hours,unit:'hrs',rate:95});estimate.materials.push({section:'Windows',item:`Window Option A — ${count} specified aluminum replacement windows allowance`,qty:count,unit:'ea',rate:900});hasBase=true;adj.push({type:'WINDOW_BASE_SYNTHESIZED',service:'Windows',option:'A',windowCount:count,laborHours:hours,unitMaterialAllowance:900})}estimate.options=estimate.options.filter(o=>!(canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='A'));if(!estimate.options.some(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='B')){const count=parseWindowCount(input,analysis),adjust=Math.max(0,count-2),raw=(8+adjust*1.5)*95+2500+adjust*100;estimate.options.push({section:'Windows',label:'Option B — Replace 2 premium acoustic windows + adjust remaining existing windows',description:'Alternative requested by customer; excluded from base Grand Total until selected.',price:money(raw*mm)});adj.push({type:'WINDOW_ALTERNATIVE_SYNTHESIZED',service:'Windows',option:'B',customerPrice:money(raw*mm)})}estimate.optionSelections=estimate.optionSelections||{};estimate.optionSelections.Windows={selected:'Option A',baseIncluded:true,alternatives:estimate.options.filter(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows').map(o=>({label:o.label,description:o.description,price:money(o.price)}))}}
'''
          pat=r'function ensureWindowOptionEngine\(estimate,analysis,input,adj\)\{.*?\}\nfunction genericOperation'
          replacement=helper+'function genericOperation'
          s2,n=re.subn(pat,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'PATCH_MATCH_COUNT={n}')
          s2=s2.replace('deterministic estimator guardrails v1.4','deterministic estimator guardrails v1.5',1)
          s2=s2.replace("version:'deterministic-v1.4'","version:'deterministic-v1.5'")
          s2=s2.replace("version:'v1.4'","version:'v1.5'")
          p.write_text(s2)
          print('PATCH_OK')
          PY
          py=$?
          node --check netlify/functions/lib/deterministic-pricing.js >> /tmp/window-v15.log 2>&1
          js=$?
          if [ "$py" -eq 0 ] && [ "$js" -eq 0 ] && grep -q 'guardrails v1.5' netlify/functions/lib/deterministic-pricing.js; then
            echo PASS > window-v15-status.txt
            cat /tmp/window-v15.log >> window-v15-status.txt
            git add netlify/functions/lib/deterministic-pricing.js window-v15-status.txt
          else
            echo FAIL > window-v15-status.txt
            echo "python=$py node=$js" >> window-v15-status.txt
            cat /tmp/window-v15.log >> window-v15-status.txt
            git add window-v15-status.txt
          fi
      - name: Commit result
        run: |
          git config user.name "sani-estimator-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Apply Windows v1.5 recovery patch"
          git push origin HEAD:main