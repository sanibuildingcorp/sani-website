name: Patch background persistence on save change
on:
  push:
    paths:
      - 'netlify/functions/save-estimate.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch background persistence fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/generate-estimate-background.js')
          s=p.read_text()

          old='''    if (store) { try { await store.setJSON(ref, record); } catch (_) {} }'''
          new='''    await persistBackgroundRecord(ref, record, store, event, body);'''
          if old in s:
              s=s.replace(old,new,1)

          old='''    let persistenceWarning = null;\n    if (store) {\n      try {\n        await store.setJSON(ref, record);\n      } catch (saveError) {\n        console.error("generate-estimate v5.1 save warning:", saveError && saveError.stack ? saveError.stack : saveError);\n        persistenceWarning = "The AI draft was generated, but the function could not automatically save it to storage. Review the draft and use the dashboard Save action.";\n      }\n    } else {\n      persistenceWarning = "The AI draft was generated through the storage fallback. Review the draft and use the dashboard Save action.";\n    }'''
          new='''    let persistenceWarning = null;\n    try {\n      await persistBackgroundRecord(ref, record, store, event, body);\n    } catch (saveError) {\n      console.error("generate-estimate save warning:", saveError && saveError.stack ? saveError.stack : saveError);\n      persistenceWarning = "The AI draft was generated, but automatic persistence failed. Review the Netlify log before retrying.";\n    }'''
          if old in s:
              s=s.replace(old,new,1)

          old='''        if (s2 && s2.store && s2.record) {\n          s2.record.aiStatus = "error";\n          s2.record.aiJobId = String(safeJsonParse(event.body, {}).jobId || s2.record.aiJobId || "").trim();\n          s2.record.aiError = String((err && err.message) || err).slice(0, 300);\n          await s2.store.setJSON(failRef, s2.record);\n        }'''
          new='''        if (s2 && s2.record) {\n          s2.record.aiStatus = "error";\n          s2.record.aiJobId = String(safeJsonParse(event.body, {}).jobId || s2.record.aiJobId || "").trim();\n          s2.record.aiError = String((err && err.message) || err).slice(0, 300);\n          s2.record.aiFinishedAt = new Date().toISOString();\n          await persistBackgroundRecord(failRef, s2.record, s2.store, event, safeJsonParse(event.body, {}));\n        }'''
          if old in s:
              s=s.replace(old,new,1)

          if 'async function persistBackgroundRecord(' not in s:
              marker='''async function loadEstimateRecord(ref, event, body) {'''
              helper=r'''async function persistBackgroundRecord(ref, record, store, event, body) {
  if (store) {
    try {
      await store.setJSON(ref, record);
      return;
    } catch (error) {
      console.error("Direct Blob write failed; trying save-estimate fallback:", error && error.stack ? error.stack : error);
    }
  }
  await postSaveEstimateFallback(ref, record, event, body);
}

function postSaveEstimateFallback(ref, record, event, body) {
  const host = cleanText((event.headers || {}).host || process.env.URL || "www.sanibuildingcorp.com")
    .replace(/^https?:\/\//i, "")
    .replace(/\/$/, "");
  const payload = JSON.stringify({
    ref,
    estimate: record.estimate,
    status: record.status,
    projectAnalysis: record.projectAnalysis,
    aiStatus: record.aiStatus,
    aiJobId: record.aiJobId,
    aiError: record.aiError,
    aiStartedAt: record.aiStartedAt,
    aiFinishedAt: record.aiFinishedAt,
  });
  return new Promise((resolve, reject) => {
    const req = https.request({ hostname: host, port: 443, path: "/.netlify/functions/save-estimate", method: "POST", headers: { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(payload) } }, (res) => {
      const chunks=[];
      res.on("data", c => chunks.push(c));
      res.on("end", () => {
        const text=Buffer.concat(chunks).toString("utf8");
        if (res.statusCode < 200 || res.statusCode >= 300) return reject(new Error(`save-estimate fallback HTTP ${res.statusCode}: ${text.slice(0,250)}`));
        resolve();
      });
    });
    req.setTimeout(20000, () => req.destroy(new Error("save-estimate fallback timed out")));
    req.on("error", reject);
    req.write(payload);
    req.end();
  });
}

'''
              if marker not in s: raise SystemExit('helper marker missing')
              s=s.replace(marker,helper+marker,1)

          p.write_text(s)
          PY
      - name: Verify
        run: |
          node --check netlify/functions/generate-estimate-background.js
          grep -q 'persistBackgroundRecord' netlify/functions/generate-estimate-background.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'sani-estimator-bot'
          git config user.email 'sanibuildingcorp@gmail.com'
          git add netlify/functions/generate-estimate-background.js
          git commit -m 'Persist background AI results through save fallback'
          git push
