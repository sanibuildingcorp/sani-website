name: Deploy Claude Estimator Timeout Fix

on:
  push:
    paths:
      - '.estimator-hotfix-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply Claude dashboard and estimator timeout changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Claude file 1: dashboard.html
          p = Path('dashboard.html')
          s = p.read_text()
          old = '''    // Poll every 3s for up to 3 minutes.\n    let data = null;\n    for (let i = 0; i < 60; i++) {'''
          new = '''    /* Poll every 3s for up to 8 minutes. The estimator makes up to three AI calls\n       (project analysis, pricing, optional repair) and a long written scope like a\n       multi-trade apartment can legitimately take several minutes. The background\n       function itself is allowed 15 minutes, so the browser must not give up first. */\n    let data = null;\n    for (let i = 0; i < 160; i++) {'''
          assert old in s, 'dashboard 3-minute polling block not found'
          s = s.replace(old, new, 1)
          old2 = '    if (!data) throw new Error("Timed out after 3 minutes — check Netlify function logs");'
          new2 = '    if (!data) throw new Error("Timed out after 8 minutes — check Netlify → Logs → Functions → generate-estimate-background");'
          assert old2 in s, 'dashboard 3-minute timeout message not found'
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          # Claude file 2: generate-estimate-background.js
          p = Path('netlify/functions/generate-estimate-background.js')
          s = p.read_text()
          old = '        timeout: 90000,'
          new = '''        // Background functions get 15 minutes. These limits were sized for a\n        // synchronous 10s function and were killing long estimates at ~110s.\n        timeout: 240000,'''
          assert old in s, 'OpenAI 90s timeout not found'
          s = s.replace(old, new, 1)
          old2 = '    req.setTimeout(110000, () => req.destroy(new Error("Claude request timed out")));'
          new2 = '    req.setTimeout(240000, () => req.destroy(new Error("Claude request timed out after 4 minutes")));'
          assert old2 in s, 'Claude 110s timeout not found'
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY

      - name: Syntax check estimator
        run: node --check netlify/functions/generate-estimate-background.js

      - name: Commit Claude files
        run: |
          git config user.name "sani-claude-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html netlify/functions/generate-estimate-background.js
          git commit -m "Deploy Claude estimator timeout and polling fix" || exit 0
          git push origin main
