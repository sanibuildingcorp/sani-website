name: Scope Intelligence V1.6
on:
  push:
    paths:
      - 'ops/run-scope-intelligence-v16.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch customer presentation only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/lib/deterministic-pricing.js')
          s=p.read_text()
          anchor="function supplySection(x,analysis){return x&&typeof x==='object'?canonicalService(x.section,x.item||x.label||x.description,analysis?.selected_trades||[]):''}\n"
          if anchor not in s:
              raise SystemExit('anchor not found')
          helper=r'''function proposalLine(service,item,bucket,input){const s=norm(item),count=parseWindowCount(input||{},{});if(bucket==='materials'){if(service==='Windows'&&/replacement window|vinyl.*window|window.*unit/.test(s))return `Supply ${count} replacement windows for selected Option A.`;return ''}
 if(service==='Bathroom'){if(/protection|setup|access path/.test(s))return 'Protect the bathroom work area and maintain the apartment access path.';if(/demolition|remove existing|debris bag|debris disposal/.test(s))return 'Remove existing bathroom finish materials as required; bag, carry out and dispose of demolition debris.';if(/shower pan|drain inspection|inspect.*drain/.test(s))return 'Inspect the existing shower pan and drain and verify condition before new finishes; the existing pan remains unless separately authorized.';if(/substrate|backer|cement board/.test(s))return 'Prepare wall substrates and install cement backer board where required.';if(/waterproof/.test(s))return 'Install waterproofing membrane at shower wet-area assemblies.';if(/tile.*wall|wall tile|24\s*[x×]\s*48/.test(s))return 'Install 24×48 wall tile with aligned grout lines.';if(/tile.*floor|floor tile/.test(s))return 'Install bathroom floor tile.';if(/grout|caulk|seal/.test(s))return 'Grout, caulk and seal completed tile work.';if(/plumb.*disconnect|disconnect.*plumb/.test(s))return 'Disconnect and cap existing bathroom plumbing as required for renovation.';if(/glass|shower enclosure|template/.test(s))return 'Template and install the frameless tempered-glass shower enclosure with standard hardware.';if(/plumb|vanity|toilet|faucet|shower trim|fixture install/.test(s))return 'Install and connect customer-supplied vanity, sink, toilet, shower valve/trim and faucet using standard connection materials.';if(/cleanup|touch.?up/.test(s))return 'Complete final bathroom cleanup and protection.'}
 if(service==='Flooring'){if(/protection/.test(s))return 'Protect adjacent finished surfaces during flooring work.';if(/delivery|receiv/.test(s))return 'Receive and inspect customer-supplied engineered hardwood flooring.';if(/subfloor|inspect|prep existing|floor preparation/.test(s))return 'Inspect and prepare the existing floor for installation; no underlayment is included.';if(/engineered hardwood|hardwood install|flooring install/.test(s))return 'Install customer-supplied engineered hardwood flooring.';if(/quarter.?round/.test(s))return 'Cut, fit and install 1/4-round trim where required.';if(/cleanup|vacuum/.test(s))return 'Complete final flooring cleanup and protection.'}
 if(service==='Painting'){if(/protection|masking/.test(s))return 'Protect floors, fixtures and adjacent finished surfaces before painting.';if(/surface prep|patch|sand/.test(s))return 'Patch and sand minor surface defects as required for painting.';if(/primer|prime/.test(s))return 'Spot-prime prepared areas as required.';if(/trim|door painting/.test(s))return 'Paint included trim and doors.';if(/bathroom painting/.test(s))return 'Paint bathroom walls and ceiling outside tiled shower areas.';if(/paint|finish coat|customer-supplied/.test(s))return 'Apply customer-supplied Sherwin-Williams finish paint to included walls and ceilings.';if(/cleanup|touch.?up/.test(s))return 'Complete final paint touch-ups and cleanup.'}
 if(service==='Windows'){if(/removal|remove existing|disposal|debris/.test(s))return 'Remove existing windows and dispose of associated debris.';if(/opening prep|prepare opening/.test(s))return 'Prepare existing window openings for replacement installation.';if(/new window installation|window installation|install.*window/.test(s))return 'Install replacement windows for selected Option A.';if(/trim|casing|seal|caulk/.test(s))return 'Complete interior/exterior trim, caulking and sealant at replacement windows.';if(/testing|operation|adjust/.test(s))return 'Test window operation and complete final adjustments.'}
 return text(item)}
function proposalSupply(service,x){const s=norm(x);if(service==='Bathroom'){if(/vanity.*sink|sink.*vanity/.test(s))return 'Vanity and sink';if(/sink faucet/.test(s))return 'Sink faucet';if(/toilet/.test(s))return 'Toilet';if(/rough.?in.*valve|delta.*valve/.test(s))return 'Delta shower rough-in valve';if(/shower trim|shower head/.test(s))return 'Shower trim and shower head'}if(service==='Flooring'&&/hardwood|flooring/.test(s))return 'Engineered hardwood flooring';if(service==='Painting'&&/paint|sherwin/.test(s))return 'Sherwin-Williams finish paint';return text(x)}
function proposalExclusion(service,x,input){const s=norm(x),req=norm(input?.request?.description);if(service==='Bathroom'){if(/shower pan|shower base/.test(s)&&/shower pan[\s\S]{0,80}(?:remains|do not replace|no relocation)/.test(req))return 'Replacement of the existing shower pan/base is not included; the existing pan remains subject to inspection.';if(/relocation.*plumb|plumb.*relocation/.test(s))return 'Relocation of plumbing fixtures or major plumbing rerouting is not included.';if(/electrical/.test(s))return 'Electrical upgrades or new circuits are not included unless specifically added.'}if(service==='Flooring'){if(/underlayment/.test(s))return 'Underlayment is not included per the customer request.';if(/transition/.test(s))return 'Transition strips are not included per the customer request.';if(/baseboard/.test(s))return 'Baseboard replacement is not included unless specifically added.'}if(service==='Painting'&&/kitchen/.test(s))return 'Kitchen painting is excluded.';if(service==='Windows'&&/window treatment/.test(s))return 'Window treatments are not included.';return text(x)}
'''
          if 'function proposalLine(' not in s:
              s=s.replace(anchor,anchor+helper)
          old_labor=" (out.labor||[]).forEach(l=>{const s=canonicalService(l.section,l.item,analysis?.selected_trades||[]),cost=num(l.qty)*num(l.rate);if(map[s]){map[s].subtotal+=cost;map[s].included.push(text(l.item))}else{generalBase+=cost;if(text(l.item))globalIncluded.push(text(l.item))}});\n (out.materials||[]).forEach(m=>{const s=canonicalService(m.section,m.item,analysis?.selected_trades||[]),cost=num(m.qty)*num(m.rate);if(map[s]){map[s].subtotal+=cost;map[s].included.push(text(m.item))}else{generalBase+=cost;if(text(m.item))globalIncluded.push(text(m.item))}});"
          new_labor=" (out.labor||[]).forEach(l=>{const s=canonicalService(l.section,l.item,analysis?.selected_trades||[]),cost=num(l.qty)*num(l.rate);if(map[s]){map[s].subtotal+=cost;const line=proposalLine(s,l.item,'labor',input);if(line)map[s].included.push(line)}else{generalBase+=cost}});\n (out.materials||[]).forEach(m=>{const s=canonicalService(m.section,m.item,analysis?.selected_trades||[]),cost=num(m.qty)*num(m.rate);if(map[s]){map[s].subtotal+=cost;const line=proposalLine(s,m.item,'materials',input);if(line)map[s].included.push(line)}else{generalBase+=cost}});"
          if old_labor not in s:
              raise SystemExit('labor/material presentation block not found')
          s=s.replace(old_labor,new_labor)
          old_supply="if(map[s])map[s].customerSupplies.push(t)"
          s=s.replace(old_supply,"if(map[s])map[s].customerSupplies.push(proposalSupply(s,t))")
          old_exc="if(map[owner])map[owner].notIncluded.push(t);else projectExclusions.push(t)"
          s=s.replace(old_exc,"if(map[owner])map[owner].notIncluded.push(proposalExclusion(owner,t,input));else projectExclusions.push(t)")
          old_opt="if(s==='Windows'){map[s].notIncluded.push(`${opt.label}${opt.price?` — $${opt.price.toFixed(2)}`:''} alternative (not included in current total)`)}}"
          new_opt="if(s==='Windows'){map[s].notIncluded.push(`ALTERNATE — ${opt.label}${opt.price?` — $${opt.price.toFixed(2)}`:''}. ${opt.description||'Not included in the current total.'}`)}}"
          if old_opt not in s:
              raise SystemExit('window option presentation block not found')
          s=s.replace(old_opt,new_opt)
          s=s.replace("out.customerPresentationVersion='v8.2-deterministic-four-service-v1.5'","out.customerPresentationVersion='v8.2-deterministic-four-service-v1.6'")
          p.write_text(s)
          PY
          node --check netlify/functions/lib/deterministic-pricing.js
          rm -f ops/run-scope-intelligence-v16.txt .github/workflows/scope-intelligence-v16.yml
          git config user.name 'sani-estimator-bot'
          git config user.email 'sanibuildingcorp@gmail.com'
          git add -A
          git commit -m 'Improve customer scope wording and alternate classification'
          git push origin main
