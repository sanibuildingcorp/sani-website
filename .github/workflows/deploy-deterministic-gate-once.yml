name: Deploy deterministic pricing gate once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-deterministic-gate-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch production estimator and validate syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/generate-estimate-background.js')
          s=p.read_text()
          req='const { applyDeterministicPricing } = require("./lib/deterministic-pricing");'
          if req not in s:
              a='const { getStore } = require("@netlify/blobs");'; assert a in s; s=s.replace(a,a+'\n'+req,1)
          hook='''    // DETERMINISTIC PRICING GATE: AI interprets scope; Sani rules control production hours,\n    // mutually-exclusive alternatives, service ownership, and estimate health.\n    estimate = applyDeterministicPricing(estimate, projectAnalysis, input);\n    validation = validateEstimate(estimate, projectAnalysis, input);\n\n'''
          a2='    estimate = finalizeCustomerPresentation(estimate, projectAnalysis, input);'
          if hook not in s:
              assert a2 in s; s=s.replace(a2,hook+a2,1)
          p.write_text(s)
          PY
          node --check netlify/functions/generate-estimate-background.js
          node --check netlify/functions/lib/deterministic-pricing.js
      - name: Commit production estimator integration
        run: |
          git config user.name "sani-estimator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/generate-estimate-background.js
          git diff --cached --quiet && exit 0
          git commit -m "Enable deterministic estimator pricing gate"
          git push origin HEAD:main
