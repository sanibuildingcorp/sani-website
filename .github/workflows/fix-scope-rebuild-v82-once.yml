name: Fix deterministic scope rebuild v82 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-scope-rebuild-v82-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch dashboard scope builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text()
          subtotal_anchor='''function scopeServiceSubtotal(name) {\n  var est = (currentRecord && currentRecord.estimate) || {};\n'''
          subtotal_new='''function scopeServiceSubtotal(name) {\n  var est = (currentRecord && currentRecord.estimate) || {};\n  // Deterministic v8.2 already calculated customer-service subtotals after\n  // allocating General/project costs. Use those exact numbers in Scope Control\n  // instead of re-grouping raw labor/material rows back into pseudo-services.\n  if (/^v8\\.2-deterministic-four-service/.test(String(est.customerPresentationVersion || "")) && Array.isArray(est.serviceBreakdown)) {\n    var sb = est.serviceBreakdown.find(function (x) {\n      return String((x && (x.title || x.name || x.section)) || "").trim().toLowerCase() === String(name || "").trim().toLowerCase();\n    });\n    if (sb && Number.isFinite(Number(sb.subtotal))) return Number(sb.subtotal);\n  }\n'''
          assert subtotal_anchor in s, 'scopeServiceSubtotal anchor not found'
          s=s.replace(subtotal_anchor, subtotal_new, 1)

          seed_anchor='''  function bText(x) { return (x && (x.item || x.text || x.label)) || x; }\n  var breakdown = [];\n'''
          seed_new='''  function bText(x) { return (x && (x.item || x.text || x.label)) || x; }\n\n  // V8.2 deterministic presentation is already the contractor-facing truth:\n  // exactly Bathroom / Flooring / Painting / Windows, with General allocated,\n  // alternatives isolated and duplicates cleaned. Do NOT merge raw labor,\n  // scopeSections, project exclusions or legacy arrays back into this draft,\n  // because doing so recreates General/Carpentry pseudo-services and duplicates.\n  if (/^v8\\.2-deterministic-four-service/.test(String(est.customerPresentationVersion || "")) && Array.isArray(est.serviceBreakdown)) {\n    var order = ["Bathroom", "Flooring", "Painting", "Windows"];\n    var direct = {};\n    est.serviceBreakdown.forEach(function (b) {\n      if (!b) return;\n      var name = String(b.title || b.section || b.service || b.name || "").trim();\n      if (order.indexOf(name) === -1) return;\n      var t = { name: name, included: [], supplied: [], excluded: [] };\n      (b.included || b.items || b.scope || []).forEach(function (x) { push(t.included, bText(x)); });\n      (b.customerSupplies || b.customerSupplied || b.supplied || []).forEach(function (x) { push(t.supplied, bText(x)); });\n      (b.notIncluded || b.exclusions || b.excluded || []).forEach(function (x) { push(t.excluded, bText(x)); });\n      direct[name] = t;\n    });\n    return { services: order.filter(function (name) { return direct[name]; }).map(function (name) { return direct[name]; }) };\n  }\n\n  var breakdown = [];\n'''
          assert seed_anchor in s, 'buildScopeDraftFromAI seed anchor not found'
          s=s.replace(seed_anchor, seed_new, 1)
          p.write_text(s)
          PY
          grep -q 'V8.2 deterministic presentation is already' dashboard.html
          grep -q 'Deterministic v8.2 already calculated customer-service subtotals' dashboard.html
      - name: Commit and clean one-time files
        run: |
          git config user.name "sani-estimator-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f tmp-scope-builder-snippet.txt .github/workflows/inspect-scope-builder-once.yml .github/workflows/fix-scope-rebuild-v82-once.yml
          git add -A
          git commit -m "Make Scope Control rebuild use deterministic four-service presentation"
          git push origin HEAD:main