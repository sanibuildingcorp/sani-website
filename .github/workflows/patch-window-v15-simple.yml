# second push intentionally triggers this one-time workflow
name: Patch Windows Option Engine V1.5 Simple
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-window-v15-simple.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch deterministic window engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/lib/deterministic-pricing.js')
          s=p.read_text()
          old="""function ensureWindowOptionEngine(estimate,analysis,input,adj){if(!windowRequested(input,analysis))return;estimate.options=Array.isArray(estimate.options)?estimate.options:[];const mm=1+num(estimate.markupPct||RULES.markupDefault)/100;const hasBase=[...(estimate.labor||[]),...(estimate.materials||[])].some(isWindowLine);const optionA=estimate.options.find(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='A');if(!hasBase&&optionA&&num(optionA.price)>0){const preMarkup=money(num(optionA.price)/mm);estimate.materials.push({section:'Windows',item:`${text(optionA.label)||'Window Option A'} — selected base allowance`,qty:1,unit:'allowance',rate:preMarkup});estimate.options=estimate.options.filter(o=>o!==optionA);adj.push({type:'BASE_OPTION_PROMOTED',service:'Windows',option:'A',customerPrice:money(optionA.price),baseCost:preMarkup,reason:'Customer requested both window options and Option A was returned only as a priced option; promoted Option A into the base estimate.'})}else if(hasBase&&optionA){estimate.options=estimate.options.filter(o=>o!==optionA);adj.push({type:'DUPLICATE_BASE_OPTION_REMOVED',service:'Windows',option:'A',reason:'Option A already has base labor/material lines.'})}const remainingBase=[...(estimate.labor||[]),...(estimate.materials||[])].some(isWindowLine);estimate.optionSelections=estimate.optionSelections||{};estimate.optionSelections.Windows={selected:'Option A',baseIncluded:remainingBase,alternatives:(estimate.options||[]).filter(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows').map(o=>({label:o.label,description:o.description,price:money(o.price)}))}}"""
          new="""function parseWindowCount(input,analysis){const raw=[input?.request?.description,input?.request?.contractorNotes,input?.request?.extraNotes,JSON.stringify(analysis?.confirmed_scope||[])].filter(Boolean).join(' | ');let total=0,m;const re=/(\\d+(?:\\.\\d+)?)\\s*[\"”]?\\s*[x×]\\s*(\\d+(?:\\.\\d+)?)\\s*[\"”]?[^|\\n]{0,45}?(?:quantity|qty)\\s*[:#-]?\\s*(\\d+)/gi;while((m=re.exec(raw)))total+=Number(m[3])||0;return total||8}
function ensureWindowOptionEngine(estimate,analysis,input,adj){if(!windowRequested(input,analysis))return;estimate.options=Array.isArray(estimate.options)?estimate.options:[];const mm=1+num(estimate.markupPct||RULES.markupDefault)/100;let hasBase=[...(estimate.labor||[]),...(estimate.materials||[])].some(isWindowLine);const optionA=estimate.options.find(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='A');if(!hasBase&&optionA&&num(optionA.price)>0){const preMarkup=money(num(optionA.price)/mm);estimate.materials.push({section:'Windows',item:`${text(optionA.label)||'Window Option A'} — selected base allowance`,qty:1,unit:'allowance',rate:preMarkup});estimate.options=estimate.options.filter(o=>o!==optionA);hasBase=true;adj.push({type:'BASE_OPTION_PROMOTED',service:'Windows',option:'A',customerPrice:money(optionA.price)})}if(!hasBase){const count=parseWindowCount(input,analysis),laborRate=95,hours=Math.max(12,Math.ceil(count*3.5));estimate.labor.push({section:'Windows',item:`Window Option A — remove, prepare openings and install ${count} specified aluminum replacement windows`,qty:hours,unit:'hrs',rate:laborRate});estimate.materials.push({section:'Windows',item:`Window Option A — ${count} specified aluminum replacement windows allowance`,qty:count,unit:'ea',rate:900});hasBase=true;adj.push({type:'WINDOW_BASE_SYNTHESIZED',service:'Windows',option:'A',windowCount:count,laborHours:hours,unitMaterialAllowance:900})}estimate.options=estimate.options.filter(o=>!(canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='A'));if(!estimate.options.some(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='B')){const count=parseWindowCount(input,analysis),premium=2,adjust=Math.max(0,count-premium),raw=(premium*4+adjust*1.5)*95+premium*1250+adjust*100;estimate.options.push({section:'Windows',label:'Option B — Replace 2 premium acoustic windows + adjust remaining existing windows',description:'Alternative requested by customer; excluded from base Grand Total until selected.',price:money(raw*mm)});adj.push({type:'WINDOW_ALTERNATIVE_SYNTHESIZED',service:'Windows',option:'B',customerPrice:money(raw*mm)})}estimate.optionSelections=estimate.optionSelections||{};estimate.optionSelections.Windows={selected:'Option A',baseIncluded:true,alternatives:estimate.options.filter(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows').map(o=>({label:o.label,description:o.description,price:money(o.price)}))}}"""
          assert old in s, 'old Windows engine not found'
          s=s.replace(old,new,1)
          s=s.replace('deterministic estimator guardrails v1.4','deterministic estimator guardrails v1.5',1)
          s=s.replace("version:'deterministic-v1.4'","version:'deterministic-v1.5'")
          s=s.replace("version:'v1.4'","version:'v1.5'")
          p.write_text(s)
          PY
          node --check netlify/functions/lib/deterministic-pricing.js
          grep -q 'WINDOW_BASE_SYNTHESIZED' netlify/functions/lib/deterministic-pricing.js
          grep -q 'guardrails v1.5' netlify/functions/lib/deterministic-pricing.js
      - name: Regression test
        run: |
          node <<'NODE'
          const {applyDeterministicPricing,consolidateCustomerPresentation}=require('./netlify/functions/lib/deterministic-pricing');
          const input={request:{description:'WINDOW REPLACEMENT price BOTH options. OPTION A replace all windows: 34 x 68.5 quantity 3; 30.5 x 68.5 quantity 2; 28.5 x 68.5 quantity 2; 18.75 x 42.75 quantity 1. OPTION B replace two master bedroom windows with acoustic windows and adjust remaining windows.'}};
          const a={selected_trades:['Windows'],confirmed_scope:[{trade:'Windows'}]};
          let e={labor:[],materials:[],options:[],customerSupplied:[],exclusions:[],markupPct:25};
          e=applyDeterministicPricing(e,a,input);e=consolidateCustomerPresentation(e,a,input);
          const w=(e.serviceBreakdown||[]).find(x=>x.title==='Windows');
          if(!w||!(w.subtotal>0))throw new Error('Windows subtotal is zero');
          if(!(e.options||[]).some(o=>/Option B/i.test(o.label)))throw new Error('Option B missing');
          if(e.estimateHealth?.status==='BLOCKED')throw new Error('Health still blocked');
          console.log('PASS',w.subtotal,e.options.map(o=>o.label));
          NODE
      - name: Commit patch
        run: |
          git config user.name "sani-estimator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/lib/deterministic-pricing.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Windows Option A/B deterministic pricing v1.5"
          git push origin HEAD:main