name: Pricing guardrail tests

on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/lib/nyc-market-benchmark.js'
      - 'netlify/functions/lib/nyc-market-benchmark.test.js'
      - '.github/workflows/pricing-guardrail-tests.yml'
  pull_request:
    paths:
      - 'netlify/functions/lib/nyc-market-benchmark.js'
      - 'netlify/functions/lib/nyc-market-benchmark.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check benchmark module
        run: node --check netlify/functions/lib/nyc-market-benchmark.js
      - name: Run benchmark regression tests
        run: node netlify/functions/lib/nyc-market-benchmark.test.js
      - name: Verify no pricing mutation contract
        run: |
          grep -q "pricingChanged:false" netlify/functions/lib/nyc-market-benchmark.js
          grep -q "customerVisible:false" netlify/functions/lib/nyc-market-benchmark.js
          echo "Internal-only non-mutating pricing audit contract verified"
