name: Fix AI generation job race
on:
  push:
    paths:
      - '.github/workflows/fix-ai-job-race.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch job identity handshake
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---- dashboard.html ----
          p=Path('dashboard.html')
          s=p.read_text()
          original=s

          old='''    const ref = currentRecord.ref;\n    const payload = JSON.stringify({\n      ref: ref,\n      usePhotoAnalysis: aiChk("use-photo-analysis"),'''
          new='''    const ref = currentRecord.ref;\n    // Unique identity for this generation run. Prevents a stale previous aiStatus=done\n    // record from being accepted before the new background job stamps running.\n    const jobId = "ai-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);\n    const payload = JSON.stringify({\n      ref: ref,\n      jobId: jobId,\n      usePhotoAnalysis: aiChk("use-photo-analysis"),'''
          if old not in s:
              raise SystemExit('dashboard payload anchor not found')
          s=s.replace(old,new,1)

          old='''      const st = rec && rec.aiStatus;\n      if (st === "error") throw new Error(rec.aiError || "The estimator reported an error");\n      if (st === "done" && rec.estimate && (rec.estimate.labor || []).length) {'''
          new='''      // Only accept state written by THIS generation click. A previous run may still\n      // be marked done for a few seconds before the background function starts.\n      if (!rec || rec.aiJobId !== jobId) continue;\n      const st = rec.aiStatus;\n      if (st === "error") throw new Error(rec.aiError || "The estimator reported an error");\n      if (st === "done" && rec.estimate && (rec.estimate.labor || []).length) {'''
          if old not in s:
              raise SystemExit('dashboard poll anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # ---- generate-estimate-background.js ----
          p=Path('netlify/functions/generate-estimate-background.js')
          s=p.read_text()

          old='''    record.aiStatus = "running";\n    record.aiError = "";\n    record.aiStartedAt = new Date().toISOString();'''
          new='''    record.aiStatus = "running";\n    record.aiJobId = String(body.jobId || "").trim();\n    record.aiError = "";\n    record.aiStartedAt = new Date().toISOString();'''
          if old not in s:
              raise SystemExit('background running anchor not found')
          s=s.replace(old,new,1)

          old='''    record.aiStatus = "done";\n    record.aiError = "";\n    record.aiFinishedAt = new Date().toISOString();'''
          new='''    record.aiStatus = "done";\n    record.aiJobId = String(body.jobId || record.aiJobId || "").trim();\n    record.aiError = "";\n    record.aiFinishedAt = new Date().toISOString();'''
          if old not in s:
              raise SystemExit('background done anchor not found')
          s=s.replace(old,new,1)

          old='''          s2.record.aiStatus = "error";\n          s2.record.aiError = String((err && err.message) || err).slice(0, 300);'''
          new='''          s2.record.aiStatus = "error";\n          s2.record.aiJobId = String(safeJsonParse(event.body, {}).jobId || s2.record.aiJobId || "").trim();\n          s2.record.aiError = String((err && err.message) || err).slice(0, 300);'''
          if old not in s:
              raise SystemExit('background error anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q 'jobId: jobId' dashboard.html
          grep -q 'rec.aiJobId !== jobId' dashboard.html
          grep -q 'record.aiJobId = String(body.jobId' netlify/functions/generate-estimate-background.js
          node --check netlify/functions/generate-estimate-background.js
      - name: Commit patch
        run: |
          git config user.name 'sani-estimator-bot'
          git config user.email 'sanibuildingcorp@gmail.com'
          git add dashboard.html netlify/functions/generate-estimate-background.js
          git commit -m 'Fix stale AI generation result race with job identity'
          git push
