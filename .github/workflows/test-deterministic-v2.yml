name: Test deterministic estimator v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-deterministic-v2.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deterministic-estimator-v2
          fetch-depth: 0
      - name: Run John benchmark
        run: |
          node --check netlify/functions/generate-estimate-background.js
          node --check netlify/functions/lib/deterministic-pricing.js
          node <<'NODE' > DETERMINISTIC_TEST_RESULTS.md
          const {applyDeterministicPricing,calculateTotals}=require('./netlify/functions/lib/deterministic-pricing');
          const input={request:{description:`Apartment renovation. Engineered hardwood flooring approximately 640 square feet. Interior painting approximately 2,600 SF of paintable surface. Bathroom wall and floor tile total approximately 87 SF, 24 x 48 porcelain. Window replacement Option A replace all windows; Option B partial replacement.`,sqft:'800',groupedAnswers:{}}};
          const analysis={selected_trades:['Bathroom','Flooring','Painting','Windows'],quantities:{},confirmed_scope:[]};
          const estimate={markupPct:25,labor:[
            {item:'Painter - walls ceilings trim doors',qty:32,unit:'hrs',rate:65,section:'Painting'},
            {item:'Flooring installer - engineered hardwood',qty:20,unit:'hrs',rate:65,section:'Flooring'},
            {item:'Tile setter - 24x48 wall and floor tile',qty:16,unit:'hrs',rate:75,section:'Bathroom'},
            {item:'Window installer Option A - replace all windows',qty:20,unit:'hrs',rate:70,section:'Windows'},
            {item:'Window installer Option B - partial replacement',qty:12,unit:'hrs',rate:70,section:'Windows'},
            {item:'Bathroom demolition and prep',qty:16,unit:'hrs',rate:65,section:'Flooring'}
          ],materials:[
            {item:'Window materials Option A',qty:1,unit:'allowance',rate:4000,section:'Windows'},
            {item:'Window materials Option B',qty:1,unit:'allowance',rate:2200,section:'Windows'}
          ],options:[]};
          const out=applyDeterministicPricing(estimate,analysis,input);
          const hours=k=>out.labor.filter(x=>new RegExp(k,'i').test(x.item)).reduce((s,x)=>s+x.qty,0);
          const paint=hours('Painter'), floor=hours('Flooring installer'), tile=hours('Tile setter');
          const hasB=out.labor.concat(out.materials).some(x=>/Option B/i.test(x.item));
          const demo=out.labor.find(x=>/Bathroom demolition/i.test(x.item));
          if(paint<87) throw new Error('painting guardrail failed '+paint);
          if(floor<46) throw new Error('flooring guardrail failed '+floor);
          if(tile<22) throw new Error('tile guardrail failed '+tile);
          if(hasB) throw new Error('Option B still in base total');
          if(!demo || demo.section!=='Bathroom') throw new Error('bathroom ownership failed');
          const totals=calculateTotals(out);
          console.log('# Deterministic Estimator V2 — John Benchmark PASS');
          console.log('');
          console.log(`- Painting hours: ${paint}`);
          console.log(`- Flooring hours: ${floor}`);
          console.log(`- Large-format tile hours: ${tile}`);
          console.log(`- Option B excluded from base: ${!hasB}`);
          console.log(`- Bathroom demolition owner: ${demo.section}`);
          console.log(`- Health: ${out.estimateHealth.status}`);
          console.log(`- Base total in synthetic test: $${totals.grandTotal.toFixed(2)}`);
          console.log(`- Adjustments applied: ${out.deterministicPricing.adjustments.length}`);
          NODE
      - name: Commit test proof to isolated branch
        run: |
          git config user.name "sani-estimator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add DETERMINISTIC_TEST_RESULTS.md
          git commit -m "Record deterministic John benchmark results"
          git push origin HEAD:deterministic-estimator-v2
