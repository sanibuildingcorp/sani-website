name: Patch deterministic customer presentation once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-deterministic-presentation-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch estimator and run presentation regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/generate-estimate-background.js')
          s=p.read_text()
          old='const { applyDeterministicPricing } = require("./lib/deterministic-pricing");'
          new='const { applyDeterministicPricing, consolidateCustomerPresentation } = require("./lib/deterministic-pricing");'
          assert old in s or new in s, 'deterministic import not found'
          s=s.replace(old,new,1)
          anchor='    estimate = finalizeCustomerPresentation(estimate, projectAnalysis, input);'
          hook=anchor+'\n    estimate = consolidateCustomerPresentation(estimate, projectAnalysis, input);'
          if hook not in s:
              assert anchor in s, 'finalize presentation anchor missing'
              s=s.replace(anchor,hook,1)
          p.write_text(s)
          PY
          node --check netlify/functions/generate-estimate-background.js
          node --check netlify/functions/lib/deterministic-pricing.js
          node <<'NODE'
          const d=require('./netlify/functions/lib/deterministic-pricing');
          const analysis={selected_trades:['Bathroom','Flooring','Painting','Windows']};
          let e={markupPct:25,labor:[
            {section:'Bathroom',item:'Bathroom demolition',qty:10,rate:70},
            {section:'Plumbing',item:'Install shower valve and vanity',qty:6,rate:100},
            {section:'Glazing',item:'Install frameless shower glass',qty:4,rate:100},
            {section:'Flooring',item:'Install engineered hardwood flooring',qty:46,rate:65},
            {section:'Painting',item:'Paint walls ceilings trim doors',qty:87,rate:65},
            {section:'General',item:'Project coordination and scheduling',qty:10,rate:100},
            {section:'Windows',item:'Window replacement Option A',qty:20,rate:70},
            {section:'Windows',item:'Window replacement Option B',qty:12,rate:70}],
            materials:[{section:'Windows',item:'Window materials Option A',qty:1,rate:4000},{section:'Windows',item:'Window materials Option B',qty:1,rate:2200}],
            customerSupplied:[{section:'Bathroom',item:'Vanity and sink'},{section:'Bathroom',item:'Sink / Vanity'},{section:'Painting',item:'Paint - Sherwin Williams'}],
            exclusions:['Relocation of plumbing fixtures','Kitchen painting excluded','Underlayment for flooring','Exterior scaffolding for windows'],options:[]};
          e=d.applyDeterministicPricing(e,analysis,{request:{description:'Painting 2600 SF. Engineered hardwood flooring 640 SF. Bathroom 87 SF 24x48 tile. Windows option A and option B.',groupedAnswers:{}}});
          e=d.consolidateCustomerPresentation(e,analysis,{});
          const names=e.serviceBreakdown.map(x=>x.title);
          if(JSON.stringify(names)!==JSON.stringify(['Bathroom','Flooring','Painting','Windows'])) throw new Error('bad service list '+JSON.stringify(names));
          if(e.serviceBreakdown.some(x=>/Plumbing|Glazing|General|Tile/.test(x.title))) throw new Error('pseudo-service survived');
          if(e.serviceBreakdown.find(x=>x.title==='Windows').included.some(x=>/Option B/i.test(x))) throw new Error('Option B included in base scope');
          const bath=e.serviceBreakdown.find(x=>x.title==='Bathroom');
          if(!bath.included.some(x=>/shower valve/i.test(x))||!bath.included.some(x=>/glass/i.test(x))) throw new Error('bathroom merge failed');
          if(bath.customerSupplies.length!==1) throw new Error('bathroom customer supply dedupe failed '+bath.customerSupplies.length);
          const svcTotal=e.serviceBreakdown.reduce((s,x)=>s+x.subtotal,0), grand=d.calculateTotals(e).grandTotal;
          if(Math.abs(svcTotal-grand)>.05) throw new Error(`service totals ${svcTotal} do not reconcile ${grand}`);
          console.log('Presentation regression PASS',names,svcTotal,grand);
          NODE
      - name: Commit estimator patch
        run: |
          git config user.name "sani-estimator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/generate-estimate-background.js
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate customer scope into requested services"
          git push origin HEAD:main
