name: Inspect scope builder once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-scope-builder-once.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scope builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('dashboard.html').read_text()
          keys=['buildScopeDraftFromAI','scopeDraftFromAI','Rebuild Draft from AI','rebuildScope','manualCustomerScopeDraft']
          hits=[]
          for k in keys:
            i=s.lower().find(k.lower())
            if i>=0:
              hits.append((i,k))
          if not hits:
            raise SystemExit('no scope builder marker found')
          i=min(hits)[0]
          start=max(0,i-5000); end=min(len(s),i+18000)
          Path('tmp-scope-builder-snippet.txt').write_text(s[start:end])
          PY
          git config user.name "sani-estimator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tmp-scope-builder-snippet.txt
          git commit -m "Temporary inspect scope builder"
          git push origin HEAD:main