name: Fix Quote Window Options
on:
  push:
    paths:
      - '.github/trigger-quote-window-options.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quote window option rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quote.html')
          s=p.read_text()
          old="active.forEach(s=>{s.included=U(s.included).filter(x=>!isOption(x));s.customerSupplies=U(s.customerSupplies);s.notIncluded=U(s.notIncluded)});return pubScope(e,active)}"
          new="""active.forEach(s=>{s.included=U(s.included).filter(x=>!isOption(x));s.customerSupplies=U(s.customerSupplies);s.notIncluded=U(s.notIncluded)});if(deterministic){const w=get('Windows'),sel=e.optionSelections&&e.optionSelections.Windows;if(w&&sel){w.options=A(sel.alternatives).filter(o=>{const k=optionKey(o.label||'');return k==='B'||(!k&&/alternate|alternative/i.test(C(o.label)+' '+C(o.description)))}).map(o=>({label:o.label||'Option B — Alternate window scope',description:o.description||'Alternative window scope; not included in the current estimate total.',price:+o.price||0}));w.notIncluded=U(w.notIncluded).filter(x=>!/^option\\s*b\\b/i.test(C(x)))}}return pubScope(e,active)}"""
          if old not in s:
              raise SystemExit('target build tail not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'sani-estimator-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quote.html
          git commit -m 'Use deterministic Window option selection on customer quote' || exit 0
          git push
