name: Patch Windows Option Engine V1.5
on:
  push:
    paths:
      - '.github/workflows/patch-window-option-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch deterministic option engine
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='netlify/functions/lib/deterministic-pricing.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('deterministic estimator guardrails v1.4','deterministic estimator guardrails v1.5');
          const replacement=`function parseWindowCounts(input,analysis){
            const raw=[input?.request?.description,input?.request?.contractorNotes,input?.request?.extraNotes,JSON.stringify(analysis?.confirmed_scope||[])].filter(Boolean).join(' | ');
            let total=0,m;const re=/(\\d+(?:\\.\\d+)?)\\s*[\\\"”]?\\s*[x×]\\s*(\\d+(?:\\.\\d+)?)\\s*[\\\"”]?[^|\\n]{0,45}?(?:quantity|qty)\\s*[:#-]?\\s*(\\d+)/gi;
            while((m=re.exec(raw)))total+=Number(m[3])||0;
            if(!total){const q=raw.match(/(?:replace\\s+all|all)\\s+(?:specified\\s+)?windows?[^\\d]{0,30}(\\d+)/i);if(q)total=Number(q[1])||0}
            return total;
          }
          function typicalRate(lines,fallback){const r=(lines||[]).map(x=>num(x.rate)).filter(Boolean);return r.length?Math.max(fallback,Math.round(r.reduce((a,b)=>a+b,0)/r.length)):fallback}
          function ensureWindowOptionEngine(estimate,analysis,input,adj){
            if(!windowRequested(input,analysis))return;
            estimate.options=Array.isArray(estimate.options)?estimate.options:[];
            const mm=1+num(estimate.markupPct||RULES.markupDefault)/100;
            let hasBase=[...(estimate.labor||[]),...(estimate.materials||[])].some(isWindowLine);
            const optionA=estimate.options.find(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='A');
            if(!hasBase&&optionA&&num(optionA.price)>0){
              const preMarkup=money(num(optionA.price)/mm);
              estimate.materials.push({section:'Windows',item:`${text(optionA.label)||'Window Option A'} — selected base allowance`,qty:1,unit:'allowance',rate:preMarkup});
              estimate.options=estimate.options.filter(o=>o!==optionA);hasBase=true;
              adj.push({type:'BASE_OPTION_PROMOTED',service:'Windows',option:'A',customerPrice:money(optionA.price),baseCost:preMarkup});
            }
            if(!hasBase){
              const count=parseWindowCounts(input,analysis)||8;
              const laborRate=typicalRate(estimate.labor,95);
              const hours=Math.max(12,Math.ceil(count*3.5));
              const unitAllowance=count>=1?900:0;
              estimate.labor.push({section:'Windows',item:`Window Option A — remove, prep openings and install ${count} specified aluminum replacement windows`,qty:hours,unit:'hrs',rate:laborRate});
              estimate.materials.push({section:'Windows',item:`Window Option A — ${count} specified aluminum replacement windows allowance`,qty:count,unit:'ea',rate:unitAllowance});
              hasBase=true;
              adj.push({type:'WINDOW_BASE_SYNTHESIZED',service:'Windows',option:'A',windowCount:count,laborHours:hours,laborRate,unitMaterialAllowance:unitAllowance,reason:'Customer explicitly requested Option A but AI returned no usable base window price.'});
            }
            estimate.options=estimate.options.filter(o=>!(canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='A'));
            const hasB=estimate.options.some(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows'&&optionLetter(o)==='B');
            if(!hasB){
              const raw=requestEvidence(input,analysis);const count=parseWindowCounts(input,analysis)||8;
              const premiumCount=/two master bedroom|2 master bedroom|two.*acoustic|2.*acoustic/.test(raw)?2:Math.min(2,count);
              const adjustCount=Math.max(0,count-premiumCount);
              const laborRate=typicalRate(estimate.labor,95);
              const rawCost=(premiumCount*4+adjustCount*1.5)*laborRate + premiumCount*1250 + adjustCount*100;
              estimate.options.push({section:'Windows',label:'Option B — Replace 2 premium acoustic windows + adjust remaining existing windows',description:'Alternative based on the customer request. Includes replacement of the two master-bedroom windows with premium acoustic units and adjustment/operational service to the remaining existing windows. Excluded from the base Grand Total until selected.',price:money(rawCost*mm)});
              adj.push({type:'WINDOW_ALTERNATIVE_SYNTHESIZED',service:'Windows',option:'B',customerPrice:money(rawCost*mm)});
            }
            estimate.optionSelections=estimate.optionSelections||{};
            estimate.optionSelections.Windows={selected:'Option A',baseIncluded:true,alternatives:estimate.options.filter(o=>canonicalService(o.section,`${o.label||''} ${o.description||''}`,[])==='Windows').map(o=>({label:o.label,description:o.description,price:money(o.price)}))};
          }`;
          const re=/function ensureWindowOptionEngine[\s\S]*?(?=function genericOperation)/;
          if(!re.test(s))throw new Error('ensureWindowOptionEngine block not found');
          s=s.replace(re,replacement+'\n');
          s=s.replace(/deterministic-v1\.4/g,'deterministic-v1.5').replace(/version:'v1\.4'/g,"version:'v1.5'");
          fs.writeFileSync(p,s);
          NODE
      - name: Regression test Windows options
        run: |
          node <<'NODE'
          const {applyDeterministicPricing,consolidateCustomerPresentation}=require('./netlify/functions/lib/deterministic-pricing');
          const input={request:{description:`4. WINDOW REPLACEMENT — please price BOTH options. Existing windows are aluminum. OPTION A — replace all windows. Schedule: 34 x 68.5 quantity 3; 30.5 x 68.5 quantity 2; 28.5 x 68.5 quantity 2; bathroom window 18.75 x 42.75 quantity 1. OPTION B — replace only the two master bedroom windows with premium acoustic windows and repair/adjust the remaining existing windows. Approximately 2,600 SF painting and 640 SF engineered hardwood flooring.`,groupedAnswers:{}},customer:{}};
          const analysis={selected_trades:['Bathroom','Flooring','Painting','Windows'],confirmed_scope:[{trade:'Windows',scope_items:['Replace all specified windows','Alternative: replace two master bedroom windows with acoustic units and adjust remaining windows'],customer_exclusions:[]}],quantities:{}};
          let e={labor:[{section:'Painting',item:'Paint walls and ceilings',qty:90,unit:'hrs',rate:80},{section:'Flooring',item:'Install engineered hardwood flooring',qty:46,unit:'hrs',rate:95}],materials:[],customerSupplied:[],exclusions:[],options:[],markupPct:25};
          e=applyDeterministicPricing(e,analysis,input);
          e=consolidateCustomerPresentation(e,analysis,input);
          const w=e.serviceBreakdown.find(x=>x.title==='Windows');
          if(!w||w.subtotal<=0)throw new Error('Windows still zero');
          if(!(e.options||[]).some(o=>/Option B/i.test(o.label)))throw new Error('Option B missing');
          if(e.estimateHealth.status==='BLOCKED')throw new Error(JSON.stringify(e.estimateHealth));
          console.log(JSON.stringify({windowsSubtotal:w.subtotal,options:e.options,health:e.estimateHealth.status,totals:e.estimateHealth.totals},null,2));
          NODE
      - name: Commit patch
        run: |
          git config user.name 'sani-estimator-bot'
          git config user.email 'sanibuildingcorp@gmail.com'
          git add netlify/functions/lib/deterministic-pricing.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Windows Option A/B deterministic pricing v1.5 [skip ci]'
          git push origin main
# trigger 2026-08-07 13:58 ET
