<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Job sheet · Sani Building Corp</title>
<style>
:root{--navy:#14213d;--gold:#c4a35a;--gold-soft:#faf5e8;--ink:#1d1d1f;--muted:#6b6b70;--line:#e7e2d6;--ok:#1e7a45;--warn:#8a5a00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:#f6f4ef;color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:var(--navy);color:#fff;padding:18px 18px 22px}
.brand{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--gold)}
h1{font-size:23px;line-height:1.25;margin:8px 0 6px}
.type{display:inline-block;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 11px;font-size:13px;margin-top:4px}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#8a7a52;font-weight:700;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #f1ede3;font-size:15px}.row:last-child{border:0}
.row span:first-child{color:var(--muted)}.row span:last-child{text-align:right;font-weight:600}
.row a{color:var(--navy)}
p{font-size:15.5px;line-height:1.55;margin:0}
.said{font-style:italic;color:#444;background:#f7f5ef;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.warn{background:#fff6e5;border-color:#f1dfb6}.warn li{color:#5a3d00}
ul{margin:0;padding-left:20px}li{font-size:15px;line-height:1.5;margin:4px 0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f1ede3;cursor:pointer}.step:last-child{border:0}
.box{flex:0 0 28px;height:28px;border:2px solid #c9c2ae;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;margin-top:1px}
.step.done .box{background:var(--ok);border-color:var(--ok)}
.step.done b{color:#6b6b70;text-decoration:line-through}
.n{font-size:12px;color:#8a7a52;font-weight:700}.step b{display:block;font-size:16px;line-height:1.35}.how{font-size:14.5px;line-height:1.5;color:#444;margin-top:4px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px;line-height:1.4;cursor:pointer}.chk i{flex:0 0 20px;height:20px;border:2px solid #c9c2ae;border-radius:5px;margin-top:1px}.chk.on i{background:var(--navy);border-color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
.gold{background:var(--gold);color:var(--navy)}.navy{background:var(--navy);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.bar{height:6px;background:#eee8d8;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);width:0}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;min-height:70px}
.done-banner{background:#e7f5ec;color:var(--ok);border:1px solid #bfe3cc;font-weight:700;text-align:center}
.err{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="err">Loading your job…</div></div>
<script>
var T = new URLSearchParams(location.search).get('t') || '';
var S = null, P = { steps: {}, photos: [] }, LOCAL = {};
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
try { LOCAL = JSON.parse(localStorage.getItem('crew_chk_' + T) || '{}'); } catch (e) {}
async function api(body) {
  var r = await fetch('/.netlify/functions/crew' + (body ? '' : '?t=' + encodeURIComponent(T)), body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ t: T }, body)) } : undefined);
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
function niceDate(d) { if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) return d || ''; var x = new Date(d + 'T12:00:00'); return x.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
function list(title, arr, key) {
  if (!arr || !arr.length) return '';
  return '<div class="card"><div class="k">' + title + '</div>' + arr.map(function (x, i) { var id = key + i; return '<div class="chk' + (LOCAL[id] ? ' on' : '') + '" onclick="tick(\'' + id + '\',this)"><i></i><span>' + esc(x) + '</span></div>'; }).join('') + '</div>';
}
function tick(id, el) { LOCAL[id] = !LOCAL[id]; el.classList.toggle('on', LOCAL[id]); try { localStorage.setItem('crew_chk_' + T, JSON.stringify(LOCAL)); } catch (e) {} }
function render() {
  var s = S, done = s.steps.filter(function (_, i) { return P.steps[i]; }).length;
  var h = '<header><div class="brand">SANI BUILDING CORP · JOB SHEET</div><h1>' + esc(s.title) + '</h1>' + (s.jobType ? '<span class="type">' + esc(s.jobType) + '</span>' : '') + '</header><main>';
  if (P.doneAt) h += '<div class="card done-banner">Job marked done. Thank you.</div>';
  h += '<div class="card"><div class="k">Where and when</div>' +
    (s.address ? '<div class="row"><span>Address</span><span><a href="https://maps.google.com/?q=' + encodeURIComponent(s.address) + '">' + esc(s.address) + '</a></span></div>' : '') +
    ((s.date || s.time) ? '<div class="row"><span>When</span><span>' + esc([niceDate(s.date), s.time].filter(Boolean).join(' · ')) + '</span></div>' : '') +
    (s.hours ? '<div class="row"><span>Time on site</span><span>' + esc(s.hours) + '</span></div>' : '') +
    (s.customer ? '<div class="row"><span>Customer</span><span>' + esc(s.customer) + '</span></div>' : '') +
    (s.phone ? '<div class="row"><span>Customer phone</span><span><a href="tel:' + esc(s.phone) + '">' + esc(s.phone) + '</a></span></div>' : '') +
    '<div class="row"><span>Questions?</span><span><a href="tel:+13322770990">Call the office</a></span></div></div>';
  h += '<div class="card"><div class="k">The job</div>' + (s.explain ? '<p>' + esc(s.explain) + '</p>' : '') + (s.customerSaid ? '<div class="said">Customer wrote: “' + esc(s.customerSaid) + '”</div>' : '') + '</div>';
  if (s.building.length || s.warnings.length) h += '<div class="card warn"><div class="k">Watch out</div><ul>' + s.building.concat(s.warnings).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  if (s.photos.length) h += '<div class="card"><div class="k">Customer photos</div><div class="photos">' + s.photos.map(function (u) { return '<a href="' + esc(u) + '" target="_blank"><img src="' + esc(u) + '" alt="Job photo" loading="lazy"></a>'; }).join('') + '</div></div>';
  h += '<div class="two">' + list('Tools to bring', s.tools, 't') + list('Materials to bring', s.materials, 'm') + '</div>';
  if (s.steps.length) h += '<div class="card"><div class="k">Step by step · ' + done + ' of ' + s.steps.length + ' done</div><div class="bar"><i style="width:' + Math.round(100 * done / s.steps.length) + '%"></i></div>' +
    s.steps.map(function (x, i) { return '<div class="step' + (P.steps[i] ? ' done' : '') + '" onclick="step(' + i + ')"><div class="box">' + (P.steps[i] ? '✓' : '') + '</div><div><div class="n">STEP ' + (i + 1) + '</div><b>' + esc(x.step) + '</b>' + (x.how ? '<div class="how">' + esc(x.how) + '</div>' : '') + '</div></div>'; }).join('') + '</div>';
  h += list('Check before you leave', s.checks, 'c');
  if (s.notIncluded.length) h += '<div class="card"><div class="k">Not in this job · call the office first</div><ul>' + s.notIncluded.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  var before = P.photos.filter(function (p) { return p.kind === 'before'; }).length, after = P.photos.length - before;
  h += '<div class="card"><div class="k">Photos for the office</div><p style="font-size:14px;color:#666">Before you start and when you finish.</p>' +
    '<button class="btn ghost" onclick="pick(\'before\')">Add before photo' + (before ? ' (' + before + ')' : '') + '</button>' +
    '<button class="btn ghost" onclick="pick(\'after\')">Add after photo' + (after ? ' (' + after + ')' : '') + '</button>' +
    '<input type="file" id="ph" accept="image/*" capture="environment" hidden></div>';
  if (!P.doneAt) h += '<div class="card"><div class="k">Finished?</div><textarea id="note" placeholder="Anything the office should know (optional)"></textarea><button class="btn navy" onclick="finish()">Job done</button></div>';
  h += '<p style="text-align:center;font-size:12px;color:#999;margin:18px 0 30px">' + esc(s.ref) + ' · private job link, do not share</p></main>';
  document.getElementById('app').innerHTML = h;
}
async function step(i) {
  P.steps[i] = !P.steps[i]; render();
  try { var j = await api({ action: 'step', i: i, done: P.steps[i] }); P = j.progress; } catch (e) { alert(e.message); }
}
var KIND = 'after';
function pick(kind) { KIND = kind; var el = document.getElementById('ph'); el.onchange = function () { if (el.files[0]) upload(el.files[0]); }; el.click(); }
function upload(file) {
  var img = new Image(), rd = new FileReader();
  rd.onload = function () { img.src = rd.result; };
  img.onload = async function () {
    var k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { var j = await api({ action: 'photo', kind: KIND, data: c.toDataURL('image/jpeg', 0.8) }); P = j.progress; render(); } catch (e) { alert('Photo not saved: ' + e.message); }
  };
  rd.readAsDataURL(file);
}
async function finish() {
  if (!confirm('Mark this job as done?')) return;
  try { var j = await api({ action: 'done', note: (document.getElementById('note') || {}).value || '' }); P = j.progress; render(); window.scrollTo(0, 0); } catch (e) { alert(e.message); }
}
(async function () {
  try { var j = await api(); S = j.sheet; P = j.progress || P; render(); }
  catch (e) { document.getElementById('app').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
})();
</script>
</body>
</html>
