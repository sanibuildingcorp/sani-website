<script>
/* ===== 🎨 FINISHING OPTIONS (uses bare currentRecord) ===== */
(function(){
  function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
  function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function rec(){ return (typeof currentRecord!=='undefined' && currentRecord) ? currentRecord : null; }
  function groups(){
    var r=rec(); if(!r || !r.estimate) return [];
    if(!r.estimate.finishGroups) r.estimate.finishGroups = [];
    return r.estimate.finishGroups;
  }
  function find(gid){ var gs=groups(); for(var i=0;i<gs.length;i++){ if(gs[i].id===gid) return gs[i]; } return null; }
  function findOpt(gid,oid){ var g=find(gid); if(!g) return null; var o=g.options||[]; for(var i=0;i<o.length;i++){ if(o[i].id===oid) return o[i]; } return null; }
  function defOpt(g){ var o=(g&&g.options)||[]; for(var i=0;i<o.length;i++){ if(o[i].isDefault) return o[i]; } return o[0]||{price:0}; }

  function compress(file,maxW,q){
    return new Promise(function(res,rej){
      var r=new FileReader(); r.onerror=rej;
      r.onload=function(e){
        var img=new Image(); img.onerror=rej;
        img.onload=function(){
          var w=img.width,h=img.height;
          if(w>maxW){ h=Math.round(h*(maxW/w)); w=maxW; }
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          res(c.toDataURL('image/jpeg',q));
        };
        img.src=e.target.result;
      };
      r.readAsDataURL(file);
    });
  }

  function sectionHTML(){
    var r=rec(); if(!r) return '';
    var gs=groups();
    var sm=(r.estimate.savedMaterials)||[];
    var matOpts=sm.map(function(m,i){
      var label=(m.name||('Material '+(i+1)));
      if(m.totalEstimate) label+=' — $'+m.totalEstimate;
      return '<option value="'+i+'">'+escAttr(label)+'</option>';
    }).join('');

    var html='<h3>🎨 FINISHING OPTIONS <span style="font-size:12px;font-weight:400;color:var(--ink-muted);letter-spacing:0">(customer can swap these in their quote)</span></h3>';
    html+='<div class="sbcf-hint">Offer the customer choices (tile, color, fixtures…). Mark one option as <b>Default</b> — that price is included in the quote total. Other options show the customer a <b>+$ upgrade</b> and update their total live when they swap.</div>';

    if(!gs.length){
      html+='<div class="sbcf-empty">No finish options yet. Add a group like “Wall Tile” or “Vanity”, then add 2–3 choices.</div>';
    }

    gs.forEach(function(g){
      var d=defOpt(g);
      html+='<div class="sbcf-group">';
      html+='<div class="sbcf-group-head">'
        +'<input class="sbcf-gname" type="text" value="'+escAttr(g.name||'')+'" placeholder="Group name (e.g. Wall Tile)" oninput="sbcfEditGroup(\''+g.id+'\',this.value)">'
        +'<button class="sbcf-del" onclick="sbcfRemoveGroup(\''+g.id+'\')">Remove</button>'
      +'</div>';

      (g.options||[]).forEach(function(o){
        var delta=(Number(o.price)||0)-(Number(d.price)||0);
        var deltaTxt = o.isDefault
          ? '<span class="sbcf-inc">★ Default — included in quote total</span>'
          : '<span class="sbcf-up">Customer sees: '+(delta>=0?'+':'−')+'$'+Math.abs(delta)+'</span>';
        var thumb = o.photo
          ? '<img src="'+o.photo+'" class="sbcf-thumb" onclick="openLightbox(this.src)" alt="">'
          : '<div class="sbcf-thumb sbcf-thumb-empty">🎨</div>';
        html+='<div class="sbcf-opt'+(o.isDefault?' is-def':'')+'">'
          +thumb
          +'<div class="sbcf-opt-fields">'
            +'<input class="sbcf-oname" type="text" value="'+escAttr(o.name||'')+'" placeholder="Option name (e.g. Marble-look porcelain)" oninput="sbcfEditOpt(\''+g.id+'\',\''+o.id+'\',\'name\',this.value)">'
            +'<input class="sbcf-ospec" type="text" value="'+escAttr(o.spec||'')+'" placeholder="Spec (e.g. 12x24 matte) — optional" oninput="sbcfEditOpt(\''+g.id+'\',\''+o.id+'\',\'spec\',this.value)">'
            +'<div class="sbcf-opt-row2">'
              +'<span class="sbcf-price-wrap">$<input type="number" class="sbcf-oprice" value="'+(o.price!=null?o.price:'')+'" placeholder="0" step="1" min="0" onchange="sbcfEditOpt(\''+g.id+'\',\''+o.id+'\',\'price\',this.value)"></span>'
              +'<label class="sbcf-def-lbl"><input type="radio" name="sbcf-def-'+g.id+'" '+(o.isDefault?'checked':'')+' onclick="sbcfSetDefault(\''+g.id+'\',\''+o.id+'\')"> Default</label>'
              +'<label class="sbcf-photo-btn">📷 Photo<input type="file" accept="image/*" style="display:none" onchange="sbcfPhoto(\''+g.id+'\',\''+o.id+'\',event)"></label>'
              +'<button class="sbcf-del-opt" title="Remove option" onclick="sbcfRemoveOption(\''+g.id+'\',\''+o.id+'\')">×</button>'
            +'</div>'
            +'<div class="sbcf-delta">'+deltaTxt+'</div>'
          +'</div>'
        +'</div>';
      });

      html+='<div class="sbcf-group-foot">'
        +'<button class="sbcf-add-opt" onclick="sbcfAddOption(\''+g.id+'\')">+ Add option</button>';
      if(sm.length){
        html+='<select class="sbcf-from-mat" onchange="sbcfAddFromMaterial(\''+g.id+'\',this.value);this.selectedIndex=0">'
          +'<option value="">+ Add from Find Materials…</option>'+matOpts+'</select>';
      }
      html+='</div>';
      html+='</div>';
    });

    html+='<div class="sbcf-foot">'
      +'<button class="sbcf-add-group" onclick="sbcfAddGroup()">+ Add finish group</button>'
      +'<button class="sbcf-render-use" onclick="sbcfUseInRender()">✨ Use defaults in AI render</button>'
    +'</div>';
    return html;
  }

  function render(){
    var card=document.getElementById('edit-card');
    var r=rec();
    if(!card || !r || !r.estimate) return;
    var ex=document.getElementById('sbcf-section'); if(ex) ex.remove();
    var sec=document.createElement('div');
    sec.className='form-section sbcf-section';
    sec.id='sbcf-section';
    sec.innerHTML=sectionHTML();
    var anchor=card.querySelector('.cv-panel');
    if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(sec,anchor);
    else card.appendChild(sec);
  }

  window.sbcfAddGroup=function(){ groups().push({id:uid(),name:'',options:[]}); render(); };
  window.sbcfRemoveGroup=function(gid){ var gs=groups(); for(var i=0;i<gs.length;i++){ if(gs[i].id===gid){ gs.splice(i,1); break; } } render(); };
  window.sbcfAddOption=function(gid){ var g=find(gid); if(!g) return; if(!g.options) g.options=[]; var first=g.options.length===0; g.options.push({id:uid(),name:'',spec:'',price:0,photo:'',isDefault:first}); render(); };
  window.sbcfAddFromMaterial=function(gid,idxStr){ var idx=parseInt(idxStr,10); if(isNaN(idx)) return; var r=rec(); if(!r) return; var sm=(r.estimate.savedMaterials)||[]; var m=sm[idx]; if(!m) return; var g=find(gid); if(!g) return; if(!g.options) g.options=[]; var first=g.options.length===0; g.options.push({id:uid(),name:m.name||'',spec:m.spec||'',price:Number(m.totalEstimate||m.estimatedUnitCost||0)||0,photo:'',isDefault:first}); render(); };
  window.sbcfRemoveOption=function(gid,oid){ var g=find(gid); if(!g) return; g.options=(g.options||[]).filter(function(o){ return o.id!==oid; }); if(g.options.length && !g.options.some(function(o){return o.isDefault;})) g.options[0].isDefault=true; render(); };
  window.sbcfSetDefault=function(gid,oid){ var g=find(gid); if(!g) return; (g.options||[]).forEach(function(o){ o.isDefault=(o.id===oid); }); render(); };
  window.sbcfEditGroup=function(gid,val){ var g=find(gid); if(g) g.name=val; };
  window.sbcfEditOpt=function(gid,oid,field,val){ var o=findOpt(gid,oid); if(!o) return; if(field==='price'){ o.price=parseFloat(val)||0; render(); } else { o[field]=val; } };
  window.sbcfPhoto=function(gid,oid,ev){ var f=ev.target.files&&ev.target.files[0]; if(!f) return; compress(f,900,0.8).then(function(data){ var o=findOpt(gid,oid); if(o){ o.photo=data; render(); } }).catch(function(){ if(window.toast) toast('Photo failed — try a smaller image',true); }); ev.target.value=''; };
  window.sbcfUseInRender=function(){
    var gs=groups().filter(function(g){ return g.options && g.options.length; });
    if(!gs.length){ if(window.toast) toast('Add finish options first',true); return; }
    var parts=gs.map(function(g){ var d=defOpt(g); return (g.name||'Finish')+': '+(d.name||''); });
    var txt='Use these finishes — '+parts.join('; ')+'.';
    var ta=document.getElementById('render-custom-prompt');
    if(ta){ ta.value=(ta.value?ta.value.trim()+' ':'')+txt; if(window.toast) toast('✓ Finishes added to render prompt'); }
    else if(window.toast){ toast('Scroll to the render box and tap Generate'); }
  };

  if(typeof renderEdit==='function'){
    var _origRenderEdit=renderEdit;
    renderEdit=function(){ _origRenderEdit.apply(this,arguments); try{ render(); }catch(e){ console.error('finish builder render',e); } };
  }
  if(typeof gatherForm==='function'){
    var _origGatherForm=gatherForm;
    gatherForm=function(){
      var est=_origGatherForm.apply(this,arguments);
      try{ var r=rec(); if(est && typeof est==='object') est.finishGroups=(r && r.estimate && r.estimate.finishGroups) || []; }catch(e){}
      return est;
    };
  }
})();

/* ===== 🛒 CUSTOMER-SELECTABLE MATERIALS (uses bare currentRecord) ===== */
(function(){
  if (window.__sbcMaterials) return;
  window.__sbcMaterials = true;

  function rec(){ return (typeof currentRecord!=='undefined' && currentRecord) ? currentRecord : null; }
  function est(){ var r=rec(); if(!r) return null; if(!r.estimate) r.estimate={}; return r.estimate; }

  function getSaved(){
    var e = est() || {};
    var keys = ['savedMaterials','materialsList','foundMaterials','findMaterials','materialsFound'];
    for (var i=0;i<keys.length;i++){ if (Array.isArray(e[keys[i]]) && e[keys[i]].length) return e[keys[i]]; }
    for (var p in e){
      if (!Object.prototype.hasOwnProperty.call(e,p)) continue;
      var v = e[p];
      if (Array.isArray(v) && v.length && v[0] && (v[0].estimatedUnitCost!=null || v[0].totalEstimate!=null || v[0].searchQuery!=null)) return v;
    }
    return [];
  }

  function ensureCM(){ var e=est(); if(!e) return []; if(!Array.isArray(e.customerMaterials)) e.customerMaterials=[]; return e.customerMaterials; }

  function defaultPrice(item){
    var p = Number(item.totalEstimate);
    if (!p) p = (Number(item.estimatedUnitCost)||0) * (Number(item.qty)||1);
    if (!p) p = Number(item.price)||0;
    return Math.round(p*100)/100;
  }
  function findEntry(cm, idx){ for(var i=0;i<cm.length;i++){ if(cm[i].srcIndex===idx) return i; } return -1; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  window.sbcmToggle = function(idx){
    var saved = getSaved(); var item = saved[idx]; if (!item) return;
    var cm = ensureCM(); var at = findEntry(cm, idx);
    if (at > -1) cm.splice(at,1);
    else cm.push({ id:'cm_'+idx+'_'+Math.random().toString(36).slice(2,7), srcIndex:idx, name:item.name||'Material', spec:item.spec||'', qty:item.qty||'', unit:item.unit||'', price:defaultPrice(item), includedByDefault:false });
    sbcmInject();
  };
  window.sbcmPrice = function(idx, val){
    var cm = ensureCM(); var at = findEntry(cm, idx); if (at<0) return;
    cm[at].price = Math.round((Number(val)||0)*100)/100;
    var c = document.getElementById('sbcm-count'); if (c) c.textContent = sbcmSummary();
  };
  window.sbcmDefault = function(idx, checked){
    var cm = ensureCM(); var at = findEntry(cm, idx); if (at<0) return;
    cm[at].includedByDefault = !!checked;
  };

  function sbcmSummary(){
    var cm = ensureCM();
    var total = cm.reduce(function(s,m){ return s + (Number(m.price)||0); }, 0);
    return cm.length + ' offered · ' + (cm.length ? ('$'+total.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' if all picked') : '');
  }

  function sbcmInject(){
    var card = document.getElementById('edit-card');
    if (!card || !rec()) return;
    var old = document.getElementById('sbcm-section'); if (old) old.remove();

    var sec = document.createElement('div');
    sec.id = 'sbcm-section';

    var saved = getSaved();
    var cm = ensureCM();

    var html = '<div class="sbcm-head">🛒 Customer-Selectable Materials</div>'
      + '<div class="sbcm-sub">Tick items to let the customer choose them on their quote. Price is pre-filled from your Find Materials list — edit if you want to mark it up.</div>';

    if (!saved.length) {
      html += '<div class="sbcm-empty">Run <b>Find Materials</b> above first, then come back here to offer items to the customer.</div>';
    } else {
      for (var i=0;i<saved.length;i++){
        var item = saved[i];
        var at = findEntry(cm, i);
        var on = at > -1;
        var price = on ? (Number(cm[at].price)||0) : defaultPrice(item);
        var isDef = on ? !!cm[at].includedByDefault : false;
        var specBits = [];
        if (item.qty) specBits.push(esc(item.qty)+(item.unit?(' '+esc(item.unit)):''));
        if (item.spec) specBits.push(esc(item.spec));
        var specLine = specBits.join(' · ');

        html += '<div class="sbcm-item'+(on?' on':'')+'">'
          + '<div class="sbcm-row1">'
            + '<div class="sbcm-cb" onclick="sbcmToggle('+i+')">'+(on?'✓':'')+'</div>'
            + '<div class="sbcm-meta">'
              + '<div class="sbcm-name">'+esc(item.name||'Material')+'</div>'
              + (specLine?'<div class="sbcm-spec">'+specLine+'</div>':'')
            + '</div>'
          + '</div>';

        if (on) {
          html += '<div class="sbcm-row2">'
            + '<div class="sbcm-price-wrap"><label>Customer price</label><span class="dollar">$</span>'
              + '<input type="number" class="sbcm-price" value="'+price+'" min="0" step="0.01" '
              + 'onchange="sbcmPrice('+i+',this.value)" oninput="sbcmPrice('+i+',this.value)"></div>'
            + '<label class="sbcm-def"><input type="checkbox" '+(isDef?'checked':'')+' onchange="sbcmDefault('+i+',this.checked)"> Pre-check for customer</label>'
          + '</div>';
        }
        html += '</div>';
      }
      html += '<div class="sbcm-count" id="sbcm-count">'+sbcmSummary()+'</div>';
    }

    sec.innerHTML = html;
    var anchor = card.querySelector('.cv-panel');
    if (anchor) card.insertBefore(sec, anchor);
    else card.appendChild(sec);
  }

  if (typeof renderEdit === 'function') {
    var _origRenderEdit = renderEdit;
    renderEdit = function(){ _origRenderEdit.apply(this, arguments); try { sbcmInject(); } catch(e){ console.error('materials builder', e); } };
  }
  if (typeof gatherForm === 'function') {
    var _origGatherForm = gatherForm;
    gatherForm = function(){
      var e = _origGatherForm.apply(this, arguments);
      try { var r=rec(); if (e && typeof e === 'object') e.customerMaterials = (r && r.estimate && r.estimate.customerMaterials) || []; } catch(err){}
      return e;
    };
  }
})();
</script>


<!-- ============================================================
     PHOTO AUTO-SHRINK  ·  uploads base64 photos to Supabase Storage
     before save-estimate is called so they survive Netlify Blobs.
     Intercepts window.fetch transparently.
     ============================================================ -->
<script>
(function(){
  var _origFetch = window.fetch;
  window.fetch = async function(input, init){
    try {
      var url = typeof input === 'string' ? input : (input && input.url) || '';
      if (init && init.method === 'POST' && url.indexOf('/save-estimate') !== -1 && init.body) {
        var bodyStr = typeof init.body === 'string' ? init.body : null;
        if (bodyStr) {
          var payload = JSON.parse(bodyStr);
          var ref = (payload && payload.ref) || (payload && payload.estimate && payload.estimate.ref) || '';
          if (ref) {
            // Walk estimate.quotePhotos
            if (payload.estimate && Array.isArray(payload.estimate.quotePhotos)) {
              for (var i = 0; i < payload.estimate.quotePhotos.length; i++) {
                var p = payload.estimate.quotePhotos[i];
                if (typeof p === 'string' && p.indexOf('data:') === 0) {
                  try {
                    var r = await _origFetch('/.netlify/functions/upload-photo', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ base64: p, ref: ref })
                    });
                    var jr = await r.json();
                    if (jr && jr.url) payload.estimate.quotePhotos[i] = jr.url;
                  } catch(e) {}
                }
              }
            }
            // Walk request.photos
            if (payload.request && Array.isArray(payload.request.photos)) {
              for (var j = 0; j < payload.request.photos.length; j++) {
                var pp = payload.request.photos[j];
                if (typeof pp === 'string' && pp.indexOf('data:') === 0) {
                  try {
                    var rr = await _origFetch('/.netlify/functions/upload-photo', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ base64: pp, ref: ref })
                    });
                    var jrr = await rr.json();
                    if (jrr && jrr.url) payload.request.photos[j] = jrr.url;
                  } catch(e) {}
                }
              }
            }
            init.body = JSON.stringify(payload);
          }
        }
      }
    } catch(e) { /* swallow and pass through */ }
    return _origFetch.apply(this, arguments);
  };
})();
</script>
