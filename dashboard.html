<!-- ════════════════════════════════════════════════════════════════════

<!-- ════════════════════════════════════════════════════════════════════
     [PART 2] - ADD THIS CSS INTO YOUR EXISTING <style> BLOCK
     ════════════════════════════════════════════════════════════════════ -->
<style>
/* CONFIRMATION MODAL */
.confirm-overlay {
  display:none;
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.7);
  z-index:9999;
  align-items:flex-start;
  justify-content:center;
  padding:20px;
  overflow-y:auto;
}
.confirm-overlay.active { display:flex; }
.confirm-modal {
  background:#fff;
  border-radius:14px;
  max-width:640px;
  width:100%;
  padding:0;
  margin:20px 0;
  position:relative;
  overflow:hidden;
}
.confirm-header {
  background:linear-gradient(135deg,#0d1b2a,#1a2d42);
  color:#fff;
  padding:24px 28px;
  border-bottom:3px solid #c9a84c;
}
.confirm-header h2 {
  font-family:'Playfair Display',Georgia,serif;
  font-size:22px;
  margin:0;
  font-weight:700;
}
.confirm-header h2 em { color:#c9a84c; font-style:italic; }
.confirm-header p { font-size:13px; color:rgba(255,255,255,0.7); margin-top:6px; }
.confirm-close {
  position:absolute;
  top:18px; right:18px;
  background:rgba(255,255,255,0.15);
  border:none;
  color:#fff;
  width:32px; height:32px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}
.confirm-body { padding:24px 28px; }
.confirm-section { margin-bottom:22px; }
.confirm-section-label {
  font-size:11px;
  letter-spacing:2px;
  color:#b8930a;
  text-transform:uppercase;
  font-weight:700;
  margin-bottom:10px;
}
.pricing-mode-tabs {
  display:flex;
  gap:6px;
  background:#faf8f4;
  padding:4px;
  border-radius:8px;
  margin-bottom:12px;
}
.pm-tab {
  flex:1;
  padding:10px;
  border:none;
  background:transparent;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  color:#555;
  cursor:pointer;
  border-radius:6px;
  text-align:center;
}
.pm-tab.active {
  background:#fff;
  color:#0d1b2a;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
}
.confirm-input {
  width:100%;
  padding:12px 14px;
  font-size:14px;
  font-family:inherit;
  border:1.5px solid #e8e2d9;
  border-radius:8px;
  background:#fff;
  outline:none;
}
.confirm-input:focus { border-color:#c9a84c; }
.confirm-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media (max-width:540px) { .confirm-row { grid-template-columns:1fr; } }
.confirm-textarea {
  width:100%;
  padding:12px 14px;
  font-size:13px;
  font-family:inherit;
  border:1.5px solid #e8e2d9;
  border-radius:8px;
  resize:vertical;
  min-height:90px;
  line-height:1.5;
}
.confirm-textarea:focus { border-color:#c9a84c; outline:none; }
.confirm-toggle {
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:#faf8f4;
  border-radius:8px;
  cursor:pointer;
}
.confirm-toggle input { 
  width:18px; height:18px; 
  accent-color:#c9a84c; 
  cursor:pointer;
}
.confirm-warnings {
  background:#fef3e0;
  border:1px solid #d4a017;
  border-radius:8px;
  padding:10px 14px;
  font-size:12px;
  color:#856404;
  margin-bottom:14px;
  display:none;
}
.confirm-warnings.show { display:block; }
.confirm-footer {
  padding:18px 28px;
  border-top:1px solid #e8e2d9;
  background:#faf8f4;
  display:flex;
  gap:10px;
  justify-content:flex-end;
}
.confirm-btn {
  padding:12px 22px;
  border-radius:8px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
  border:2px solid transparent;
}
.confirm-btn-cancel {
  background:#fff;
  color:#555;
  border-color:#e8e2d9;
}
.confirm-btn-send {
  background:linear-gradient(135deg,#c9a84c,#b8930a);
  color:#0d1b2a;
}
.confirm-btn-send:disabled { opacity:0.6; cursor:not-allowed; }
.confirm-status {
  font-size:12px;
  color:#555;
  margin-right:auto;
  align-self:center;
}
</style>


<!-- ════════════════════════════════════════════════════════════════════
     [PART 3] - ADD THIS MODAL HTML AT THE BOTTOM OF <body> 
     (right before the closing </body> tag)
     ════════════════════════════════════════════════════════════════════ -->

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-modal">

    <div class="confirm-header">
      <button class="confirm-close" onclick="closeConfirmationModal()">×</button>
      <h2>📧 Send <em>Confirmation</em></h2>
      <p>Customer will receive a signable agreement by email</p>
    </div>

    <div class="confirm-body">

      <div class="confirm-warnings" id="confirm-warnings"></div>

      <!-- PRICING -->
      <div class="confirm-section">
        <div class="confirm-section-label">💰 Pricing Mode</div>
        <div class="pricing-mode-tabs">
          <button class="pm-tab active" data-mode="range" onclick="setPricingMode('range')">📊 Range</button>
          <button class="pm-tab" data-mode="fixed" onclick="setPricingMode('fixed')">🎯 Fixed</button>
          <button class="pm-tab" data-mode="capped" onclick="setPricingMode('capped')">🛡️ Capped Max</button>
        </div>

        <div id="price-fields-range" class="confirm-row">
          <input type="number" class="confirm-input" id="price-min" placeholder="Min ($)">
          <input type="number" class="confirm-input" id="price-max" placeholder="Max ($)">
        </div>
        <div id="price-fields-fixed" style="display:none">
          <input type="number" class="confirm-input" id="price-fixed" placeholder="Fixed price ($)">
        </div>
        <div id="price-fields-capped" style="display:none">
          <input type="number" class="confirm-input" id="price-cap" placeholder="Max won't exceed ($)">
        </div>
      </div>

      <!-- APPOINTMENT -->
      <div class="confirm-section">
        <div class="confirm-section-label">📅 Appointment</div>
        <div class="confirm-row">
          <input type="date" class="confirm-input" id="appt-date">
          <input type="text" class="confirm-input" id="appt-time" placeholder="e.g. 10:00 AM">
        </div>
        <input type="text" class="confirm-input" id="appt-duration" placeholder="Duration (e.g. 2-3 hours)" style="margin-top:8px">
      </div>

      <!-- SCOPE -->
      <div class="confirm-section">
        <div class="confirm-section-label">🔧 Scope of Work</div>
        <textarea class="confirm-textarea" id="scope-summary" placeholder="What we'll do..."></textarea>
      </div>

      <!-- SPECIAL NOTES -->
      <div class="confirm-section">
        <div class="confirm-section-label">📝 Special Notes (Optional)</div>
        <textarea class="confirm-textarea" id="special-notes" placeholder="Anything else the customer should know..." style="min-height:60px"></textarea>
      </div>

      <!-- DEPOSIT TOGGLE -->
      <div class="confirm-section">
        <div class="confirm-section-label">💳 Optional Deposit</div>
        <label class="confirm-toggle">
          <input type="checkbox" id="deposit-toggle" onchange="toggleDeposit()">
          <span style="font-size:13px;color:#444">Require deposit/payment with signing</span>
        </label>
        <div id="deposit-fields" style="display:none;margin-top:10px">
          <div class="confirm-row">
            <input type="number" class="confirm-input" id="deposit-amount" placeholder="Amount ($)">
            <input type="text" class="confirm-input" id="deposit-label" placeholder="Label (e.g. Deposit)" value="Deposit">
          </div>
          <div style="font-size:11px;color:#888;margin-top:6px;font-style:italic">Note: Payment integration is placeholder for now. Wire up Stripe when ready.</div>
        </div>
      </div>

    </div>

    <div class="confirm-footer">
      <div class="confirm-status" id="confirm-status"></div>
      <button class="confirm-btn confirm-btn-cancel" onclick="closeConfirmationModal()">Cancel</button>
      <button class="confirm-btn confirm-btn-send" id="confirm-send-btn" onclick="sendConfirmation()">📤 Send to Customer</button>
    </div>

  </div>
</div>


<!-- ════════════════════════════════════════════════════════════════════
     [PART 4] - ADD THIS JAVASCRIPT INTO YOUR EXISTING <script> BLOCK
     ════════════════════════════════════════════════════════════════════ -->

<script>
let CURRENT_CONFIRM_BOOKING = null;
let CURRENT_PRICING_MODE = 'range';

/* Call this from your handyman detail view to open modal.
   You'll need to pass the current booking object. */
function openConfirmationModal() {
  // CURRENT_BOOKING should be the booking object currently displayed in the detail modal.
  // Adjust this variable name if your dashboard uses a different one.
  if (typeof CURRENT_BOOKING !== 'undefined' && CURRENT_BOOKING) {
    CURRENT_CONFIRM_BOOKING = CURRENT_BOOKING;
  } else if (typeof currentBooking !== 'undefined' && currentBooking) {
    CURRENT_CONFIRM_BOOKING = currentBooking;
  } else {
    alert('Could not load booking data. Please refresh and try again.');
    return;
  }

  // Pre-fill from booking AI estimate
  const b = CURRENT_CONFIRM_BOOKING;
  document.getElementById('price-min').value = b.estimated_labor_min || '';
  document.getElementById('price-max').value = b.estimated_labor_max || '';
  document.getElementById('price-fixed').value = '';
  document.getElementById('price-cap').value = b.estimated_labor_max || '';
  document.getElementById('appt-date').value = b.preferred_date || '';
  document.getElementById('appt-time').value = '';
  document.getElementById('appt-duration').value = 
    (b.estimated_time_min && b.estimated_time_max) 
      ? b.estimated_time_min + '-' + b.estimated_time_max + ' hours'
      : '';
  document.getElementById('scope-summary').value = b.job_summary || b.customer_description || '';
  document.getElementById('special-notes').value = '';
  document.getElementById('deposit-toggle').checked = b.deposit_required || false;
  document.getElementById('deposit-amount').value = b.deposit_amount || '';
  document.getElementById('deposit-label').value = 'Deposit';
  document.getElementById('deposit-fields').style.display = b.deposit_required ? 'block' : 'none';

  setPricingMode('range');
  validateForm();

  document.getElementById('confirm-overlay').classList.add('active');
}

function closeConfirmationModal() {
  document.getElementById('confirm-overlay').classList.remove('active');
  CURRENT_CONFIRM_BOOKING = null;
}

function setPricingMode(mode) {
  CURRENT_PRICING_MODE = mode;
  document.querySelectorAll('.pm-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  document.getElementById('price-fields-range').style.display = mode === 'range' ? 'grid' : 'none';
  document.getElementById('price-fields-fixed').style.display = mode === 'fixed' ? 'block' : 'none';
  document.getElementById('price-fields-capped').style.display = mode === 'capped' ? 'block' : 'none';
  validateForm();
}

function toggleDeposit() {
  const on = document.getElementById('deposit-toggle').checked;
  document.getElementById('deposit-fields').style.display = on ? 'block' : 'none';
}

function validateForm() {
  // Build warnings (optional - send anyway since user picked that)
  const warnings = [];
  const date = document.getElementById('appt-date').value;
  const time = document.getElementById('appt-time').value.trim();
  if (!date) warnings.push('No appointment date set');
  if (!time) warnings.push('No appointment time set');

  if (CURRENT_PRICING_MODE === 'range') {
    if (!document.getElementById('price-min').value || !document.getElementById('price-max').value) {
      warnings.push('Price range missing');
    }
  } else if (CURRENT_PRICING_MODE === 'fixed') {
    if (!document.getElementById('price-fixed').value) warnings.push('Fixed price missing');
  } else if (CURRENT_PRICING_MODE === 'capped') {
    if (!document.getElementById('price-cap').value) warnings.push('Max cap missing');
  }

  const warningsEl = document.getElementById('confirm-warnings');
  if (warnings.length > 0) {
    warningsEl.innerHTML = '⚠️ ' + warnings.join(' · ');
    warningsEl.classList.add('show');
  } else {
    warningsEl.classList.remove('show');
  }
}

// Attach live validation
document.addEventListener('input', function(e) {
  if (e.target.closest('#confirm-overlay')) validateForm();
});

async function sendConfirmation() {
  if (!CURRENT_CONFIRM_BOOKING) return;

  const btn = document.getElementById('confirm-send-btn');
  const status = document.getElementById('confirm-status');
  btn.disabled = true;
  btn.innerHTML = '⏳ Sending...';
  status.textContent = '';

  const payload = {
    bookingRef: CURRENT_CONFIRM_BOOKING.ref,
    pricingMode: CURRENT_PRICING_MODE,
    fixedPrice: parseFloat(document.getElementById('price-fixed').value) || null,
    priceMin: parseFloat(document.getElementById('price-min').value) || null,
    priceMax: parseFloat(document.getElementById('price-max').value) || null,
    priceCap: parseFloat(document.getElementById('price-cap').value) || null,
    appointmentDate: document.getElementById('appt-date').value || null,
    appointmentTime: document.getElementById('appt-time').value.trim(),
    durationText: document.getElementById('appt-duration').value.trim(),
    scopeSummary: document.getElementById('scope-summary').value.trim(),
    specialNotes: document.getElementById('special-notes').value.trim(),
    payNowEnabled: document.getElementById('deposit-toggle').checked,
    payNowAmount: parseFloat(document.getElementById('deposit-amount').value) || 0,
    payNowLabel: document.getElementById('deposit-label').value.trim() || 'Deposit'
  };

  try {
    const r = await fetch('/.netlify/functions/handyman-send-confirmation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!r.ok) {
      const err = await r.json().catch(function() { return { error: 'Failed' }; });
      throw new Error(err.error || 'Failed to send');
    }

    const data = await r.json();
    status.innerHTML = '✅ Sent! Link: <a href="' + data.url + '" target="_blank" style="color:#b8930a">View agreement</a>';
    btn.innerHTML = '✓ Sent';
    
    setTimeout(function() {
      closeConfirmationModal();
      // Refresh dashboard data if you have a refresh function
      if (typeof loadHandymanBookings === 'function') loadHandymanBookings();
      else if (typeof refreshHandyman === 'function') refreshHandyman();
    }, 2000);
  } catch (e) {
    console.error(e);
    status.innerHTML = '<span style="color:#c0392b">❌ ' + (e.message || 'Failed') + '</span>';
    btn.disabled = false;
    btn.innerHTML = '📤 Send to Customer';
  }
}
</script>
