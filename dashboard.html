<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Sani Building Corp</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0b1828;
  --navy-2: #122740;
  --navy-3: #1a3354;
  --gold: #d4b572;
  --gold-2: #c9a84c;
  --gold-soft: rgba(212, 181, 114, 0.12);
  --ink: #e8edf5;
  --ink-soft: #b8c4d6;
  --ink-muted: #7a8aa3;
  --line: rgba(212, 181, 114, 0.18);
  --line-soft: rgba(255,255,255,0.06);
  --bg: #06101e;
  --card: #0f1f33;
  --card-2: #142a44;
  --good: #4ade80;
  --good-bg: rgba(74, 222, 128, 0.12);
  --bad: #f87171;
  --bad-bg: rgba(248, 113, 113, 0.12);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.12);
  --display: 'Bebas Neue', Arial, sans-serif;
  --body: 'Inter', -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ============ LOGIN GATE ============ */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(circle at 30% 20%, var(--navy-2) 0%, var(--bg) 60%);
}
.login-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 44px 36px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.login-logo {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: 5px;
  color: var(--gold);
  margin-bottom: 6px;
}
.login-sub {
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--ink-muted);
  margin-bottom: 32px;
  text-transform: uppercase;
}
.login-input {
  width: 100%;
  padding: 14px 16px;
  background: var(--navy);
  border: 1.5px solid var(--line);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  border-radius: 10px;
  margin-bottom: 14px;
}
.login-input:focus { outline: none; border-color: var(--gold); }
.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 1.5px;
  cursor: pointer;
  font-family: var(--body);
  text-transform: uppercase;
}
.login-error { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ============ HEADER ============ */
.app { display: none; }
.app.show { display: block; }

.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand-mark {
  font-family: var(--display);
  font-size: 18px;
  letter-spacing: 3px;
  color: var(--gold);
  flex: 1;
}
.brand-mark .sep { opacity: 0.4; margin: 0 8px; }
.brand-mark .sub { color: var(--ink-soft); letter-spacing: 4px; }

.topbar-btn {
  padding: 9px 16px;
  background: var(--gold-soft);
  border: 1px solid var(--line);
  color: var(--gold);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  font-family: var(--body);
  text-decoration: none;
  text-transform: uppercase;
  transition: all .15s;
}
.topbar-btn:hover { background: var(--gold); color: var(--navy); }

/* ============ TABS ============ */
.tabs-row {
  padding: 20px 24px 0;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--line-soft);
}
.tab {
  padding: 12px 16px;
  background: none;
  border: none;
  color: var(--ink-muted);
  font-family: var(--body);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  text-transform: uppercase;
  border-bottom: 2px solid transparent;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}
.tab-count {
  background: var(--gold-soft);
  color: var(--gold);
  padding: 1px 9px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  min-width: 22px;
  text-align: center;
}

/* ============ LIST ============ */
.list-section { padding: 24px; }
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.list-count {
  color: var(--ink-muted);
  font-size: 13px;
  letter-spacing: 0.5px;
}

.empty {
  text-align: center;
  padding: 80px 24px;
  color: var(--ink-muted);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty h3 {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.empty p { font-size: 14px; margin-bottom: 20px; }

.est-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 22px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 18px;
  transition: all .15s;
  cursor: pointer;
}
.est-card:hover { border-color: var(--gold); transform: translateY(-1px); }
.est-main { flex: 1; min-width: 0; }
.est-title {
  font-family: var(--display);
  font-size: 18px;
  letter-spacing: 1.5px;
  color: var(--ink);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.est-meta {
  font-size: 13px;
  color: var(--ink-muted);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.est-meta .customer { color: var(--ink-soft); font-weight: 500; }
.est-badges { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.badge {
  font-size: 10px;
  letter-spacing: 1.5px;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
.badge.new { background: var(--warn-bg); color: var(--warn); }
.badge.drafted { background: var(--gold-soft); color: var(--gold); }
.badge.sent { background: rgba(96, 165, 250, 0.15); color: #60a5fa; }
.badge.accepted { background: var(--good-bg); color: var(--good); }
.badge.declined { background: var(--bad-bg); color: var(--bad); }
.badge.invoiced { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
.badge.paid { background: var(--good-bg); color: var(--good); }

.est-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}
.est-total {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 1px;
  color: var(--gold);
}
.est-total-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--ink-muted);
  text-transform: uppercase;
}

/* ============ EDIT MODAL ============ */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  padding: 20px;
  overflow-y: auto;
}
.modal-backdrop.show { display: block; }
.modal-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  max-width: 1000px;
  margin: 20px auto;
  padding: 28px 32px;
  position: relative;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-head h2 {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--gold);
}
.modal-head .ref-sub {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  margin-top: 4px;
  text-transform: uppercase;
}
.modal-close {
  background: none;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  font-size: 24px;
  padding: 4px 10px;
}
.modal-close:hover { color: var(--gold); }

/* ============ CUSTOMER REQUEST PANEL ============ */
.cust-panel {
  background: var(--navy);
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 22px;
}
.cust-panel h3 {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 14px;
}
.cust-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  font-size: 13px;
  margin-bottom: 12px;
}
@media (max-width: 640px) { .cust-grid { grid-template-columns: 1fr; } }
.cust-field { display: flex; flex-direction: column; gap: 2px; }
.cust-field .lbl {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  text-transform: uppercase;
}
.cust-field .val { color: var(--ink); font-weight: 500; }
.cust-field a { color: var(--gold); text-decoration: none; }

.answers-list {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
}
.answer-row {
  display: flex;
  font-size: 13px;
  padding: 4px 0;
  gap: 12px;
}
.answer-row .ak {
  color: var(--ink-muted);
  text-transform: capitalize;
  min-width: 140px;
  font-size: 12px;
}
.answer-row .av { color: var(--ink-soft); flex: 1; }

.cust-photos {
  margin-top: 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.cust-photos img {
  width: 80px; height: 80px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--line-soft);
}

/* ============ AI GENERATE BUTTON ============ */
.ai-bar {
  background: linear-gradient(135deg, var(--gold-soft), transparent);
  border: 1.5px solid var(--gold);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.ai-bar-text { flex: 1; min-width: 200px; }
.ai-bar h4 {
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 4px;
}
.ai-bar p { font-size: 13px; color: var(--ink-soft); }
.btn-ai {
  padding: 12px 24px;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1.5px;
  cursor: pointer;
  font-family: var(--body);
  text-transform: uppercase;
  white-space: nowrap;
}
.btn-ai:hover:not(:disabled) { background: var(--gold-2); }
.btn-ai:disabled { opacity: 0.6; cursor: not-allowed; }
.ai-spin {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(11, 24, 40, 0.3);
  border-top-color: var(--navy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ FORM SECTIONS ============ */
.form-section { margin-bottom: 24px; }
.form-section h3 {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
@media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  text-transform: uppercase;
  font-weight: 600;
}
.field input, .field textarea, .field select {
  background: var(--navy);
  border: 1.5px solid var(--line-soft);
  color: var(--ink);
  padding: 11px 14px;
  border-radius: 8px;
  font-family: var(--body);
  font-size: 14px;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--gold);
}
.field textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

/* ============ CUSTOMER VIEW MODE - CHECKBOXES + PREVIEW ============ */
.cv-panel {
  background: var(--navy);
  border: 1.5px solid var(--gold);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 24px;
}
.cv-panel h3 {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 6px;
}
.cv-panel .cv-helper {
  font-size: 12px;
  color: var(--ink-muted);
  margin-bottom: 16px;
  line-height: 1.5;
}
.cv-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 720px) { .cv-grid { grid-template-columns: 1fr; } }

.cv-checks {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.cv-check {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--card-2);
  border: 1.5px solid var(--line-soft);
  border-radius: 10px;
  cursor: pointer;
  transition: all .15s;
}
.cv-check:hover { border-color: var(--gold); }
.cv-check.checked {
  border-color: var(--gold);
  background: var(--gold-soft);
}
.cv-check input[type="checkbox"] {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.cv-checkbox-box {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--line);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  position: relative;
}
.cv-check.checked .cv-checkbox-box {
  border-color: var(--gold);
  background: var(--gold);
}
.cv-checkbox-box::after {
  content: "✓";
  color: var(--navy);
  font-weight: 700;
  font-size: 14px;
  opacity: 0;
  transition: opacity .15s;
}
.cv-check.checked .cv-checkbox-box::after { opacity: 1; }
.cv-check-text { flex: 1; }
.cv-check-label {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 1.5px;
  color: var(--ink);
  text-transform: uppercase;
}
.cv-check.checked .cv-check-label { color: var(--gold); }
.cv-check-amount {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 2px;
}
.cv-check.checked .cv-check-amount { color: var(--ink-soft); }

/* Live preview box */
.cv-preview {
  background: #f5f0e8;
  color: #1a1a1a;
  border-radius: 10px;
  padding: 18px 20px;
  position: relative;
}
.cv-preview-label {
  position: absolute;
  top: -10px;
  left: 14px;
  background: var(--gold);
  color: var(--navy);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 3px 10px;
  border-radius: 8px;
  text-transform: uppercase;
}
.cv-preview-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 14px;
  color: #555;
  font-family: var(--body);
}
.cv-preview-row.divider {
  border-top: 1px dashed #aaa;
  margin-top: 4px;
  padding-top: 8px;
}
.cv-preview-row.preview-grand {
  font-family: var(--display);
  font-size: 20px;
  letter-spacing: 1.5px;
  color: #0d1b2a;
  padding-top: 10px;
  margin-top: 4px;
  border-top: 2px solid #0d1b2a;
}
.cv-preview-row .pv-value {
  font-weight: 600;
  color: #1a1a1a;
}
.cv-preview-row.preview-grand .pv-value {
  color: #0d1b2a;
  font-family: var(--display);
}
.cv-preview-note {
  background: #f7f9f5;
  border-left: 3px solid var(--good);
  padding: 8px 12px;
  font-size: 12px;
  color: #555;
  margin-top: 8px;
  border-radius: 0 4px 4px 0;
}
.cv-preview-note strong { color: var(--good); }
.cv-preview-empty {
  text-align: center;
  padding: 20px 0;
  color: #888;
  font-size: 13px;
  font-style: italic;
}

/* line item tables */
.lines-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-bottom: 10px;
}
.lines-table th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  text-transform: uppercase;
  padding: 8px 6px;
  font-weight: 600;
  border-bottom: 1px solid var(--line-soft);
}
.lines-table th.num, .lines-table td.num { text-align: right; }
.lines-table th.col-item { width: 50%; }
.lines-table th.col-qty { width: 12%; }
.lines-table th.col-unit { width: 12%; }
.lines-table th.col-rate { width: 14%; }
.lines-table th.col-total { width: 12%; }
.lines-table td { padding: 6px 6px; border-bottom: 1px solid var(--line-soft); }
.lines-table input {
  width: 100%;
  background: var(--navy);
  border: 1px solid transparent;
  color: var(--ink);
  padding: 8px 10px;
  border-radius: 6px;
  font-family: var(--body);
  font-size: 13px;
}
.lines-table input:focus {
  outline: none; border-color: var(--gold); background: var(--navy-2);
}
.lines-table input[readonly] { color: var(--gold); font-weight: 600; cursor: default; }
.lines-table .del-row {
  background: none;
  border: none;
  color: var(--bad);
  cursor: pointer;
  padding: 4px 8px;
  font-size: 16px;
}
.lines-table .del-row:hover { color: var(--gold); }

.btn-add-row {
  background: var(--gold-soft);
  border: 1px dashed var(--line);
  color: var(--gold);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  text-transform: uppercase;
  font-family: var(--body);
}
.btn-add-row:hover { background: var(--gold); color: var(--navy); }

/* totals (internal) */
.totals-box {
  background: var(--navy);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  padding: 16px 20px;
  margin-top: 16px;
}
.totals-box .internal-tag {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
  font-weight: 600;
}
.tot-line {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  font-size: 14px;
  color: var(--ink-soft);
}
.tot-line.grand {
  margin-top: 8px;
  padding-top: 12px;
  border-top: 2px solid var(--gold);
  color: var(--gold);
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
}
.tot-line .markup-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tot-line input.markup-input {
  width: 60px;
  padding: 4px 8px;
  background: var(--navy-2);
  border: 1px solid var(--line-soft);
  color: var(--ink);
  border-radius: 5px;
  font-size: 13px;
  text-align: right;
  font-family: var(--body);
}

/* footer actions */
.modal-actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--line-soft);
  flex-wrap: wrap;
}
.modal-actions-right { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-primary, .btn-secondary, .btn-danger {
  padding: 12px 22px;
  border: none;
  border-radius: 10px;
  font-family: var(--body);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1.5px;
  cursor: pointer;
  text-transform: uppercase;
}
.btn-primary {
  background: var(--gold);
  color: var(--navy);
}
.btn-primary:hover:not(:disabled) { background: var(--gold-2); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-soft);
}
.btn-secondary:hover { color: var(--gold); border-color: var(--gold); }
.btn-danger {
  background: transparent;
  border: 1px solid var(--bad);
  color: var(--bad);
}
.btn-danger:hover { background: var(--bad-bg); }

/* ============ INVOICE MODAL ============ */
.invoice-modal-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  max-width: 720px;
  margin: 20px auto;
  padding: 28px 32px;
  position: relative;
}
.inv-section {
  margin-bottom: 20px;
}
.inv-section-label {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 10px;
  text-transform: uppercase;
}
.inv-type-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px;
}
@media (max-width: 640px) { .inv-type-grid { grid-template-columns: 1fr 1fr; } }
.inv-type-opt {
  background: var(--card-2);
  border: 1.5px solid var(--line-soft);
  border-radius: 10px;
  padding: 12px 10px;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
}
.inv-type-opt:hover { border-color: var(--gold); }
.inv-type-opt.selected {
  border-color: var(--gold);
  background: var(--gold-soft);
}
.inv-type-opt .ito-name {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 1.5px;
  color: var(--ink);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.inv-type-opt.selected .ito-name { color: var(--gold); }
.inv-type-opt .ito-amount {
  font-size: 13px;
  color: var(--ink-muted);
  font-weight: 600;
}
.inv-type-opt.selected .ito-amount { color: var(--gold); }

.inv-amount-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
@media (max-width: 640px) { .inv-amount-row { grid-template-columns: 1fr; } }

.inv-pay-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
@media (max-width: 640px) { .inv-pay-grid { grid-template-columns: 1fr; } }
.inv-pay-opt {
  background: var(--card-2);
  border: 1.5px solid var(--line-soft);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: all .15s;
  font-size: 13px;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 10px;
}
.inv-pay-opt:hover { border-color: var(--gold); }
.inv-pay-opt.selected {
  border-color: var(--gold);
  background: var(--gold-soft);
  color: var(--gold);
}
.inv-pay-opt .ipo-icon { font-size: 16px; }

.inv-link-toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card-2);
  border: 1.5px solid var(--line-soft);
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 12px;
}
.inv-link-toggle.checked {
  border-color: var(--gold);
  background: var(--gold-soft);
}
.inv-link-toggle .ilt-box {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--line);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.inv-link-toggle.checked .ilt-box {
  border-color: var(--gold);
  background: var(--gold);
}
.inv-link-toggle .ilt-box::after {
  content: "✓";
  color: var(--navy);
  font-weight: 700;
  font-size: 14px;
  opacity: 0;
}
.inv-link-toggle.checked .ilt-box::after { opacity: 1; }
.inv-link-toggle .ilt-text { flex: 1; font-size: 13px; color: var(--ink-soft); }
.inv-link-toggle.checked .ilt-text { color: var(--gold); font-weight: 600; }

.inv-preview {
  background: #f5f0e8;
  color: #1a1a1a;
  border-radius: 10px;
  padding: 18px 22px;
  margin-top: 14px;
  font-family: var(--body);
}
.inv-preview-head {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 1.5px;
  color: #c9a84c;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.inv-preview-amount {
  font-family: var(--display);
  font-size: 32px;
  letter-spacing: 1.5px;
  color: #0d1b2a;
  margin-bottom: 4px;
}
.inv-preview-meta {
  font-size: 12px;
  color: #666;
}

/* History of invoices on this estimate */
.inv-history {
  background: var(--navy);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 16px;
}
.inv-history-label {
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--ink-muted);
  margin-bottom: 8px;
  text-transform: uppercase;
}
.inv-history-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
  color: var(--ink-soft);
  border-bottom: 1px solid var(--line-soft);
}
.inv-history-row:last-child { border-bottom: none; }
.inv-history-row .ih-number { font-weight: 600; color: var(--gold); }
.inv-history-row .ih-amount { color: var(--ink); font-weight: 600; }

/* toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--navy-2);
  color: var(--ink);
  border: 1px solid var(--gold);
  padding: 14px 22px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 200;
  box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  transition: transform 0.3s;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--bad); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">SBC · DASHBOARD</div>
    <div class="login-sub">Contractor Access</div>
    <input type="password" id="pw-input" class="login-input" placeholder="Password" autofocus>
    <button id="pw-btn" class="login-btn">UNLOCK</button>
    <div id="pw-error" class="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app">
  <div class="topbar">
    <div class="brand-mark">SANI <span class="sep">·</span><span class="sub">DASHBOARD</span></div>
    <a href="/estimate" target="_blank" class="topbar-btn">↗ Customer Form</a>
    <button class="topbar-btn" onclick="loadEstimates()">⟳ Refresh</button>
    <button class="topbar-btn" onclick="logout()">Logout</button>
  </div>

  <div class="tabs-row" id="tabs-row"></div>

  <div class="list-section">
    <div id="list-host"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="edit-modal" class="modal-backdrop">
  <div class="modal-card" id="edit-card">
    <!-- filled by JS -->
  </div>
</div>

<!-- INVOICE MODAL -->
<div id="invoice-modal" class="modal-backdrop">
  <div class="invoice-modal-card" id="invoice-card">
    <!-- filled by JS -->
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>
const DASHBOARD_PASSWORD = "L0nd0n12@";
const TABS = [
  { id: "all", label: "All" },
  { id: "new", label: "New" },
  { id: "drafted", label: "Drafts" },
  { id: "sent", label: "Sent" },
  { id: "accepted", label: "Accepted" },
  { id: "invoiced", label: "Invoiced" },
  { id: "paid", label: "Paid" },
  { id: "declined", label: "Declined" },
];

let estimates = [];
let activeTab = "all";
let currentRecord = null;

/* ===== LOGIN ===== */
document.getElementById("pw-btn").addEventListener("click", tryLogin);
document.getElementById("pw-input").addEventListener("keypress", function(e) { if (e.key === "Enter") tryLogin(); });

function tryLogin() {
  const v = document.getElementById("pw-input").value;
  if (v === DASHBOARD_PASSWORD) {
    sessionStorage.setItem("sbc-auth", "1");
    showApp();
  } else {
    document.getElementById("pw-error").textContent = "Incorrect password";
  }
}
function logout() {
  sessionStorage.removeItem("sbc-auth");
  location.reload();
}
function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").classList.add("show");
  renderTabs();
  loadEstimates();
}
if (sessionStorage.getItem("sbc-auth") === "1") showApp();

/* ===== UTILS ===== */
function fmt(n) {
  return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

/**
 * Calculate internal totals (with markup, before display filter).
 */
function calcTotal(est) {
  if (!est) return { labor: 0, mat: 0, sub: 0, markup: 0, grand: 0, laborWithMarkup: 0, matWithMarkup: 0 };
  const labor = (est.labor || []).reduce(function(s, i) { return s + (Number(i.qty) || 0) * (Number(i.rate) || 0); }, 0);
  const mat = (est.materials || []).reduce(function(s, i) { return s + (Number(i.qty) || 0) * (Number(i.rate) || 0); }, 0);
  const sub = labor + mat;
  const markupPct = Number(est.markupPct) || 0;
  const markup = sub * (markupPct / 100);
  // Pro-rate markup proportionally to labor & materials so they each carry their share
  const laborWithMarkup = labor * (1 + markupPct / 100);
  const matWithMarkup = mat * (1 + markupPct / 100);
  return { labor: labor, mat: mat, sub: sub, markup: markup, grand: sub + markup, laborWithMarkup: laborWithMarkup, matWithMarkup: matWithMarkup };
}

/**
 * Calculate CUSTOMER-FACING display amounts based on checkboxes.
 * Returns what the customer actually sees.
 */
function calcCustomerView(est) {
  const t = calcTotal(est);
  const showLabor = est.showLaborCost !== false; // default true
  const showMaterials = est.showMaterialsCost === true; // default false

  // If both unchecked, fall back to showing just the grand total (full project)
  if (!showLabor && !showMaterials) {
    return {
      showLabor: false,
      showMaterials: false,
      laborAmount: 0,
      materialsAmount: 0,
      customerTotal: t.grand,
      bothHidden: true
    };
  }

  const laborAmount = showLabor ? t.laborWithMarkup : 0;
  const materialsAmount = showMaterials ? t.matWithMarkup : 0;
  const customerTotal = laborAmount + materialsAmount;

  return {
    showLabor: showLabor,
    showMaterials: showMaterials,
    laborAmount: laborAmount,
    materialsAmount: materialsAmount,
    customerTotal: customerTotal,
    bothHidden: false
  };
}

function toast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(function() { t.classList.remove("show"); }, 3200);
}

/**
 * Migrate legacy displayMode to checkboxes
 */
function normalizeDisplayFlags(est) {
  if (!est) return;
  // If already has new flags, skip
  if (typeof est.showLaborCost === "boolean" || typeof est.showMaterialsCost === "boolean") return;
  // Migrate from old displayMode
  if (est.displayMode === "total") {
    est.showLaborCost = false;
    est.showMaterialsCost = false;
  } else if (est.displayMode === "full") {
    est.showLaborCost = true;
    est.showMaterialsCost = true;
  } else {
    // "labor" or undefined → default
    est.showLaborCost = true;
    est.showMaterialsCost = false;
  }
}

/* ===== TABS ===== */
function renderTabs() {
  const counts = { all: estimates.length };
  TABS.forEach(function(t) { if (t.id !== "all") counts[t.id] = 0; });
  estimates.forEach(function(e) { if (counts[e.status] !== undefined) counts[e.status]++; });
  document.getElementById("tabs-row").innerHTML = TABS.map(function(t) {
    return '<button class="tab ' + (activeTab === t.id ? "active" : "") + '" data-tab="' + t.id + '">' +
      '<span>' + t.label + '</span>' +
      '<span class="tab-count">' + (counts[t.id] || 0) + '</span>' +
    '</button>';
  }).join("");
  document.querySelectorAll(".tab").forEach(function(btn) {
    btn.addEventListener("click", function() {
      activeTab = btn.dataset.tab;
      renderTabs(); renderList();
    });
  });
}

/* ===== LIST ===== */
async function loadEstimates() {
  const host = document.getElementById("list-host");
  host.innerHTML = '<div class="empty"><div class="empty-icon">⟳</div><h3>Loading…</h3></div>';
  try {
    const r = await fetch("/.netlify/functions/list-estimates");
    if (!r.ok) throw new Error("Load failed");
    const data = await r.json();
    estimates = data.estimates || [];
    renderTabs();
    renderList();
  } catch (e) {
    console.error(e);
    host.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><h3>Could not load</h3><p>' + esc(e.message) + '</p><button class="topbar-btn" onclick="loadEstimates()">Retry</button></div>';
  }
}

function renderList() {
  const host = document.getElementById("list-host");
  const filtered = activeTab === "all"
    ? estimates
    : estimates.filter(function(e) { return e.status === activeTab; });

  if (filtered.length === 0) {
    host.innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">📋</div>' +
        '<h3>No estimates here yet</h3>' +
        '<p>' + (activeTab === "all" ? "Customer requests will appear here when they submit the form." : "No estimates in this status.") + '</p>' +
      '</div>';
    return;
  }

  host.innerHTML =
    '<div class="list-header">' +
      '<div class="list-count">' + filtered.length + ' ' + (filtered.length === 1 ? "estimate" : "estimates") + '</div>' +
    '</div>' +
    filtered.map(function(e) {
      const title = (e.estimate && e.estimate.projectTitle) || (e.request && e.request.service) || "Untitled";
      const cust = (e.customer && e.customer.name) || "—";
      return '<div class="est-card" data-ref="' + esc(e.ref) + '">' +
        '<div class="est-main">' +
          '<div class="est-title">' + esc(title) + '</div>' +
          '<div class="est-meta">' +
            '<span class="customer">' + esc(cust) + '</span>' +
            '<span>•</span>' +
            '<span>' + esc((e.request && e.request.service) || "") + '</span>' +
            '<span>•</span>' +
            '<span>' + fmtDate(e.submittedAt) + '</span>' +
            ((e.request && e.request.photoCount) ? '<span>•</span><span>📷 ' + e.request.photoCount + '</span>' : "") +
          '</div>' +
          '<div class="est-badges">' +
            '<span class="badge ' + e.status + '">' + e.status + '</span>' +
            '<span style="font-size:11px;color:var(--ink-muted);letter-spacing:1px">' + esc(e.ref) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="est-right">' +
          '<div class="est-total-label">Total</div>' +
          '<div class="est-total">' + fmt((e.estimate && e.estimate.grandTotal) || 0) + '</div>' +
        '</div>' +
      '</div>';
    }).join("");

  document.querySelectorAll(".est-card").forEach(function(card) {
    card.addEventListener("click", function() { openEdit(card.dataset.ref); });
  });
}

/* ===== EDIT MODAL ===== */
async function openEdit(ref) {
  const card = document.getElementById("edit-card");
  card.innerHTML = '<div class="empty"><div class="empty-icon">⟳</div><h3>Loading…</h3></div>';
  document.getElementById("edit-modal").classList.add("show");
  document.body.style.overflow = "hidden";

  try {
    const r = await fetch("/.netlify/functions/get-estimate?ref=" + encodeURIComponent(ref));
    if (!r.ok) throw new Error("Load failed");
    currentRecord = await r.json();
    // Migrate legacy displayMode to new flags
    if (!currentRecord.estimate) currentRecord.estimate = {};
    normalizeDisplayFlags(currentRecord.estimate);
    renderEdit();
  } catch (e) {
    card.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><h3>' + esc(e.message) + '</h3><button class="btn-secondary" onclick="closeEdit()">Close</button></div>';
  }
}
function closeEdit() {
  document.getElementById("edit-modal").classList.remove("show");
  document.body.style.overflow = "";
  currentRecord = null;
}

function renderEdit() {
  if (!currentRecord) return;
  const r = currentRecord;
  const cust = r.customer || {};
  const req = r.request || {};
  const est = r.estimate || {};

  const answers = req.serviceAnswers || {};
  const answersHtml = Object.entries(answers)
    .filter(function(kv) { return kv[1] && String(kv[1]).trim(); })
    .map(function(kv) {
      return '<div class="answer-row">' +
        '<div class="ak">' + esc(kv[0].replace(/-/g, " ")) + '</div>' +
        '<div class="av">' + esc(kv[1]) + '</div>' +
      '</div>';
    }).join("");

  const photosHtml = (req.photos || []).slice(0, 10).map(function(p) {
    return '<img src="' + esc(p.data) + '" alt="customer photo">';
  }).join("");

  const showAiBar = !est.scopeOfWork && (!est.labor || est.labor.length === 0);

  const laborChecked = est.showLaborCost !== false;
  const materialsChecked = est.showMaterialsCost === true;

  document.getElementById("edit-card").innerHTML =
    '<div class="modal-head">' +
      '<div>' +
        '<h2>' + esc(est.projectTitle || req.service || "ESTIMATE") + '</h2>' +
        '<div class="ref-sub">Ref ' + esc(r.ref) + ' · ' + esc((r.status || "new").toUpperCase()) + ' · Submitted ' + fmtDate(r.submittedAt) + '</div>' +
      '</div>' +
      '<button class="modal-close" onclick="closeEdit()">×</button>' +
    '</div>' +
    '<div class="cust-panel">' +
      '<h3>📥 CUSTOMER REQUEST</h3>' +
      '<div class="cust-grid">' +
        '<div class="cust-field"><span class="lbl">Name</span><span class="val">' + esc(cust.name) + '</span></div>' +
        '<div class="cust-field"><span class="lbl">Phone</span><a href="tel:' + esc(cust.phone) + '" class="val">' + esc(cust.phone) + '</a></div>' +
        '<div class="cust-field"><span class="lbl">Email</span><a href="mailto:' + esc(cust.email) + '" class="val">' + esc(cust.email) + '</a></div>' +
        '<div class="cust-field"><span class="lbl">Address</span><span class="val">' + esc(cust.address || "—") + '</span></div>' +
        '<div class="cust-field"><span class="lbl">Service</span><span class="val">' + esc(req.service || "—") + '</span></div>' +
        '<div class="cust-field"><span class="lbl">Property</span><span class="val">' + esc(req.propertyType || "—") + '</span></div>' +
        '<div class="cust-field"><span class="lbl">Timeline</span><span class="val">' + esc(req.timeline || "—") + '</span></div>' +
        '<div class="cust-field"><span class="lbl">Photos</span><span class="val">' + (req.photoCount || 0) + '</span></div>' +
      '</div>' +
      (req.description ? '<div class="cust-field" style="margin-top:8px"><span class="lbl">Description</span><span class="val" style="font-size:13px;line-height:1.6;white-space:pre-wrap">' + esc(req.description) + '</span></div>' : "") +
      (answersHtml ? '<div class="answers-list">' + answersHtml + '</div>' : "") +
      (photosHtml ? '<div class="cust-photos">' + photosHtml + '</div>' : "") +
    '</div>' +
    (showAiBar ?
      '<div class="ai-bar">' +
        '<div class="ai-bar-text">' +
          '<h4>✨ AI ESTIMATE GENERATOR</h4>' +
          '<p>Let Claude draft the scope of work, labor, and materials based on the customer answers. You can review and edit everything before sending.</p>' +
        '</div>' +
        '<button class="btn-ai" id="gen-btn" onclick="generateAI()">Generate Estimate</button>' +
      '</div>'
      :
      '<div class="ai-bar">' +
        '<div class="ai-bar-text">' +
          '<h4>↻ REGENERATE</h4>' +
          '<p>Want a different draft? Re-run the AI estimator. Your current work will be replaced.</p>' +
        '</div>' +
        '<button class="btn-ai" id="gen-btn" onclick="generateAI(true)">Regenerate with AI</button>' +
      '</div>'
    ) +
    '<div class="form-section">' +
      '<h3>📋 PROJECT</h3>' +
      '<div class="field" style="margin-bottom:12px">' +
        '<label>Project Title</label>' +
        '<input type="text" id="f-title" value="' + esc(est.projectTitle || "") + '" placeholder="e.g. Master Bathroom Renovation — Brooklyn">' +
      '</div>' +
      '<div class="field" style="margin-bottom:12px">' +
        '<label>Summary (shown to customer)</label>' +
        '<textarea id="f-summary" placeholder="2-3 sentences describing the project">' + esc(est.summary || "") + '</textarea>' +
      '</div>' +
      '<div class="field">' +
        '<label>Scope of Work (Tip: Use CATEGORY: headers + bullets for sectioned display)</label>' +
        '<textarea id="f-scope" rows="8" placeholder="DEMOLITION:&#10;- Remove old fixtures&#10;- Haul debris&#10;&#10;INSTALLATION:&#10;- Install new tile&#10;- Mount vanity">' + esc(est.scopeOfWork || "") + '</textarea>' +
      '</div>' +
    '</div>' +
    '<div class="form-section">' +
      '<h3>🔨 LABOR <button class="btn-add-row" onclick="addLine(\'labor\')">+ Add Item</button></h3>' +
      '<table class="lines-table">' +
        '<thead><tr>' +
          '<th class="col-item">Item</th>' +
          '<th class="col-qty num">Qty</th>' +
          '<th class="col-unit">Unit</th>' +
          '<th class="col-rate num">Rate</th>' +
          '<th class="col-total num">Total</th>' +
          '<th style="width:40px"></th>' +
        '</tr></thead>' +
        '<tbody id="labor-body"></tbody>' +
      '</table>' +
    '</div>' +
    '<div class="form-section">' +
      '<h3>🧰 MATERIALS <button class="btn-add-row" onclick="addLine(\'materials\')">+ Add Item</button></h3>' +
      '<table class="lines-table">' +
        '<thead><tr>' +
          '<th class="col-item">Item</th>' +
          '<th class="col-qty num">Qty</th>' +
          '<th class="col-unit">Unit</th>' +
          '<th class="col-rate num">Rate</th>' +
          '<th class="col-total num">Total</th>' +
          '<th style="width:40px"></th>' +
        '</tr></thead>' +
        '<tbody id="materials-body"></tbody>' +

/* ===== CHECKBOX TOGGLE ===== */
function toggleCv(kind) {
  if (!currentRecord || !currentRecord.estimate) return;
  if (kind === "labor") {
    currentRecord.estimate.showLaborCost = !(currentRecord.estimate.showLaborCost !== false);
  } else if (kind === "materials") {
    currentRecord.estimate.showMaterialsCost = !(currentRecord.estimate.showMaterialsCost === true);
  }
  // Update visual state
  const el = document.querySelector('.cv-check[data-kind="' + kind + '"]');
  const checkbox = document.getElementById("cv-" + kind);
  const isChecked = kind === "labor"
    ? currentRecord.estimate.showLaborCost !== false
    : currentRecord.estimate.showMaterialsCost === true;
  el.classList.toggle("checked", isChecked);
  if (checkbox) checkbox.checked = isChecked;
  updateCvPreview();
}

function updateCvPreview() {
  if (!currentRecord || !currentRecord.estimate) return;
  const t = calcTotal(currentRecord.estimate);
  const cv = calcCustomerView(currentRecord.estimate);

  // Update amount labels next to checkboxes
  const laborAmtEl = document.getElementById("cv-labor-amt");
  const matAmtEl = document.getElementById("cv-materials-amt");
  if (laborAmtEl) laborAmtEl.textContent = "Will show: " + fmt(t.laborWithMarkup);
  if (matAmtEl) matAmtEl.textContent = "Will show: " + fmt(t.matWithMarkup);

  // Build preview body
  const body = document.getElementById("cv-preview-body");
  if (!body) return;

  if (cv.bothHidden) {
    // Just total, no breakdown
    body.innerHTML =
      '<div style="text-align:center;padding:18px 0">' +
        '<div style="font-size:11px;letter-spacing:2px;color:#888;text-transform:uppercase;margin-bottom:4px">Your Estimate</div>' +
        '<div style="font-family:var(--display);font-size:28px;color:#0d1b2a;letter-spacing:1.5px">' + fmt(cv.customerTotal) + '</div>' +
      '</div>';
    return;
  }

  let html = "";
  if (cv.showLabor) {
    html += '<div class="cv-preview-row"><span>Labor</span><span class="pv-value">' + fmt(cv.laborAmount) + '</span></div>';
  }
  if (cv.showMaterials) {
    html += '<div class="cv-preview-row"><span>Materials</span><span class="pv-value">' + fmt(cv.materialsAmount) + '</span></div>';
  }
  html += '<div class="cv-preview-row preview-grand"><span>TOTAL</span><span class="pv-value">' + fmt(cv.customerTotal) + '</span></div>';

  // "All materials included" note when labor shown but materials hidden AND materials exist
  if (cv.showLabor && !cv.showMaterials && t.mat > 0) {
    html += '<div class="cv-preview-note"><strong>✓ All materials included</strong> in the total price.</div>';
  }
  // Note when materials shown but labor hidden
  if (!cv.showLabor && cv.showMaterials && t.labor > 0) {
    html += '<div class="cv-preview-note"><strong>✓ Labor included</strong> in the total price.</div>';
  }
  body.innerHTML = html;
}

/* ===== LINE ITEMS ===== */
function renderLines(kind, items) {
  const body = document.getElementById(kind + "-body");
  if (!items.length) {
    body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--ink-muted);font-size:13px;padding:18px">No ' + kind + ' yet. Click "+ Add Item" or use AI to generate.</td></tr>';
    return;
  }
  body.innerHTML = items.map(function(it, idx) {
    return '<tr data-idx="' + idx + '">' +
      '<td><input type="text" class="line-item" value="' + esc(it.item || "") + '" placeholder="Description"></td>' +
      '<td class="num"><input type="number" class="line-qty" value="' + esc(it.qty == null ? "" : it.qty) + '" step="0.5" min="0" style="text-align:right"></td>' +
      '<td><input type="text" class="line-unit" value="' + esc(it.unit || "") + '" placeholder="hrs/ea/sqft" style="text-align:center"></td>' +
      '<td class="num"><input type="number" class="line-rate" value="' + esc(it.rate == null ? "" : it.rate) + '" step="0.01" min="0" style="text-align:right"></td>' +
      '<td class="num"><input type="text" class="line-total" value="' + fmt((Number(it.qty) || 0) * (Number(it.rate) || 0)) + '" readonly></td>' +
      '<td><button class="del-row" onclick="deleteLine(\'' + kind + '\', ' + idx + ')">×</button></td>' +
    '</tr>';
  }).join("");
}
function addLine(kind) {
  const arr = currentRecord.estimate[kind] || [];
  arr.push({ item: "", qty: 1, unit: kind === "labor" ? "hrs" : "ea", rate: 0 });
  currentRecord.estimate[kind] = arr;
  renderLines(kind, arr);
  attachLineListeners();
  recalc();
}
function deleteLine(kind, idx) {
  currentRecord.estimate[kind].splice(idx, 1);
  renderLines(kind, currentRecord.estimate[kind]);
  attachLineListeners();
  recalc();
}
function attachLineListeners() {
  document.querySelectorAll("#labor-body tr, #materials-body tr").forEach(function(row) {
    row.querySelectorAll("input").forEach(function(inp) {
      inp.addEventListener("input", function() {
        syncLines();
        recalc();
      });
    });
  });
}
function syncLines() {
  ["labor", "materials"].forEach(function(kind) {
    const rows = document.querySelectorAll("#" + kind + "-body tr[data-idx]");
    const items = [];
    rows.forEach(function(row) {
      items.push({
        item: row.querySelector(".line-item").value,
        qty: parseFloat(row.querySelector(".line-qty").value) || 0,
        unit: row.querySelector(".line-unit").value,
        rate: parseFloat(row.querySelector(".line-rate").value) || 0,
      });
    });
    currentRecord.estimate[kind] = items;
  });
}
function recalc() {
  syncLines();
  currentRecord.estimate.markupPct = parseFloat(document.getElementById("f-markup").value) || 0;
  const t = calcTotal(currentRecord.estimate);
  document.getElementById("tot-labor").textContent = fmt(t.labor);
  document.getElementById("tot-mat").textContent = fmt(t.mat);
  document.getElementById("tot-sub").textContent = fmt(t.sub);
  document.getElementById("tot-markup").textContent = fmt(t.markup);
  document.getElementById("tot-grand").textContent = fmt(t.grand);
  document.querySelectorAll("#labor-body tr, #materials-body tr").forEach(function(row) {
    const totEl = row.querySelector(".line-total");
    if (!totEl) return;
    const q = parseFloat(row.querySelector(".line-qty").value) || 0;
    const r = parseFloat(row.querySelector(".line-rate").value) || 0;
    totEl.value = fmt(q * r);
  });
  updateCvPreview();
}

/* ===== AI GENERATE ===== */
async function generateAI(isRegenerate) {
  if (isRegenerate && !confirm("This will replace the current scope and line items with a new AI draft. Continue?")) return;
  const btn = document.getElementById("gen-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="ai-spin"></span> Generating…';

  try {
    const r = await fetch("/.netlify/functions/generate-estimate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ref: currentRecord.ref }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "AI generation failed");

    // Preserve checkbox preferences
    const prevShowLabor = currentRecord.estimate && currentRecord.estimate.showLaborCost;
    const prevShowMat = currentRecord.estimate && currentRecord.estimate.showMaterialsCost;
    currentRecord.estimate = data.estimate;
    if (typeof prevShowLabor === "boolean") currentRecord.estimate.showLaborCost = prevShowLabor;
    if (typeof prevShowMat === "boolean") currentRecord.estimate.showMaterialsCost = prevShowMat;
    normalizeDisplayFlags(currentRecord.estimate);
    currentRecord.status = data.status;
    renderEdit();
    toast("✓ AI estimate generated");
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = "Generate Estimate";
    toast("AI generation failed: " + e.message, true);
  }
}

/* ===== SAVE / SEND / DELETE ===== */
function gatherForm() {
  syncLines();
  return {
    projectTitle: document.getElementById("f-title").value.trim(),
    summary: document.getElementById("f-summary").value.trim(),
    scopeOfWork: document.getElementById("f-scope").value.trim(),
    timelineText: document.getElementById("f-timeline").value.trim(),
    notes: document.getElementById("f-notes").value.trim(),
    markupPct: parseFloat(document.getElementById("f-markup").value) || 0,
    showLaborCost: currentRecord.estimate.showLaborCost !== false,
    showMaterialsCost: currentRecord.estimate.showMaterialsCost === true,
    labor: currentRecord.estimate.labor || [],
    materials: currentRecord.estimate.materials || [],
  };
}

async function saveDraft() {
  const est = gatherForm();
  try {
    const r = await fetch("/.netlify/functions/save-estimate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ref: currentRecord.ref, estimate: est, status: currentRecord.status === "new" ? "drafted" : currentRecord.status }),
    });
    if (!r.ok) throw new Error("Save failed");
    toast("✓ Draft saved");
    currentRecord.estimate = est;
    await loadEstimates();
  } catch (e) {
    toast("Save failed: " + e.message, true);
  }
}

async function sendToCustomer() {
  const est = gatherForm();
  if (!est.projectTitle) { toast("Add a project title first", true); return; }
  const cv = calcCustomerView(est);
  if (cv.customerTotal <= 0) { toast("Add labor or materials with prices first", true); return; }

  // Build confirm message showing what customer will see
  let visibility;
  if (est.showLaborCost && est.showMaterialsCost) {
    visibility = "Labor + Materials (split into both)";
  } else if (est.showLaborCost) {
    visibility = "Labor only";
  } else if (est.showMaterialsCost) {
    visibility = "Materials only";
  } else {
    visibility = "Total only (no breakdown)";
  }

  if (!confirm("Send estimate of " + fmt(cv.customerTotal) + " to " + currentRecord.customer.name + "?\n\nCustomer will see: " + visibility)) return;

  try {
    let r = await fetch("/.netlify/functions/save-estimate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ref: currentRecord.ref, estimate: est }),
    });
    if (!r.ok) throw new Error("Save before send failed");

    r = await fetch("/.netlify/functions/send-quote", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ref: currentRecord.ref }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Send failed");
    toast(data.forwardedToContractor ? "✓ Sent to your inbox to forward (Resend domain not verified yet)" : "✓ Quote sent to customer");
    closeEdit();
    await loadEstimates();
  } catch (e) {
    toast("Send failed: " + e.message, true);
  }
}

async function deleteEstimate() {
  if (!confirm("Delete estimate " + currentRecord.ref + "? This cannot be undone.")) return;
  try {
    const r = await fetch("/.netlify/functions/delete-estimate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ref: currentRecord.ref }),
    });
    if (!r.ok) throw new Error("Delete failed");
    toast("Deleted");
    closeEdit();
    await loadEstimates();
  } catch (e) {
    toast("Delete failed: " + e.message, true);
  }
}

function openInvoiceModal() {
  if (!currentRecord) return;
  const est = gatherForm();
  const t = calcTotal(est);
  // Save the form first so the invoice can use latest totals
  syncLines();
  
  // Calculate prior invoiced amount
  const prior = (currentRecord.invoices || []).reduce(function(s, inv) { return s + (Number(inv.amount) || 0); }, 0);
  const remaining = Math.max(0, t.grand - prior);

  // Default state
  invoiceState = {
    type: "full",
    amount: t.grand,
    dueDate: "",
    memo: "",
    paymentMethod: "zelle",
    paymentDetails: "Zelle: (332) 277-0990\nAccount name: Sani Building Corp",
    paymentLink: "",
    includePaymentLink: false,
  };

  renderInvoiceModal(t, prior, remaining);
  document.getElementById("invoice-modal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeInvoiceModal() {
  document.getElementById("invoice-modal").classList.remove("show");
  // Only close body overflow if edit modal isn't also showing
  if (!document.getElementById("edit-modal").classList.contains("show")) {
    document.body.style.overflow = "";
  }
}

function buildPayOpt(method, icon, label) {
  const sel = invoiceState.paymentMethod === method ? " selected" : "";
  return '<div class="inv-pay-opt' + sel + '" onclick="setPaymentMethod(\'' + method + '\')">' +
    '<span class="ipo-icon">' + icon + '</span>' +
    '<span>' + label + '</span>' +
  '</div>';
}

function setInvoiceType(type) {
  invoiceState.type = type;
  // Recalculate amount based on type
  const est = currentRecord.estimate || {};
  const t = calcTotal(est);
  const prior = (currentRecord.invoices || []).reduce(function(s, inv) { return s + (Number(inv.amount) || 0); }, 0);
  if (type === "deposit") {
    invoiceState.amount = Math.round(t.grand * 0.5 * 100) / 100;
  } else if (type === "final") {
    invoiceState.amount = Math.max(0, Math.round((t.grand - prior) * 100) / 100);
  } else if (type === "full") {
    invoiceState.amount = Math.round(t.grand * 100) / 100;
  }
  // For "custom", don't change amount
  renderInvoiceModal(t, prior, Math.max(0, t.grand - prior));
}

function setPaymentMethod(method) {
  invoiceState.paymentMethod = method;
  // Auto-fill payment details based on method
  const defaults = {
    zelle: "Zelle: (332) 277-0990\nAccount name: Sani Building Corp",
    bank: "Bank Transfer:\nBank name: [your bank]\nRouting: xxx\nAccount: xxx",
    cash: "Cash payment accepted in person.\nPlease call (332) 277-0990 to schedule.",
    check: "Make check payable to:\nSani Building Corp\nMail to: 2954 Brighton 12th Street, Brooklyn, NY 11235",
  };
  if (defaults[method]) {
    invoiceState.paymentDetails = defaults[method];
  }
  const est = currentRecord.estimate || {};
  const t = calcTotal(est);
  const prior = (currentRecord.invoices || []).reduce(function(s, inv) { return s + (Number(inv.amount) || 0); }, 0);
  renderInvoiceModal(t, prior, Math.max(0, t.grand - prior));
}

function togglePaymentLink() {
  invoiceState.includePaymentLink = !invoiceState.includePaymentLink;
  const est = currentRecord.estimate || {};
  const t = calcTotal(est);
  const prior = (currentRecord.invoices || []).reduce(function(s, inv) { return s + (Number(inv.amount) || 0); }, 0);
  renderInvoiceModal(t, prior, Math.max(0, t.grand - prior));
}

function updateInvoiceState() {
  invoiceState.amount = parseFloat(document.getElementById("inv-amount").value) || 0;
  invoiceState.dueDate = document.getElementById("inv-duedate").value;
  invoiceState.memo = document.getElementById("inv-memo").value;
  invoiceState.paymentDetails = document.getElementById("inv-paydetails").value;
  const linkField = document.getElementById("inv-paylink");
  if (linkField) invoiceState.paymentLink = linkField.value;
  // Update preview live
  document.getElementById("inv-preview-amount").textContent = fmt(invoiceState.amount);
  const dueText = invoiceState.dueDate
    ? "Due " + new Date(invoiceState.dueDate).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })
    : "No due date set";
  document.getElementById("inv-preview-meta").textContent = invoiceState.type.charAt(0).toUpperCase() + invoiceState.type.slice(1) + " invoice · " + dueText;
}

async function submitInvoice() {
  // Validate
  if (!invoiceState.amount || invoiceState.amount <= 0) {
    toast("Please enter a valid amount", true);
    return;
  }
  if (invoiceState.includePaymentLink && (!invoiceState.paymentLink || !invoiceState.paymentLink.trim())) {
    toast("Please enter a payment link URL or uncheck the option", true);
    return;
  }

  const typeLabel = invoiceState.type.charAt(0).toUpperCase() + invoiceState.type.slice(1);
  if (!confirm("Send " + typeLabel + " invoice of " + fmt(invoiceState.amount) + " to " + (currentRecord.customer.name || "customer") + "?")) return;

  const btn = document.getElementById("inv-send-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="ai-spin"></span> Sending…';

  try {
    const r = await fetch("/.netlify/functions/send-invoice", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ref: currentRecord.ref,
        invoiceType: invoiceState.type,
        amount: invoiceState.amount,
        dueDate: invoiceState.dueDate,
        memo: invoiceState.memo,
        paymentMethod: invoiceState.paymentMethod,
        paymentDetails: invoiceState.paymentDetails,
        paymentLink: invoiceState.paymentLink,
        includePaymentLink: invoiceState.includePaymentLink,
      }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Send failed");
    toast(data.forwardedToContractor ? "✓ Invoice sent to your inbox to forward" : "✓ Invoice sent to customer (" + data.invoiceNumber + ")");
    closeInvoiceModal();
    // Refresh the estimate to show updated status + invoice history
    await loadEstimates();
    closeEdit();
  } catch (e) {
    console.error(e);
    toast("Send failed: " + e.message, true);
    btn.disabled = false;
    btn.textContent = "📨 Send Invoice";
  }
}

document.getElementById("invoice-modal").addEventListener("click", function(e) {
  if (e.target.id === "invoice-modal") closeInvoiceModal();
});

document.getElementById("edit-modal").addEventListener("click", function(e) {
  if (e.target.id === "edit-modal") closeEdit();
});
</script>
</body>
</html>
