<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Sani Building Corp</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SBC Dashboard">
<meta name="theme-color" content="#0f1f33">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0b1828;
  --navy-2: #122740;
  --navy-3: #1a3354;
  --gold: #d4b572;
  --gold-2: #c9a84c;
  --gold-soft: rgba(212, 181, 114, 0.12);
  --ink: #e8edf5;
  --ink-soft: #b8c4d6;
  --ink-muted: #7a8aa3;
  --line: rgba(212, 181, 114, 0.18);
  --line-soft: rgba(255,255,255,0.06);
  --bg: #06101e;
  --card: #0f1f33;
  --card-2: #142a44;
  --good: #4ade80;
  --good-bg: rgba(74, 222, 128, 0.12);
  --bad: #f87171;
  --bad-bg: rgba(248, 113, 113, 0.12);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.12);
  --display: 'Bebas Neue', Arial, sans-serif;
  --body: 'Inter', -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ============ LOGIN GATE ============ */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(circle at 30% 20%, var(--navy-2) 0%, var(--bg) 60%);
}
.login-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 44px 36px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.login-logo {
  font-family: var(--display);
  font-size: 28px;
  letter-spacing: 5px;
  color: var(--gold);
  margin-bottom: 6px;
}
.login-sub {
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--ink-muted);
  margin-bottom: 32px;
  text-transform: uppercase;
}
.login-input {
  width: 100%;
  padding: 14px 16px;
  background: var(--navy);
  border: 1.5px solid var(--line);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  border-radius: 10px;
  margin-bottom: 14px;
}
.login-input:focus { outline: none; border-color: var(--gold); }
.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 1.5px;
  cursor: pointer;
  font-family: var(--body);
  text-transform: uppercase;
}
.login-error { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ============ HEADER ============ */
.app { display: none; }
.app.show { display: block; }

.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand-mark {
  font-family: var(--display);
  font-size: 18px;
  letter-spacing: 3px;
  color: var(--gold);
  flex: 1;
}
.brand-mark .sep { opacity: 0.4; margin: 0 8px; }
.brand-mark .sub { color: var(--ink-soft); letter-spacing: 4px; }

.topbar-btn {
  padding: 9px 16px;
  background: var(--gold-soft);
  border: 1px solid var(--line);
  color: var(--gold);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  font-family: var(--body);
  text-decoration: none;
  text-transform: uppercase;
  transition: all .15s;
}
.topbar-btn:hover { background: var(--gold); color: var(--navy); }

/* ============ TABS ============ */
.tabs-row {
  padding: 0 16px;
  display: flex;
  gap: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--line-soft);
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--gold) transparent;
}
.tabs-row::-webkit-scrollbar { height: 3px; }
.tabs-row::-webkit-scrollbar-track { background: transparent; }
.tabs-row::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
.tab {
  padding: 12px 12px;
  background: none;
  border: none;
  color: var(--ink-muted);
  font-family: var(--body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  text-transform: uppercase;
  border-bottom: 2px solid transparent;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}
.tab-count {
  background: var(--gold-soft);
  color: var(--gold);
  padding: 1px 9px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  min-width: 22px;
  text-align: center;
}

/* ============ LIST ============ */
.list-section { padding: 24px; }
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.list-count {
  color: var(--ink-muted);
  font-size: 13px;
  letter-spacing: 0.5px;
}

.empty {
  text-align: center;
  padding: 80px 24px;
  color: var(--ink-muted);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty h3 {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.empty p { font-size: 14px; margin-bottom: 20px; }

.est-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 22px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 18px;
  transition: all .15s;
  cursor: pointer;
}
.est-card:hover { border-color: var(--gold); transform: translateY(-1px); }
.est-main { flex: 1; min-width: 0; }
.est-title {
  font-family: var(--display);
  font-size: 18px;
  letter-spacing: 1.5px;
  color: var(--ink);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.est-meta {
  font-size: 13px;
  color: var(--ink-muted);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.est-meta .customer { color: var(--ink-soft); font-weight: 500; }
.est-badges { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.badge {
  font-size: 10px;
  letter-spacing: 1.5px;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
.badge.new { background: var(--warn-bg); color: var(--warn); }
.badge.drafted { background: var(--gold-soft); color: var(--gold); }
.badge.sent { background: rgba(96, 165, 250, 0.15); color: #60a5fa; }
.badge.accepted { background: var(--good-bg); color: var(--good); }
.badge.declined { background: var(--bad-bg); color: var(--bad); }
.badge.invoiced { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
.badge.paid { background: var(--good-bg); color: var(--good); }

/* ============ HANDYMAN BOOKING CARDS ============ */
.handyman-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: all .2s;
}
.handyman-card:hover {
  border-color: var(--gold);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.handyman-card .h-icon {
  font-size: 36px;
  flex-shrink: 0;
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card-2);
  border-radius: 12px;
}
.handyman-card .h-main {
  flex: 1;
  min-width: 0;
}
.handyman-card .h-title {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.handyman-card .h-meta {
  font-size: 12px;
  color: var(--ink-muted);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.handyman-card .h-badges {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.handyman-card .h-right {
  text-align: right;
  flex-shrink: 0;
}
.handyman-card .h-total {
  font-family: var(--display);
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
}
.handyman-card .h-time {
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 2px;
}

/* Confidence badges */
.badge.h-ready { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
.badge.h-maybe { background: rgba(212, 160, 23, 0.15); color: #d4a017; border: 1px solid rgba(212,160,23,0.3); }
.badge.h-inspection { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }
.badge.h-new { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
.badge.h-confirmed { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }
.badge.h-in-progress { background: rgba(212, 160, 23, 0.15); color: #d4a017; }
.badge.h-completed { background: var(--good-bg); color: var(--good); }
.badge.h-cancelled { background: rgba(120, 120, 120, 0.15); color: #888; }
.badge.h-urgency-today { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }
.badge.h-urgency-this-week { background: rgba(212, 160, 23, 0.15); color: #d4a017; }

/* ============ HANDYMAN DETAIL MODAL ============ */
.h-modal-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  max-width: 880px;
  margin: 20px auto;
  padding: 28px 32px;
  position: relative;
}
.h-section {
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.h-section:last-child { border-bottom: none; }
.h-section-title {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 12px;
  text-transform: uppercase;
}

.h-customer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 640px) { .h-customer-grid { grid-template-columns: 1fr; } }
.h-customer-grid .field-mini {
  background: var(--card-2);
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line-soft);
}
.h-customer-grid .field-mini .fl {
  font-size: 11px;
  color: var(--ink-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.h-customer-grid .field-mini .fv {
  font-size: 14px;
  color: var(--ink);
  font-weight: 600;
  word-break: break-word;
}
.h-customer-grid .field-mini .fv a {
  color: var(--gold);
  text-decoration: none;
}

/* Customer estimate box */
.h-estimate-box {
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  border: 1px solid var(--gold-soft);
  border-radius: 12px;
  padding: 18px 20px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
@media (max-width: 640px) { .h-estimate-box { grid-template-columns: 1fr 1fr; } }
.h-est-cell {
  text-align: center;
}
.h-est-cell .label {
  font-size: 10px;
  color: var(--ink-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.h-est-cell .value {
  font-family: var(--display);
  font-size: 18px;
  color: var(--gold);
  font-weight: 700;
}

/* Internal brief - the IMPORTANT one */
.h-brief-box {
  background: linear-gradient(135deg, #fff8e8, #fef3e2);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 20px;
}
.h-brief-header {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--gold-2);
  margin-bottom: 14px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.h-brief-summary {
  background: #fff;
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 14px;
  font-size: 13.5px;
  color: #333;
  line-height: 1.6;
  border-left: 3px solid var(--gold);
}
.h-checklist-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 640px) { .h-checklist-grid { grid-template-columns: 1fr; } }
.h-checklist-section {
  background: #fff;
  border-radius: 8px;
  padding: 14px;
  border: 1px solid var(--line);
}
.h-checklist-label {
  font-size: 12px;
  color: var(--gold-2);
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 10px;
  text-transform: uppercase;
}
.h-checklist-item {
  font-size: 13px;
  color: #333;
  padding: 4px 0;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.h-checklist-item::before {
  content: '☐';
  color: var(--gold);
  font-weight: 700;
  flex-shrink: 0;
}
.h-checklist-empty {
  font-size: 12px;
  color: var(--ink-muted);
  font-style: italic;
}

.h-special-order {
  background: rgba(231, 76, 60, 0.08);
  border: 1px solid #e74c3c;
  border-radius: 8px;
  padding: 14px 16px;
  margin-top: 14px;
}
.h-special-order .so-title {
  font-size: 12px;
  color: #c0392b;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.h-special-order ul {
  list-style: none;
  padding: 0;
}
.h-special-order li {
  font-size: 13px;
  color: #555;
  padding: 3px 0 3px 16px;
  position: relative;
}
.h-special-order li::before {
  content: '🚨';
  position: absolute;
  left: 0;
}

.h-warnings {
  background: #fef3e0;
  border: 1px solid var(--warn);
  border-radius: 8px;
  padding: 14px 16px;
  margin-top: 14px;
}
.h-warnings .w-title {
  font-size: 12px;
  color: #a07a14;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.h-warnings ul {
  list-style: none;
  padding: 0;
}
.h-warnings li {
  font-size: 13px;
  color: #555;
  padding: 3px 0 3px 18px;
  position: relative;
  line-height: 1.5;
}
.h-warnings li::before {
  content: '⚠';
  position: absolute;
  left: 0;
  color: var(--warn);
}

/* Photos */
.h-photos-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
@media (max-width: 640px) { .h-photos-grid { grid-template-columns: repeat(3, 1fr); } }
.h-photo {
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  background: #000;
  transition: transform 0.2s;
}
.h-photo:hover { transform: scale(1.05); }
.h-photo img { width: 100%; height: 100%; object-fit: cover; }

/* Status selector */
.h-status-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.h-status-btn {
  padding: 10px 16px;
  background: var(--card-2);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--ink-soft);
  font-family: inherit;
  text-transform: uppercase;
}
.h-status-btn:hover { border-color: var(--gold); }
.h-status-btn.active {
  background: var(--gold-soft);
  border-color: var(--gold);
  color: var(--gold);
}

/* Customer answers display */
.h-answers {
  background: var(--card-2);
  border-radius: 10px;
  padding: 14px 16px;
}
.h-answer-row {
  display: flex;
  gap: 12px;
  padding: 6px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.h-answer-row:last-child { border-bottom: none; }
.h-answer-row .ar-key {
  color: var(--ink-muted);
  min-width: 140px;
  flex-shrink: 0;
}
.h-answer-row .ar-val { color: var(--ink); font-weight: 500; }

/* Description box */
.h-description {
  background: var(--card-2);
  border-left: 3px solid var(--gold);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.6;
  white-space: pre-wrap;
}

/* Confidence display */
.h-confidence {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.h-confidence-ring {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 4px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 18px;
  font-weight: 700;
  flex-shrink: 0;
}
.h-confidence-ring.ready { border-color: var(--good); color: var(--good); }
.h-confidence-ring.maybe { border-color: var(--warn); color: var(--warn); }
.h-confidence-ring.inspection { border-color: var(--bad); color: var(--bad); }
.h-confidence-text {
  flex: 1;
}
.h-confidence-label {
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: 1px;
  font-weight: 700;
  text-transform: uppercase;
}
.h-confidence-reasoning {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 4px;
  font-style: italic;
}

/* ════════════════════════════════════════════════════════════════════
   NEW DISPATCH-OPTIMIZED LAYOUT
   ════════════════════════════════════════════════════════════════════ */

/* TOP ALERT BAR */
.h-alert-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 20px;
  background: linear-gradient(135deg, #fff8e8, #fef3e2);
  border: 1px solid var(--gold);
  border-radius: 12px;
  margin-bottom: 20px;
}
.h-alert-left {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
}
.h-alert-conf-circle {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 3px solid;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 18px;
  font-weight: 700;
  flex-shrink: 0;
}
.h-alert-conf-circle.ready { border-color: #27ae60; color: #27ae60; background:#fff; }
.h-alert-conf-circle.maybe { border-color: #d4a017; color: #d4a017; background:#fff; }
.h-alert-conf-circle.inspection { border-color: #e74c3c; color: #e74c3c; background:#fff; }
.h-alert-text-label {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.h-alert-text-label.ready { color: #27ae60; }
.h-alert-text-label.maybe { color: #b8930a; }
.h-alert-text-label.inspection { color: #c0392b; }
.h-alert-text-sub {
  font-size: 12px;
  color: #555;
  margin-top: 3px;
}
.h-alert-urgency {
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  flex-shrink: 0;
}
.h-alert-urgency.today {
  background: #e74c3c;
  color: #fff;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}
.h-alert-urgency.this-week { background: #d4a017; color: #fff; }

/* HERO GRID - Photos + AI Analysis side by side */
.h-hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 18px;
}
@media (max-width: 720px) { .h-hero-grid { grid-template-columns: 1fr; } }

.h-hero-block {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
}
.h-hero-block-title {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.h-hero-block-count {
  font-size: 11px;
  background: var(--gold);
  color: var(--navy);
  padding: 2px 8px;
  border-radius: 10px;

}

/* Photo grid in hero */
.h-hero-photos {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.h-hero-photo {

  border-radius: 8px;

  cursor: pointer;
  background: #000;

  border: 1px solid var(--line);
}
.h-hero-photo:hover { transform: scale(1.03); border-color: var(--gold); }
.h-hero-photo img { width: 100%; height: 100%; object-fit: cover; }
.h-hero-photos-empty {
  background: var(--card);
  border: 2px dashed var(--line);
  border-radius: 8px;
  padding: 30px;
  text-align: center;
  color: var(--ink-muted);
  font-size: 12px;
}

/* AI Analysis text */
.h-ai-analysis {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.65;
  white-space: pre-wrap;
}

/* CHECKLIST GRID - Tools + Materials side by side */
.h-action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 18px;
}
@media (max-width: 720px) { .h-action-grid { grid-template-columns: 1fr; } }

.h-action-block {
  background: linear-gradient(135deg, #fff, #fffdf8);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 16px 18px;
}
.h-action-block-title {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 1.5px;
  color: var(--gold-2);
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.h-action-count {
  font-size: 11px;
  background: var(--gold-soft);
  color: var(--gold-2);
  padding: 2px 8px;
  border-radius: 10px;
}
.h-action-item {
  font-size: 14px;
  color: #333;
  padding: 7px 0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid var(--line-soft);
}
.h-action-item:last-child { border-bottom: none; }
.h-action-item::before {
  content: '☐';
  color: var(--gold);
  font-size: 16px;
  flex-shrink: 0;
  line-height: 1.3;
}
.h-action-empty {
  font-size: 13px;
  color: var(--ink-muted);
  font-style: italic;
  padding: 10px 0;
  text-align: center;
}

/* CUSTOMER COMPACT ROW */
.h-customer-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  background: var(--card-2);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 16px;
  border: 1px solid var(--line);
}
@media (max-width: 720px) { .h-customer-row { grid-template-columns: 1fr 1fr; } }
.h-cust-cell {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.h-cust-cell .ccl {
  font-size: 10px;
  color: var(--ink-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.h-cust-cell .ccv {
  font-size: 13px;
  color: var(--ink);
  font-weight: 600;
  word-break: break-word;
}
.h-cust-cell .ccv a {
  color: var(--gold);
  text-decoration: none;
}

/* ESTIMATE COMPACT BAR */
.h-estimate-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 16px;
}
@media (max-width: 720px) { .h-estimate-bar { grid-template-columns: 1fr 1fr; } }
.h-est-bar-cell {
  text-align: center;
  padding: 4px 0;
}
.h-est-bar-cell .ebl {
  font-size: 10px;
  color: var(--ink-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.h-est-bar-cell .ebv {
  font-family: var(--display);
  font-size: 17px;
  color: var(--gold);
  font-weight: 700;
  margin-top: 2px;
}

/* COLLAPSIBLE SECTIONS */
.h-collapsible {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}
.h-collapsible-header {
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
}
.h-collapsible-header:hover { background: var(--card); }
.h-collapsible-arrow {
  font-size: 12px;
  transition: transform 0.2s;
}
.h-collapsible.expanded .h-collapsible-arrow {
  transform: rotate(90deg);
}
.h-collapsible-body {
  display: none;
  padding: 0 16px 14px;
}
.h-collapsible.expanded .h-collapsible-body {
  display: block;
}

/* PRINT BUTTON */
.h-print-btn {
  padding: 8px 14px;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.15s;
}
.h-print-btn:hover { background: var(--gold-2); color: #fff; }

/* PRINT STYLES — for printing the job brief */
@media print {
  body * { visibility: hidden; }
  #handyman-modal, #handyman-modal * { visibility: visible; }
  #handyman-modal {
    position: absolute !important;
    top: 0; left: 0; right: 0;
    background: #fff !important;
    overflow: visible !important;
  }
  .h-modal-card {
    box-shadow: none !important;
    border: none !important;
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .modal-close, .modal-actions, .h-collapsible-header[onclick] { display: none !important; }
  .h-collapsible-body { display: block !important; }
  .h-action-block { break-inside: avoid; }
}

.est-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}
.est-total {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 1px;
  color: var(--gold);
}
.est-total-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--ink-muted);
  text-transform: uppercase;
}

/* ============ EDIT MODAL ============ */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  padding: 20px;
  overflow-y: auto;
}
.modal-backdrop.show { display: block; }
.modal-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  max-width: 1000px;
  margin: 20px auto;
  padding: 28px 32px;
  position: relative;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-head h2 {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--gold);
}
.modal-head .ref-sub {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  margin-top: 4px;
  text-transform: uppercase;
}
.modal-close {
  background: none;
  border: none;
  color: var(--ink-muted);
  cursor: pointer;
  font-size: 24px;
  padding: 4px 10px;
}
.modal-close:hover { color: var(--gold); }

/* ============ CUSTOMER REQUEST PANEL ============ */
.cust-panel {
  background: var(--navy);
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 22px;
}
.cust-panel h3 {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 14px;
}
.cust-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  font-size: 13px;
  margin-bottom: 12px;
}
@media (max-width: 640px) { .cust-grid { grid-template-columns: 1fr; } }
.cust-field { display: flex; flex-direction: column; gap: 2px; }
.cust-field .lbl {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  text-transform: uppercase;
}
.cust-field .val { color: var(--ink); font-weight: 500; }
.cust-field a { color: var(--gold); text-decoration: none; }

.answers-list {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
}
.answer-row {
  display: flex;
  font-size: 13px;
  padding: 4px 0;
  gap: 12px;
}
.answer-row .ak {
  color: var(--ink-muted);
  text-transform: capitalize;
  min-width: 140px;
  font-size: 12px;
}
.answer-row .av { color: var(--ink-soft); flex: 1; }

.cust-photos {
  margin-top: 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.cust-photos img {
  width: 80px; height: 80px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--line-soft);
}

/* ============ AI GENERATE BUTTON ============ */
.ai-bar {
  background: linear-gradient(135deg, var(--gold-soft), transparent);
  border: 1.5px solid var(--gold);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.ai-bar-text { flex: 1; min-width: 200px; }
.ai-bar h4 {
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 4px;
}
.ai-bar p { font-size: 13px; color: var(--ink-soft); }
.btn-ai {
  padding: 12px 24px;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1.5px;
  cursor: pointer;
  font-family: var(--body);
  text-transform: uppercase;
  white-space: nowrap;
}
.btn-ai:hover:not(:disabled) { background: var(--gold-2); }
.btn-ai:disabled { opacity: 0.6; cursor: not-allowed; }
.ai-spin {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(11, 24, 40, 0.3);
  border-top-color: var(--navy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ FORM SECTIONS ============ */
.form-section { margin-bottom: 28px; }
.section-label {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 2.5px;
  color: var(--gold);
  margin-bottom: 10px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label .pill {
  background: var(--gold-soft);
  color: var(--gold);
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 10px;
}
.input, .textarea, .select {
  width: 100%;
  padding: 11px 14px;
  background: var(--navy);
  border: 1.5px solid var(--line-soft);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  border-radius: 8px;
}
.textarea { resize: vertical; min-height: 80px; font-family: var(--body); }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--gold); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.field-row.three { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 640px) { .field-row, .field-row.three { grid-template-columns: 1fr; } }

/* ============ LINE ITEMS ============ */
.lines-table { width: 100%; border-collapse: collapse; }
.lines-table th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--ink-muted);
  padding: 8px 6px;
  border-bottom: 1px solid var(--line-soft);
  text-transform: uppercase;
}
.lines-table th.right { text-align: right; }
.lines-table td {
  padding: 8px 6px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.lines-table input {
  width: 100%;
  padding: 8px 10px;
  background: var(--navy);
  border: 1px solid var(--line-soft);
  color: var(--ink);
  border-radius: 6px;
  font-family: var(--body);
  font-size: 13px;
}
.lines-table input.right { text-align: right; }
.lines-table .del {
  background: var(--bad-bg);
  color: var(--bad);
  border: none;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}
.add-row {
  margin-top: 10px;
  padding: 8px 14px;
  background: var(--gold-soft);
  border: 1px dashed var(--line);
  color: var(--gold);
  font-size: 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--body);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ============ CUSTOMER PREVIEW PANEL ============ */
.cv-panel {
  background: var(--navy-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 22px;
}
.cv-panel h3 {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cv-toggles {
  display: flex;
  gap: 18px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.cv-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
}
.cv-toggle input { width: 16px; height: 16px; accent-color: var(--gold); }
.cv-markup {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--ink-soft);
}
.cv-markup input {
  width: 70px;
  padding: 6px 10px;
  background: var(--navy);
  border: 1px solid var(--line-soft);
  color: var(--ink);
  border-radius: 6px;
  font-family: var(--body);
}
.cv-preview {
  background: var(--navy);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 12px;
  color: var(--ink-muted);
}
.cv-preview .cv-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
}
.cv-preview .cv-row.total {
  border-top: 1px dashed var(--line-soft);
  margin-top: 6px;
  padding-top: 8px;
  color: var(--gold);
  font-weight: 600;
}

/* ============ TOTALS BOX ============ */
.totals-box {
  background: linear-gradient(135deg, var(--card-2), var(--navy-2));
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 26px;
  margin-bottom: 22px;
}
.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 14px;
  color: var(--ink-soft);
}
.total-row.grand {
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-family: var(--display);
  font-size: 26px;
  letter-spacing: 1.5px;
  color: var(--gold);
}

/* ============ MODAL ACTIONS ============ */
.modal-actions {
  display: flex;
  gap: 10px;
  padding-top: 16px;
  border-top: 1px solid var(--line-soft);
  flex-wrap: wrap;
}
.btn {
  padding: 12px 22px;
  border: none;
  border-radius: 10px;
  font-family: var(--body);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1.5px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all .15s;
}
.btn-secondary {
  background: var(--card-2);
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.btn-secondary:hover { border-color: var(--gold); color: var(--gold); }
.btn-primary {
  background: var(--gold);
  color: var(--navy);
}
.btn-primary:hover { background: var(--gold-2); }
.btn-danger {
  background: var(--bad-bg);
  color: var(--bad);
  border: 1px solid var(--bad);
  margin-left: auto;
}
.btn-danger:hover { background: var(--bad); color: #fff; }

/* ============ INVOICE MODAL ============ */
.inv-pay-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.inv-pay-opt {
  padding: 12px 14px;
  background: var(--navy);
  border: 1.5px solid var(--line-soft);
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all .15s;
}
.inv-pay-opt:hover { border-color: var(--gold); }
.inv-pay-opt.active {
  border-color: var(--gold);
  background: var(--gold-soft);
  color: var(--gold);
}
.inv-pay-opt .check {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}
.inv-pay-opt.active .check {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--navy);
}

/* ============ TOAST ============ */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--card);
  border: 1px solid var(--gold);
  color: var(--ink);
  padding: 14px 24px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 200;
  transition: transform .3s ease;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--bad); color: var(--bad); }
.toast.success { border-color: var(--good); color: var(--good); }

/* ============ SEND CONFIRMATION MODAL ============ */
.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 150;
  padding: 20px;
  overflow-y: auto;
}
.confirm-overlay.show { display: block; }
.confirm-card {
  background: var(--card);
  border: 1px solid var(--gold);
  border-radius: 16px;
  max-width: 600px;
  margin: 40px auto;
  padding: 28px 32px;
  position: relative;
}
.confirm-head {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line-soft);
}
.confirm-head h3 {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--gold);
}
.confirm-head .sub {
  font-size: 13px;
  color: var(--ink-muted);
  margin-top: 4px;
}
.confirm-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;

.confirm-field label {

  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  margin-bottom: 6px;
  text-transform: uppercase;

.confirm-field input,
.confirm-field textarea,
.confirm-field select {
  width: 100%;
  padding: 11px 14px;
  background: var(--navy);
  border: 1.5px solid var(--line-soft);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  border-radius: 8px;
}
.confirm-field textarea { resize: vertical; min-height: 70px; }
.confirm-mode {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.confirm-mode-btn {
  padding: 8px 14px;
  background: var(--card-2);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  text-transform: uppercase;
  font-family: inherit;
}
.confirm-mode-btn.active {

<body>

<script>
/* ============ AUTH ============ */
const DASHBOARD_PASSWORD = 'L0nd0n12@';
function attemptLogin() {
  const pw = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  if (pw === DASHBOARD_PASSWORD) {
    sessionStorage.setItem('sbc_dash_auth', 'ok');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    initDashboard();
  } else {
    err.textContent = 'Incorrect password.';
  }
}
function logout() {
  sessionStorage.removeItem('sbc_dash_auth');
  location.reload();
}
document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') attemptLogin();
});

/* ============ STATE ============ */
const TABS = [
  { id: 'all', label: 'All', icon: '📋' },
  { id: 'new', label: 'New', icon: '🆕' },
  { id: 'drafted', label: 'Drafted', icon: '📝' },
  { id: 'sent', label: 'Sent', icon: '📤' },
  { id: 'accepted', label: 'Accepted', icon: '✓' },
  { id: 'declined', label: 'Declined', icon: '✕' },
  { id: 'invoiced', label: 'Invoiced', icon: '🧾' },
  { id: 'paid', label: 'Paid', icon: '💰' },
  { id: 'handyman', label: 'Handyman', icon: '🔧' },
  { id: 'visitors', label: 'Live Visitors', icon: '👀' },
  { id: 'seo', label: 'SEO Brain', icon: '🧠' },
  { id: 'content', label: 'Content', icon: '✍️' },
];
let activeTab = 'all';
let estimates = [];
let handymanBookings = [];
let currentRecord = null;
let currentLines = { labor: [], materials: [] };

/* ============ STARTUP ============ */
if (sessionStorage.getItem('sbc_dash_auth') === 'ok') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  initDashboard();
}

async function initDashboard() {
  renderTabs();
  await loadEstimates();
}

/* ============ UTILS ============ */
const fmt = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';

function calcTotal(est) {
  const lab = (est?.labor||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.unitPrice)||0),0);
  const mat = (est?.materials||[]).reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.unitPrice)||0),0);
  const sub = lab+mat;
  const pct = Number(est?.markupPct||0);
  return sub + sub*(pct/100);
}

function calcCustomerView(est) {
  if (!est) return { sub:0, mu:0, customerTotal:0, showLab:false, showMat:false, lab:0, mat:0 };
  const lab = (est.labor||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.unitPrice)||0),0);
  const mat = (est.materials||[]).reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.unitPrice)||0),0);
  const sub = lab + mat;
  const pct = Number(est.markupPct||0);
  const mu = sub*(pct/100);
  return {
    sub, mu, lab, mat,
    customerTotal: sub+mu,
    showLab: est.showLaborCost !== false,
    showMat: est.showMaterialsCost !== false
  };
}

function toast(msg, kind='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + kind;
  setTimeout(()=> t.className='toast', 2400);
}

function normalizeDisplayFlags(est) {
  if (!est) return;
  if (est.showLaborCost === undefined) est.showLaborCost = true;
  if (est.showMaterialsCost === undefined) est.showMaterialsCost = true;
  if (!est.markupPct) est.markupPct = 0;
}

/* ============ TABS ============ */
function renderTabs() {
  const counts = {
    all: estimates.length,
    new: estimates.filter(e=>!e.estimate?.status || e.estimate?.status==='new').length,
    drafted: estimates.filter(e=>e.estimate?.status==='drafted').length,
    sent: estimates.filter(e=>e.estimate?.status==='sent').length,
    accepted: estimates.filter(e=>e.estimate?.status==='accepted').length,
    declined: estimates.filter(e=>e.estimate?.status==='declined').length,
    invoiced: estimates.filter(e=>e.estimate?.status==='invoiced').length,
    paid: estimates.filter(e=>e.estimate?.status==='paid').length,
    handyman: handymanBookings.length,
    visitors: '·',
    seo: '🧠',
    content: '✍️'
  };
  document.getElementById('tabs-row').innerHTML = TABS.map(t=>`
    <button class="tab ${activeTab===t.id?'active':''}" onclick="activeTab='${t.id}'; renderTabs(); renderList();">
      <span>${t.icon}</span>
      <span>${t.label}</span>
      <span class="tab-count">${counts[t.id]}</span>
    </button>
  `).join('');
}

/* ============ LIST LOAD ============ */
async function loadEstimates() {
  document.getElementById('list-count').textContent = 'Loading…';
  try {
    const res = await fetch('/.netlify/functions/list-estimates');
    const data = await res.json();
    estimates = (data.estimates || []).sort((a,b)=>(b.estimate?.createdAt||0) - (a.estimate?.createdAt||0));
    estimates.forEach(r=>normalizeDisplayFlags(r.estimate));
  } catch(e) {
    estimates = [];
    toast('Failed to load estimates', 'error');
  }

  try {
    const hres = await fetch('/.netlify/functions/handyman-get');
    const hdata = await hres.json();
    handymanBookings = (hdata.bookings || []).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  } catch(e) {
    handymanBookings = [];
  }

  renderTabs();
  renderList();
}

/* ============ LIST RENDER ============ */
function renderList() {
  const body = document.getElementById('list-body');
  const cnt = document.getElementById('list-count');

  if (activeTab === 'handyman') {
    return renderHandymanList();
  }
  if (activeTab === 'visitors') {
    return renderVisitorsTab();
  }
  if (activeTab === 'seo') {
    return renderSeoTab();
  }
  if (activeTab === 'content') {
    return renderContentStudio();
  }

  let list = estimates;
  if (activeTab !== 'all') {
    list = estimates.filter(r => {
      const st = r.estimate?.status || 'new';
      return st === activeTab;
    });
  }

  cnt.textContent = `${list.length} estimate${list.length===1?'':'s'}`;

  if (list.length === 0) {
    body.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <h3>No Estimates Yet</h3>
        <p>New customer requests will appear here as they come in.</p>
      </div>`;
    return;
  }

  body.innerHTML = list.map(r=>{
    const e = r.estimate || {};
    const c = e.customer || {};
    const total = calcCustomerView(e).customerTotal;
    const status = e.status || 'new';
    return `
      <div class="est-card" onclick="openEdit('${r.ref}')">
        <div class="est-main">
          <div class="est-title">${esc(e.projectTitle || (c.firstName ? c.firstName + ' ' + (c.lastName||'') : 'Untitled Estimate'))}</div>
          <div class="est-meta">
            <span class="customer">${esc((c.firstName||'') + ' ' + (c.lastName||''))}</span>
            <span>${esc(c.phone||'no phone')}</span>
            <span>${fmtDate(e.createdAt)}</span>
            <span style="color:var(--gold);">${esc(r.ref)}</span>
          </div>
          <div class="est-badges">

/* ============ EDIT MODAL ============ */

  const r = estimates.find(x => x.ref === ref);

  currentRecord = r;
  normalizeDisplayFlags(r.estimate);
  currentLines.labor = JSON.parse(JSON.stringify(r.estimate?.labor || []));
  currentLines.materials = JSON.parse(JSON.stringify(r.estimate?.materials || []));
  renderEdit();
  document.getElementById('edit-modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

}

/* ============ QUOTE PHOTOS ============ */
async function handleQuotePhotos(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  if (!currentRecord) return;
  const est = currentRecord.estimate;
  est.quotePhotos = est.quotePhotos || [];
  for (const f of files) {
    const reader = new FileReader();
    const data = await new Promise(res => { reader.onload = ()=>res(reader.result); reader.readAsDataURL(f); });
    est.quotePhotos.push(data);
  }
  renderQuotePhotoPreview();
  toast(`Added ${files.length} photo${files.length===1?'':'s'}`);
}

function renderQuotePhotoPreview() {
  const wrap = document.getElementById('quote-photos-preview');
  if (!wrap) return;
  const photos = currentRecord?.estimate?.quotePhotos || [];
  if (!photos.length) { wrap.innerHTML = '<div style="font-size:12px;color:var(--ink-muted);">No photos added.</div>'; return; }
  wrap.innerHTML = photos.map((p,i)=>`
    <div style="position:relative;">
      <img src="${esc(p)}" onclick="openLightbox('${esc(p)}')" style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line-soft);">
      <button onclick="removeQuotePhoto(${i})" style="position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border:none;width:22px;height:22px;border-radius:50%;font-size:12px;cursor:pointer;">✕</button>
    </div>
  `).join('');
}

function removeQuotePhoto(idx) {
  if (!currentRecord) return;
  const est = currentRecord.estimate;
  if (!est.quotePhotos) return;
  est.quotePhotos.splice(idx, 1);
  renderQuotePhotoPreview();
  toast('Photo removed');
}

/* ============ MATERIALS SHOPPING LIST ============ */
async function findMaterials() {
  if (!currentRecord) return;
  const btn = document.getElementById('find-materials-btn');
  const spin = document.getElementById('find-mat-spin');
  btn.disabled = true;
  if (spin) spin.style.display = 'inline-block';

  try {
    const est = currentRecord.estimate;
    const materials = (est.materials || []).filter(m => m.desc && m.qty);
    if (materials.length === 0) {
      toast('Add materials to the line items first', 'error');
      btn.disabled = false;
      if (spin) spin.style.display = 'none';
      return;
    }

    const res = await fetch('/.netlify/functions/find-materials', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        materials,
        projectType: est.service || 'renovation',
        location: 'Brooklyn, NY'
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Find failed');

    est.savedMaterials = data.materials || [];
    est.materialsTotalEstimate = data.totalEstimate || 0;
    renderMaterialsList();
    toast(`Found ${est.savedMaterials.length} materials`, 'success');
  } catch (e) {
    toast(e.message || 'Failed to find materials', 'error');
  } finally {
    btn.disabled = false;
    if (spin) spin.style.display = 'none';
  }
}

function renderMaterialsList() {
  const wrap = document.getElementById('materials-list-body');
  if (!wrap) return;
  const est = currentRecord?.estimate;
  if (!est?.savedMaterials || est.savedMaterials.length === 0) {
    wrap.innerHTML = '<div style="font-size:12px;color:var(--ink-muted);padding:10px 0;">No materials found yet. Click "Find Materials Now" above.</div>';
    return;
  }

  const grouped = {};
  est.savedMaterials.forEach(m => {
    const cat = m.category || 'Other';
    grouped[cat] = grouped[cat] || [];
    grouped[cat].push(m);
  });

  let html = `<div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
    <strong style="color:var(--gold);font-family:var(--display);letter-spacing:2px;font-size:13px;">📦 Materials List</strong>
    <button class="btn btn-secondary" onclick="copyMaterialsList()" style="font-size:11px;padding:6px 12px;">📋 Copy List</button>
  </div>`;

  Object.keys(grouped).forEach(cat => {
    html += `<div style="margin-bottom:14px;">
      <div style="font-weight:600;color:var(--gold);margin-bottom:6px;font-size:13px;">${esc(cat)}</div>`;
    grouped[cat].forEach(m => {
      const total = Number(m.totalEstimate || 0);
      html += `<div style="padding:10px 12px;background:var(--navy);border:1px solid var(--line-soft);border-radius:8px;margin-bottom:6px;font-size:12px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;">
          <div style="flex:1;min-width:0;">
            <div style="color:var(--ink);font-weight:600;">${esc(m.name || m.description)}</div>
            ${m.spec ? `<div style="color:var(--ink-muted);font-size:11px;margin-top:2px;">${esc(m.spec)}</div>` : ''}
            <div style="color:var(--ink-soft);font-size:11px;margin-top:2px;">${esc(m.qty)} ${esc(m.unit || '')} × ${fmt(m.estimatedUnitCost||0)}</div>
          </div>
          <div style="text-align:right;color:var(--gold);font-weight:700;flex-shrink:0;">${fmt(total)}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${m.searchQuery ? `
            <a href="https://www.homedepot.com/s/${encodeURIComponent(m.searchQuery)}" target="_blank" style="font-size:11px;padding:4px 10px;background:#f96302;color:#fff;border-radius:4px;text-decoration:none;font-weight:600;">🏠 Home Depot</a>
            <a href="https://www.lowes.com/search?searchTerm=${encodeURIComponent(m.searchQuery)}" target="_blank" style="font-size:11px;padding:4px 10px;background:#004990;color:#fff;border-radius:4px;text-decoration:none;font-weight:600;">🔵 Lowe's</a>
            <a href="https://www.amazon.com/s?k=${encodeURIComponent(m.searchQuery)}" target="_blank" style="font-size:11px;padding:4px 10px;background:#ff9900;color:#000;border-radius:4px;text-decoration:none;font-weight:600;">📦 Amazon</a>
          ` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  html += `<div style="margin-top:14px;padding:12px 14px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;display:flex;justify-content:space-between;">
    <span style="color:var(--gold);font-weight:700;letter-spacing:1px;font-family:var(--display);">MATERIALS ESTIMATE</span>
    <span style="color:var(--gold);font-weight:700;font-size:16px;">${fmt(est.materialsTotalEstimate || 0)}</span>
  </div>`;

  wrap.innerHTML = html;
}

function copyMaterialsList() {
  if (!currentRecord?.estimate?.savedMaterials) return;
  const est = currentRecord.estimate;
  let text = `Materials Shopping List — ${est.projectTitle || 'Project'}\n${'='.repeat(40)}\n\n`;
  est.savedMaterials.forEach(m => {
    text += `• ${m.name || m.description}\n`;
    if (m.spec) text += `  ${m.spec}\n`;
    text += `  Qty: ${m.qty} ${m.unit || ''} × $${m.estimatedUnitCost || 0} = $${m.totalEstimate || 0}\n`;
    if (m.searchQuery) text += `  Search: ${m.searchQuery}\n`;
    text += `\n`;
  });
  text += `\nTOTAL ESTIMATE: $${est.materialsTotalEstimate || 0}\n`;
  navigator.clipboard.writeText(text).then(()=> toast('Materials list copied to clipboard', 'success'));
}

/* ============ AI RENDER ============ */
function getRenderSourcePhotos() {
  if (!currentRecord) return [];
  const req = currentRecord.request || {};
  const photos = Array.isArray(req.photos) ? req.photos : [];
  return photos;
}

function renderAIRenderSection() {
  const wrap = document.getElementById('ai-render-section');
  if (!wrap) return;
  const photos = getRenderSourcePhotos();
  const est = currentRecord?.estimate;
  const existing = est?.aiRender;

  let html = '';
  if (photos.length === 0) {
    html = '<div style="font-size:12px;color:var(--ink-muted);">No customer photos to render from.</div>';
  } else {
    html = `<div style="margin-bottom:10px;font-size:12px;color:var(--ink-soft);">Pick a source photo:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${photos.map((p,i)=>`<img src="${esc(p)}" onclick="selectRenderPhoto(${i})" id="rs-${i}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid ${currentRecord._renderIdx===i?'var(--gold)':'var(--line-soft)'};">`).join('')}
      </div>
      <button class="btn btn-primary" id="render-btn" onclick="generateRender()" ${currentRecord._renderIdx===undefined?'disabled':''}>
        <span id="render-spin" style="display:none;"><span class="ai-spin"></span></span>
        ✨ Generate Render
      </button>`;
  }

  if (existing) {
    html += `
      <div style="margin-top:18px;padding:14px;background:var(--navy);border:1px solid var(--gold);border-radius:10px;">
        <div style="font-size:11px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;font-weight:600;">Latest Render</div>
        <img src="${esc(existing.url)}" style="max-width:100%;border-radius:8px;cursor:pointer;" onclick="openLightbox('${esc(existing.url)}')">
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secondary" onclick="addRenderToQuote()" style="font-size:11px;padding:8px 14px;">📎 Add to Quote Photos</button>
          <button class="btn btn-secondary" onclick="dismissRender()" style="font-size:11px;padding:8px 14px;">✕ Dismiss</button>
        </div>
      </div>`;
  }

  wrap.innerHTML = html;
}

function selectRenderPhoto(idx) {
  if (!currentRecord) return;
  currentRecord._renderIdx = idx;
  renderAIRenderSection();
}

async function generateRender() {
  if (!currentRecord || currentRecord._renderIdx === undefined) return;
  const photos = getRenderSourcePhotos();
  const photo = photos[currentRecord._renderIdx];
  if (!photo) return;
  const btn = document.getElementById('render-btn');
  const spin = document.getElementById('render-spin');
  if (btn) btn.disabled = true;
  if (spin) spin.style.display = 'inline-block';

  try {
    const est = currentRecord.estimate;
    const res = await fetch('/.netlify/functions/generate-render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        photo,
        prompt: `${est.service || 'renovation'} ${est.projectTitle || ''} ${est.summary || ''}`
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Render failed');
    est.aiRender = { url: data.url, ts: Date.now() };
    renderAIRenderSection();
    toast('Render ready!', 'success');
  } catch (e) {
    toast(e.message || 'Render failed', 'error');
  } finally {
    if (btn) btn.disabled = false;
    if (spin) spin.style.display = 'none';
  }
}

function dismissRender() {
  if (!currentRecord?.estimate?.aiRender) return;
  delete currentRecord.estimate.aiRender;
  renderAIRenderSection();
}

function addRenderToQuote() {
  if (!currentRecord?.estimate?.aiRender) return;
  const est = currentRecord.estimate;
  est.quotePhotos = est.quotePhotos || [];
  est.quotePhotos.push(est.aiRender.url);
  renderQuotePhotoPreview();
  toast('Render added to quote photos!', 'success');
}

  currentRecord.estimate.showMaterialsCost = document.getElementById('cv-show-materials').checked;

function updateCvPreview() {
  if (!currentRecord) return;
  const cv = calcCustomerView(currentRecord.estimate);

  html += `<div class="cv-row total"><span>Customer Total</span><span>${fmt(cv.customerTotal)}</span></div>`;

/* ============ LINE ITEMS ============ */
function renderLines() {
  const lab = document.getElementById('labor-body');
  const mat = document.getElementById('materials-body');
  if (!lab || !mat) return;
  lab.innerHTML = currentLines.labor.map((l,i)=>lineRow('labor',l,i)).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--ink-muted);padding:14px;">No labor lines yet.</td></tr>';
  mat.innerHTML = currentLines.materials.map((l,i)=>lineRow('materials',l,i)).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--ink-muted);padding:14px;">No material lines yet.</td></tr>';
  attachLineListeners();
}

function lineRow(kind, l, i) {
  const total = (Number(l.qty)||0) * (Number(l.unitPrice)||0);
  return `<tr data-kind="${kind}" data-idx="${i}">
    <td><input type="text" value="${esc(l.desc||'')}" data-field="desc"></td>
    <td><input class="right" type="number" step="0.01" value="${l.qty||''}" data-field="qty"></td>
    <td><input type="text" value="${esc(l.unit||'')}" data-field="unit" placeholder="hr/ea"></td>
    <td><input class="right" type="number" step="0.01" value="${l.unitPrice||''}" data-field="unitPrice"></td>
    <td class="right" style="font-weight:600;color:var(--gold);">${fmt(total)}</td>
    <td><button class="del" onclick="deleteLine('${kind}',${i})">×</button></td>
  </tr>`;
}

function addLine(kind) {
  currentLines[kind].push({ desc:'', qty:1, unit:'', unitPrice:0 });
  renderLines();
  recalc();
}

function deleteLine(kind, idx) {
  currentLines[kind].splice(idx, 1);
  renderLines();
  recalc();
}

function attachLineListeners() {
  document.querySelectorAll('.lines-table tbody tr').forEach(tr=>{
    const kind = tr.dataset.kind;
    const idx = Number(tr.dataset.idx);
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const f = inp.dataset.field;
        let v = inp.value;
        if (f === 'qty' || f === 'unitPrice') v = Number(v) || 0;
        currentLines[kind][idx][f] = v;
        syncLines();
        recalc();
      });
    });
  });
}

function syncLines() {
  if (!currentRecord) return;
  currentRecord.estimate.labor = JSON.parse(JSON.stringify(currentLines.labor));
  currentRecord.estimate.materials = JSON.parse(JSON.stringify(currentLines.materials));
}

function recalc() {
  if (!currentRecord) return;
  const muInput = document.getElementById('cv-markup');
  if (muInput) currentRecord.estimate.markupPct = Number(muInput.value) || 0;
  const cv = calcCustomerView(currentRecord.estimate);

  // Update line totals in DOM
  document.querySelectorAll('.lines-table tbody tr').forEach(tr=>{
    const kind = tr.dataset.kind;
    const idx = Number(tr.dataset.idx);
    const l = currentLines[kind][idx];
    const total = (Number(l.qty)||0) * (Number(l.unitPrice)||0);
    const cells = tr.querySelectorAll('td');
    if (cells[4]) cells[4].textContent = fmt(total);
  });

  // Totals box
  const tb = document.getElementById('totals-box');
  if (tb) {
    tb.innerHTML = `
      <div class="total-row"><span>Labor Cost</span><span>${fmt(cv.lab)}</span></div>
      <div class="total-row"><span>Materials Cost</span><span>${fmt(cv.mat)}</span></div>
      <div class="total-row"><span>Markup (${currentRecord.estimate.markupPct||0}%)</span><span>${fmt(cv.mu)}</span></div>
      <div class="total-row grand"><span>Customer Total</span><span>${fmt(cv.customerTotal)}</span></div>
    `;
  }

  updateCvPreview();
}

/* ============ AI ============ */
async function generateAI() {
  if (!currentRecord) return;
  const btn = document.getElementById('ai-btn');
  const spin = document.getElementById('ai-spin-w');
  btn.disabled = true;
  spin.style.display = 'inline-block';

  try {
    const r = currentRecord;
    const res = await fetch('/.netlify/functions/generate-estimate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        request: r.request || {},
        customer: r.estimate?.customer || {}
      })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'AI failed');

    const est = currentRecord.estimate;
    est.projectTitle = data.projectTitle || est.projectTitle;
    est.summary = data.summary || est.summary;
    est.scopeOfWork = data.scopeOfWork || est.scopeOfWork;
    est.timelineText = data.timelineText || est.timelineText;
    est.labor = data.labor || est.labor || [];
    est.materials = data.materials || est.materials || [];

    currentLines.labor = JSON.parse(JSON.stringify(est.labor));
    currentLines.materials = JSON.parse(JSON.stringify(est.materials));

    renderEdit();
    toast('AI draft ready!', 'success');
  } catch (e) {
    toast(e.message || 'AI failed', 'error');
  } finally {
    btn.disabled = false;
    spin.style.display = 'none';
  }
}

/* ============ GATHER FORM ============ */
function gatherForm() {
  if (!currentRecord) return null;
  const est = currentRecord.estimate;
  return {
    ref: currentRecord.ref,
    customer: est.customer,
    service: document.getElementById('ed-service')?.value || est.service,
    projectTitle: document.getElementById('ed-title')?.value || est.projectTitle,
    summary: document.getElementById('ed-summary')?.value || est.summary,
    scopeOfWork: document.getElementById('ed-scope')?.value || est.scopeOfWork,
    timelineText: document.getElementById('ed-timeline')?.value || est.timelineText,
    notes: document.getElementById('ed-notes')?.value || est.notes,
    markupPct: Number(document.getElementById('cv-markup')?.value || est.markupPct || 0),
    showLaborCost: document.getElementById('cv-show-labor')?.checked,
    showMaterialsCost: document.getElementById('cv-show-materials')?.checked,
    labor: currentLines.labor,
    materials: currentLines.materials,
    quotePhotos: est.quotePhotos || [],
    aiRender: est.aiRender,
    savedMaterials: est.savedMaterials || [],
    materialsTotalEstimate: est.materialsTotalEstimate || 0,
    status: est.status,
    createdAt: est.createdAt
  };
}

/* ============ SAVE ============ */
async function saveDraft() {
  syncLines();
  const data = gatherForm();
  if (!data) return;
  try {
    const res = await fetch('/.netlify/functions/save-estimate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: currentRecord.ref, estimate: data })
    });
    if (!res.ok) throw new Error('Save failed');
    if (!currentRecord.estimate.status || currentRecord.estimate.status === 'new') {
      currentRecord.estimate.status = 'drafted';
    }
    Object.assign(currentRecord.estimate, data);
    toast('Saved!', 'success');
    await loadEstimates();
  } catch (e) {
    toast('Save failed: ' + e.message, 'error');
  }
}

async function sendToCustomer() {
  syncLines();
  const data = gatherForm();
  if (!data) return;
  try {
    await fetch('/.netlify/functions/save-estimate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: currentRecord.ref, estimate: data })
    });
    const res = await fetch('/.netlify/functions/send-quote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: currentRecord.ref })
    });
    const result = await res.json();
    if (!result.success) throw new Error(result.error || 'Send failed');
    currentRecord.estimate.status = 'sent';
    toast('Quote sent to customer!', 'success');
    closeEdit();
    await loadEstimates();
  } catch (e) {
    toast('Send failed: ' + e.message, 'error');
  }
}

async function deleteEstimate() {
  if (!currentRecord) return;
  if (!confirm(`Delete estimate ${currentRecord.ref}? This cannot be undone.`)) return;
  try {
    const res = await fetch('/.netlify/functions/delete-estimate', {
      method: 'POST',

      body: JSON.stringify({ ref: currentRecord.ref })
    });
    if (!res.ok) throw new Error('Delete failed');
    toast('Deleted', 'success');
    closeEdit();

  } catch (e) {
    toast('Delete failed: ' + e.message, 'error');

}

function openInvoiceModal() {

function closeInvoiceModal() {
  document.getElementById('invoice-modal').classList.remove('show');

}

function renderInvoiceModal() {
  if (!currentRecord || !invoiceState) return;
  const cv = calcCustomerView(currentRecord.estimate);
  const r = currentRecord;
  const c = r.estimate?.customer || {};

  document.getElementById('invoice-card').innerHTML = `
    <div class="modal-head">
      <div>

        <button class="btn ${invoiceState.type==='progress'?'btn-primary':'btn-secondary'}" onclick="setInvoiceType('progress')">Progress</button>
        <button class="btn ${invoiceState.type==='final'?'btn-primary':'btn-secondary'}" onclick="setInvoiceType('final')">Final</button>
      </div>
      <div style="margin-bottom:10px;font-size:13px;color:var(--ink-soft);">
        Quote Total: <span style="color:var(--gold);font-weight:700;">${fmt(cv.customerTotal)}</span>
      </div>
      <input class="input" type="number" id="inv-amount" value="${invoiceState.amount}" step="0.01" oninput="updateInvoiceState()">
    </div>

    <div class="form-section">
      <div class="section-label">Payment Methods</div>
      <div class="inv-pay-grid">
        ${buildPayOpt('zelle', '💸 Zelle')}
        ${buildPayOpt('check', '📝 Check')}
        ${buildPayOpt('card', '💳 Card / Online')}
      </div>
      <div id="card-link-row" style="display:${invoiceState.paymentMethods.card?'block':'none'};margin-top:8px;">
        <input class="input" id="inv-card-link" placeholder="Card payment URL (Stripe / Chase / Square…)" value="${esc(invoiceState.paymentLinks.card||'')}" oninput="updateInvoiceState()">
      </div>
    </div>

    <div class="form-section">
      <div class="section-label">Notes (optional)</div>
      <textarea class="textarea" id="inv-notes" placeholder="e.g. Thanks for choosing Sani! Payment due within 7 days.">${esc(invoiceState.notes||'')}</textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeInvoiceModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitInvoice()">📤 Send Invoice</button>
    </div>
  `;
}

function buildPayOpt(key, label) {
  const active = invoiceState.paymentMethods[key];
  return `<div class="inv-pay-opt ${active?'active':''}" onclick="setPaymentMethod('${key}')">
    <div class="check">${active?'✓':''}</div>
    <span>${label}</span>
  </div>`;
}

function setInvoiceType(t) {
  if (!invoiceState || !currentRecord) return;
  invoiceState.type = t;
  const cv = calcCustomerView(currentRecord.estimate);
  if (t === 'deposit') invoiceState.amount = Math.round(cv.customerTotal * 0.5);
  else if (t === 'progress') invoiceState.amount = Math.round(cv.customerTotal * 0.3);
  else invoiceState.amount = cv.customerTotal;
  renderInvoiceModal();
}

function setPaymentMethod(key) {
  if (!invoiceState) return;
  invoiceState.paymentMethods[key] = !invoiceState.paymentMethods[key];
  if (key === 'card') togglePaymentLink();
  renderInvoiceModal();
}

function togglePaymentLink() {
  const row = document.getElementById('card-link-row');
  if (!row) return;
  row.style.display = invoiceState.paymentMethods.card ? 'block' : 'none';
}

function updateInvoiceState() {
  if (!invoiceState) return;
  const amt = document.getElementById('inv-amount');
  const link = document.getElementById('inv-card-link');
  const notes = document.getElementById('inv-notes');
  if (amt) invoiceState.amount = Number(amt.value) || 0;
  if (link) invoiceState.paymentLinks.card = link.value;
  if (notes) invoiceState.notes = notes.value;
}

async function submitInvoice() {
  if (!currentRecord || !invoiceState) return;
  updateInvoiceState();
  try {
    const res = await fetch('/.netlify/functions/send-invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ref: currentRecord.ref,
        invoice: invoiceState
      })
    });
    const result = await res.json();
    if (!result.success) throw new Error(result.error || 'Failed');
    currentRecord.estimate.status = 'invoiced';
    toast('Invoice sent!', 'success');
    closeInvoiceModal();
    closeEdit();
    await loadEstimates();
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  }
}

}

function validateConfirmForm(showError = true) {
  if (!confirmState) return false;
  const cs = confirmState;
  if (cs.pricingMode === 'range') {
    cs.priceMin = Number(document.getElementById('cf-min')?.value || cs.priceMin);
    cs.priceMax = Number(document.getElementById('cf-max')?.value || cs.priceMax);
  } else if (cs.pricingMode === 'fixed') {
    cs.priceFixed = Number(document.getElementById('cf-fixed')?.value || cs.priceFixed);
  } else if (cs.pricingMode === 'capped') {
    cs.priceCapped = Number(document.getElementById('cf-capped')?.value || cs.priceCapped);

  cs.appointmentTime = document.getElementById('cf-time')?.value || cs.appointmentTime;

function drawSeoChart() {
  if (!seoData) return;
  const svg = document.getElementById('seo-chart');
  if (!svg) return;
  const data = seoData.weeklyClicks || [];
  if (!data.length) { svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#7a8aa3" font-size="13">No data yet</text>'; return; }
  const W = svg.clientWidth || 800;
  const H = 200;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const max = Math.max(...data.map(d=>d.clicks||0), 10);
  const stepX = (W - 60) / Math.max(data.length - 1, 1);
  const points = data.map((d,i)=>{
    const x = 40 + i * stepX;
    const y = H - 30 - ((d.clicks||0) / max) * (H - 50);
    return { x, y, val: d.clicks||0, label: d.week };
  });
  const pathD = points.map((p,i)=>`${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x},${H-30} L${points[0].x},${H-30} Z`;
  svg.innerHTML = `
    <defs><linearGradient id="seoGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4b572" stop-opacity="0.4"/><stop offset="100%" stop-color="#d4b572" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaD}" fill="url(#seoGrad)"/>
    <path d="${pathD}" fill="none" stroke="#d4b572" stroke-width="2"/>
    ${points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#d4b572"><title>${p.label}: ${p.val} clicks</title></circle>`).join('')}
  `;
}

const VISITS_KEY = 'sbc_visitors_state';
let visitorsTimer = null;

const PAGE_NAMES = {
  '/':'Home', '/about':'About', '/contact':'Contact', '/gallery':'Gallery',
  '/services':'Services', '/estimate':'Get Estimate', '/handyman-estimate':'Handyman',
  '/bathroom-renovation':'Bathroom Reno', '/kitchen-renovation':'Kitchen Reno',
  '/painting':'Painting', '/flooring':'Flooring', '/carpentry':'Carpentry'
};
const DEVICE_ICONS = { mobile:'📱', tablet:'📲', desktop:'🖥' };
const SOURCE_ICONS = { google:'🔍', direct:'➡️', referral:'🔗', social:'💬' };

function visHostOf(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch { return url || '—'; }
}
function visSourceLabel(s) { return s || 'Direct'; }
function visLoc(v) {
  return [v.city, v.region, v.country].filter(Boolean).join(', ') || 'Unknown';
}
function visAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  return Math.floor(s/3600) + 'h ago';
}
function visDur(secs) {
  if (!secs) return '—';
  if (secs < 60) return secs + 's';
  return Math.floor(secs/60) + 'm ' + (secs%60) + 's';
}

function stopVisitorsPolling() {
  if (visitorsTimer) { clearInterval(visitorsTimer); visitorsTimer = null; }
}

function renderVisitorsTab() {
  const body = document.getElementById('list-body');
  const cnt = document.getElementById('list-count');
  cnt.textContent = 'Live Visitors';

  visitorsTimer = setInterval(loadVisitors, 15000);
}

async function loadVisitors() {
  try {
    const res = await fetch('/.netlify/functions/visitors-live');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'No data');
    drawVisitors(data);
  } catch (e) {
    visitorsError(e.message);
  }
}

function visitorsError(msg) {
  const wrap = document.getElementById('visitors-wrap');
  if (!wrap) return;
  wrap.innerHTML = `<div style="text-align:center;padding:40px;color:var(--ink-muted);">
    <div style="font-size:14px;margin-bottom:8px;">Live visitors data unavailable</div>
    <div style="font-size:12px;">${esc(msg)}</div>
  </div>`;
}

function drawVisitors(data) {
  const wrap = document.getElementById('visitors-wrap');
  if (!wrap) return;
  const active = data.active || [];
  const total = data.totalToday || 0;

  let html = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;">
    <div class="seo-stat"><div class="lbl">Active Now</div><div class="val">${active.length}</div></div>
    <div class="seo-stat"><div class="lbl">Today</div><div class="val">${total}</div></div>
    <div class="seo-stat"><div class="lbl">Last Update</div><div class="val" style="font-size:14px;">${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div></div>
  </div>`;

  if (active.length === 0) {
    html += `<div class="empty"><div class="empty-icon">👀</div><h3>No active visitors right now.</h3></div>`;
  } else {
    html += `<div>${active.map(v=>{
      const di = DEVICE_ICONS[v.device]||'💻';
      const si = SOURCE_ICONS[v.source]||'🌐';
      return `<div class="est-card">
        <div class="est-main">
          <div class="est-title">${di} ${esc(PAGE_NAMES[v.page]||v.page)}</div>
          <div class="est-meta">
            <span>${si} ${esc(visSourceLabel(v.source))}</span>
            <span>📍 ${esc(visLoc(v))}</span>
            <span>⏱ ${visDur(v.duration)}</span>
            <span>${visAgo(v.firstSeen)}</span>
          </div>
          ${v.referrer ? `<div style="font-size:11px;color:var(--ink-muted);margin-top:4px;">via ${esc(visHostOf(v.referrer))}</div>` : ''}
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  wrap.innerHTML = html;
}

    drafted: (typeof estimates !== 'undefined' ? estimates.filter(e=>e.estimate?.status==='drafted').length : 0),

    accepted: (typeof estimates !== 'undefined' ? estimates.filter(e=>e.estimate?.status==='accepted').length : 0),
    declined: (typeof estimates !== 'undefined' ? estimates.filter(e=>e.estimate?.status==='declined').length : 0),

<script>
/* ===== SEND ESTIMATE LINK ===== */
const ESTIMATE_URL = 'https://sanibuildingcorp.com/estimate';

function openSendLinkModal() {
  document.getElementById('sl-overlay').style.display = 'block';
  document.body.style.overflow = 'hidden';
  attachSendLinkInputs();
}
function closeSendLinkModal() {
  document.getElementById('sl-overlay').style.display = 'none';
  document.body.style.overflow = '';
  document.getElementById('sl-name').value = '';
  document.getElementById('sl-phone').value = '';
  document.getElementById('sl-email').value = '';
  document.getElementById('sl-status').textContent = '';
}
function getSMSMessage() {
  const name = document.getElementById('sl-name').value.trim();
  const hi = name ? `Hi ${name}` : 'Hi';
  return `${hi}, this is Zurabi at Sani Building Corp. Please fill out a quick form so I can prepare your estimate: ${ESTIMATE_URL} — Thanks!`;
}
function getEmailSubject() { return 'Your Estimate Request — Sani Building Corp'; }
function getEmailBody() {
  const name = document.getElementById('sl-name').value.trim();
  const greet = name ? `Hi ${name},` : 'Hi,';
  return `${greet}%0D%0A%0D%0AThank you for your interest in Sani Building Corp! Please fill out our quick estimate form so I can prepare an accurate quote for your project:%0D%0A%0D%0A${ESTIMATE_URL}%0D%0A%0D%0AThe form takes about 5 minutes and lets you upload photos so I can give you the most accurate estimate possible.%0D%0A%0D%0ATalk soon,%0D%0AZurabi Asanashvili%0D%0ASani Building Corp%0D%0A332-277-0990`;
}
function updateSendLinkButtons() {
  const phone = document.getElementById('sl-phone').value.trim();
  const email = document.getElementById('sl-email').value.trim();
  document.getElementById('sl-sms-btn').style.opacity = phone ? '1' : '0.5';
  document.getElementById('sl-email-btn').style.opacity = email ? '1' : '0.5';
}
function attachSendLinkInputs() {
  ['sl-name','sl-phone','sl-email'].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el._slAttached) {
      el.addEventListener('input', updateSendLinkButtons);
      el._slAttached = true;
    }
  });
  updateSendLinkButtons();
}
function sendEstimateBySMS() {
  const phone = document.getElementById('sl-phone').value.trim();
  if (!phone) { showSendLinkError('Enter a phone number first'); return; }
  const msg = encodeURIComponent(getSMSMessage());
  const cleanPhone = phone.replace(/\s+/g,'');
  window.location.href = `sms:${cleanPhone}?&body=${msg}`;
  showSendLinkSuccess('Opening SMS app…');
}
function sendEstimateByEmail() {
  const email = document.getElementById('sl-email').value.trim();
  if (!email) { showSendLinkError('Enter an email first'); return; }
  const subj = encodeURIComponent(getEmailSubject());
  const body = getEmailBody();
  window.location.href = `mailto:${email}?subject=${subj}&body=${body}`;
  showSendLinkSuccess('Opening Email app…');
}
function copyEstimateLink() {
  navigator.clipboard.writeText(ESTIMATE_URL).then(()=>{
    showSendLinkSuccess('Link copied to clipboard!');
  }).catch(()=>{
    showSendLinkError('Copy failed');
  });
}
function showSendLinkError(msg) {
  const s = document.getElementById('sl-status');
  s.style.color = 'var(--bad)';
  s.textContent = msg;
}
function showSendLinkSuccess(msg) {
  const s = document.getElementById('sl-status');
  s.style.color = 'var(--good)';
  s.textContent = msg;
  setTimeout(()=>{ s.textContent=''; }, 3000);
}

document.addEventListener('DOMContentLoaded', () => {
  const fab = document.getElementById('sbc-fab');
  if (fab && sessionStorage.getItem('sbc_dash_auth') === 'ok') fab.style.display = 'flex';
});
const _origAttempt = attemptLogin;
attemptLogin = function() {
  _origAttempt.apply(this, arguments);
  if (sessionStorage.getItem('sbc_dash_auth') === 'ok') {
    const fab = document.getElementById('sbc-fab');
    if (fab) fab.style.display = 'flex';
  }
};
/* ===== END SEND ESTIMATE LINK ===== */
</script>
