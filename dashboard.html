<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Sani Building Corp</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b2a;--navy2:#1a2d42;--gold:#c9a84c;--gold-dark:#9a6f2a;--cream:#f5f0e8;--gray:#8a9bb0;--border:rgba(201,168,76,0.2);--success:#2ecc71;--warn:#e67e22;--danger:#e74c3c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(13,27,42,.95);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--gold);text-decoration:none}
.logo span{color:var(--cream)}
.userbar{display:flex;align-items:center;gap:14px;font-size:13px}
.userbar .who{color:var(--gray)}
.userbar button{background:none;border:1px solid var(--border);color:var(--cream);padding:6px 12px;border-radius:6px;font-family:inherit;font-size:12px;cursor:pointer}
.userbar button:hover{border-color:var(--gold);color:var(--gold)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 60px}
h1.page{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;margin-bottom:24px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{background:none;border:none;color:var(--gray);font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;padding:12px 18px;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;transition:all .18s;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--cream)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab .count{background:var(--navy2);color:var(--cream);font-size:11px;padding:2px 7px;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:600;letter-spacing:0}
.tab.active .count{background:var(--gold);color:var(--navy)}
.toolbar{display:flex;gap:12px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;background:var(--navy2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--cream);font-family:inherit;font-size:13px}
.search:focus{outline:none;border-color:var(--gold)}
.refresh{background:none;border:1px solid var(--border);color:var(--cream);padding:9px 14px;border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.refresh:hover{border-color:var(--gold);color:var(--gold)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto auto;gap:18px;align-items:center;cursor:pointer;transition:all .18s;text-decoration:none;color:inherit}
.row:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.status{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:5px 10px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.status-new{background:rgba(201,168,76,.18);color:var(--gold)}
.status-quoting{background:rgba(230,126,34,.18);color:var(--warn)}
.status-sent{background:rgba(52,152,219,.18);color:#5dade2}
.status-opened{background:rgba(155,89,182,.18);color:#bb8fce}
.status-accepted{background:rgba(46,204,113,.18);color:var(--success)}
.status-declined{background:rgba(231,76,60,.18);color:var(--danger)}
.row-main .name{font-weight:600;font-size:15px;margin-bottom:3px}
.row-main .meta{font-size:12px;color:var(--gray)}
.row-svc{font-size:13px;color:var(--cream);text-align:right}
.row-svc .timeline{font-size:11px;color:var(--gray);margin-top:3px}
.row-amount{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:1px;text-align:right;min-width:90px}
.empty{text-align:center;padding:60px 20px;color:var(--gray)}
.empty-icon{font-size:42px;margin-bottom:14px;opacity:.4}
.loading{text-align:center;padding:60px 20px;color:var(--gray)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{background:var(--navy2);border:1px solid var(--border);border-radius:16px;padding:40px 36px;max-width:380px;width:100%;text-align:center}
.gate-card h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;margin-bottom:8px}
.gate-card p{color:var(--gray);font-size:14px;margin-bottom:22px;line-height:1.5}
.gate-card button{background:var(--gold);color:var(--navy);border:none;padding:13px 28px;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer;width:100%}
.gate-card button:hover{background:var(--gold-dark);color:var(--cream)}
@media (max-width:640px){
  .wrap{padding:18px 14px 50px}
  h1.page{font-size:26px}
  .row{grid-template-columns:1fr;gap:8px;padding:14px 16px}
  .row-svc,.row-amount{text-align:left}
  .row-amount{font-size:16px}
  .tab{padding:10px 12px;font-size:11px}
}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/netlify-identity-widget@1.9.2/build/netlify-identity-widget.min.css">
</head>
<body>

<div id="app" style="display:none">
<header class="topbar">
  <a href="/" class="logo">SANI <span>BUILDING CORP</span></a>
  <div class="userbar">
    <span class="who" id="user-email"></span>
    <button onclick="netlifyIdentity.logout()">Sign out</button>
  </div>
</header>

<div class="wrap">
  <h1 class="page">Estimate Requests</h1>

  <div class="tabs" id="tabs">
    <button class="tab active" data-status="">All <span class="count" id="c-all">0</span></button>
    <button class="tab" data-status="new">New <span class="count" id="c-new">0</span></button>
    <button class="tab" data-status="quoting">Drafting <span class="count" id="c-quoting">0</span></button>
    <button class="tab" data-status="sent">Sent <span class="count" id="c-sent">0</span></button>
    <button class="tab" data-status="opened">Opened <span class="count" id="c-opened">0</span></button>
    <button class="tab" data-status="accepted">Accepted <span class="count" id="c-accepted">0</span></button>
  </div>

  <div class="toolbar">
    <input type="search" class="search" id="search" placeholder="Search by name, phone, email, ref…">
    <button class="refresh" onclick="loadRequests()">↻ Refresh</button>
  </div>

  <div id="list-container">
    <div class="loading">Loading…</div>
  </div>
</div>
</div>

<div id="gate" class="gate" style="display:none">
  <div class="gate-card">
    <h2>Dashboard</h2>
    <p>Sign in to view estimate requests, build scopes, and send quotes.</p>
    <button onclick="netlifyIdentity.open('login')">Sign In →</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/netlify-identity-widget@1.9.2/build/netlify-identity-widget.min.js"></script>
<script>
let allRequests = [];
let counts = {};
let currentStatus = "";
let currentSearch = "";

// ---------- Identity gate ----------
window.netlifyIdentity = window.netlifyIdentity || null;
if (window.netlifyIdentity) {
  netlifyIdentity.on("init", (user) => { renderAuthState(user); });
  netlifyIdentity.on("login", (user) => { netlifyIdentity.close(); renderAuthState(user); });
  netlifyIdentity.on("logout", () => { renderAuthState(null); });
  netlifyIdentity.init();
}

function renderAuthState(user) {
  if (user) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user-email").textContent = user.email;
    loadRequests();
    // Deep link to /request/REF
    if (location.hash.startsWith("#/request/")) {
      const ref = location.hash.replace("#/request/", "");
      if (ref) location.href = `/request-detail.html?ref=${encodeURIComponent(ref)}`;
    }
  } else {
    document.getElementById("gate").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
}

// ---------- Load + render ----------
async function loadRequests() {
  const container = document.getElementById("list-container");
  container.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const token = netlifyIdentity.currentUser()?.token?.access_token;
    const res = await fetch("/.netlify/functions/list-requests", {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allRequests = data.requests || [];
    counts = data.counts || {};
    updateCounts();
    renderList();
  } catch (e) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚠</div>Couldn't load requests. <br><small style="opacity:.6">${e.message}</small></div>`;
  }
}

function updateCounts() {
  document.getElementById("c-all").textContent = allRequests.length;
  document.getElementById("c-new").textContent = counts.new || 0;
  document.getElementById("c-quoting").textContent = counts.quoting || 0;
  document.getElementById("c-sent").textContent = counts.sent || 0;
  document.getElementById("c-opened").textContent = counts.opened || 0;
  document.getElementById("c-accepted").textContent = counts.accepted || 0;
}

function renderList() {
  const container = document.getElementById("list-container");
  let items = allRequests;
  if (currentStatus) items = items.filter(r => r.status === currentStatus);
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    items = items.filter(r =>
      (r.name||"").toLowerCase().includes(q) ||
      (r.email||"").toLowerCase().includes(q) ||
      (r.phone||"").includes(q) ||
      (r.ref||"").toLowerCase().includes(q) ||
      (r.service||"").toLowerCase().includes(q)
    );
  }
  if (items.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">📭</div>No requests${currentStatus ? ` in "${currentStatus}"` : ""} yet.</div>`;
    return;
  }
  container.innerHTML = '<div class="list">' + items.map(r => `
    <a href="/request-detail.html?ref=${encodeURIComponent(r.ref)}" class="row">
      <span class="status status-${r.status||'new'}">${r.status||'new'}</span>
      <div class="row-main">
        <div class="name">${esc(r.name)}</div>
        <div class="meta">${esc(r.phone)} · ${esc(r.ref)} · ${fmtDate(r.createdAt)}</div>
      </div>
      <div class="row-svc">
        ${esc(r.service)}
        <div class="timeline">${esc(r.timeline || r.propertyType || "")}</div>
      </div>
      <div class="row-amount">${r.quote?.total ? "$"+r.quote.total.toLocaleString() : "—"}</div>
    </a>
  `).join('') + '</div>';
}

function esc(s){if(!s)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(iso){
  if(!iso)return'';
  const d=new Date(iso);
  const now=new Date();
  const diff=(now-d)/1000;
  if(diff<60)return'just now';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  if(diff<86400*7)return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentStatus = btn.dataset.status;
  renderList();
});

document.getElementById("search").addEventListener("input", (e) => {
  currentSearch = e.target.value.trim();
  renderList();
});
</script>
</body>
</html>
